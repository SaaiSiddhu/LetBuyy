slos:
  - name: deployment-gate-success
    owner: platform-sre
    sli: successful_deployment_health_gates / total_deployment_health_gates
    target: 100
    window: 30d
    errorBudgetPolicy: block-production-promotion-on-failed-gate
    evidenceTable: deployment_health_gate_results
    # Phase O1 checked whether to emit this and deliberately did NOT: grepped
    # the whole repository and found ZERO writers to deployment_health_gate_
    # results anywhere -- only structural presence checks in two validators
    # and a read-only dashboard query (services/api-gateway/src/routes/
    # operations.ts). The table is permanently empty today, so an emitted
    # metric here would always carry sample_size=0 -- indistinguishable from
    # "monitored" to a reader who doesn't check the sample count. NOT
    # MEASURED, and deliberately NOT emitted until something actually writes
    # to this table. Its errorBudgetPolicy was NOT rewritten to a 6h cadence:
    # unlike the four emitted SLOs, this one describes a CI gate ACTION
    # (block promotion), not a detection window, so the emitter's cadence
    # does not bear on it.

  # Phase R1 additions below. DEFINITIONS ONLY at authoring time -- see
  # docs/evidence/production-readiness/<date>-readiness-evidence.md dimension
  # 10 for the honest status of each. Phase O1 (2026-08-24) began emitting
  # four of these six to RUNTIME_TELEMETRY (services/queue-workers/src/
  # slo-telemetry.ts, on the existing 6-hourly scheduled() cron) -- see each
  # SLO's own comment below for its emission status. Emitting is NOT
  # measuring: reading Analytics Engine back out needs Cloudflare API
  # credentials this repository does not have, and no alert/dashboard/page
  # is wired to any of these regardless of emission status
  # (SKIP-CAP-ALERTING-END-TO-END stays open). Do not read an "emits" note
  # below as "monitored."
  #
  # errorBudgetPolicy vs intendedErrorBudgetPolicy (owner decision,
  # 2026-08-24). The four emitted SLOs previously declared detection windows
  # -- 1h burn rate, 15m p95, "immediately" -- that the 6-hourly cron
  # (services/queue-workers/wrangler.toml, crons = ["17 */6 * * *"]) cannot
  # serve. Rather than leave policy text nothing can satisfy, each was
  # rewritten to what the current mechanism actually supports, and the
  # original posture preserved verbatim under intendedErrorBudgetPolicy.
  # Read `errorBudgetPolicy` as "what this catalog can honour today" and
  # `intendedErrorBudgetPolicy` as "the standing gap, and the bar to clear
  # before this SLO is genuinely operational." Neither field implies paging:
  # nothing pages anyone yet. The two non-emitted SLOs were deliberately not
  # rewritten -- see their own comments for why.

  - name: checkout-order-creation-success
    owner: commerce-platform
    sli: successful_create_checkout_order_calls / total_create_checkout_order_calls
    target: 99.9
    window: 30d
    errorBudgetPolicy: flag-at-next-6h-evaluation-if-30d-rate-below-target
    intendedErrorBudgetPolicy: page-on-call-if-burn-rate-exceeds-2x-over-1h
    evidenceTable: checkout_sessions
    # checkout_sessions.status ('completed' vs a failed/absent session) is
    # the real signal create_checkout_order (database/supabase/migrations/
    # 202_narrow_checkout_order_payment_method.sql) already writes on every
    # call. Phase O1: NOW EMITS every 6h to RUNTIME_TELEMETRY (metric
    # letbuyy.slo.checkout-order-creation-success). Still NOT MEASURED --
    # nothing reads Analytics Engine back out, and no alert fires. The
    # errorBudgetPolicy above was rewritten to what the 6h emitter can
    # actually support; intendedErrorBudgetPolicy preserves the 1h
    # burn-rate posture this SLO wants, which needs a faster emission path.

  - name: payment-capture-confirmation-success
    owner: commerce-platform
    sli: successful_confirm_order_payment_with_ledger_calls / total_capture_webhook_events
    target: 99.9
    window: 30d
    errorBudgetPolicy: flag-at-next-6h-evaluation-if-30d-rate-below-target
    intendedErrorBudgetPolicy: page-on-call-if-burn-rate-exceeds-2x-over-1h
    evidenceTable: payment_transactions
    # payment_transactions.status ('captured' vs 'pending'/absent) after a
    # payment.captured webhook is the real signal. Phase O1: NOW EMITS every
    # 6h to RUNTIME_TELEMETRY (metric
    # letbuyy.slo.payment-capture-confirmation-success). Still NOT MEASURED
    # -- same reasoning as checkout-order-creation-success above, including
    # the same rewritten-to-6h policy and preserved 1h burn-rate intent.

  - name: razorpay-webhook-signature-verification
    owner: commerce-platform
    sli: signature_valid_true_rows / total_payment_webhook_events_rows
    target: 100
    window: 7d
    errorBudgetPolicy: flag-at-next-6h-evaluation-if-any-invalid-signature-in-7d-window
    intendedErrorBudgetPolicy: page-on-call-immediately-on-any-false
    evidenceTable: payment_webhook_events
    # payment_webhook_events.signature_valid is written by
    # services/webhook-service/src/index.ts's /razorpay handler ONLY after
    # verifyRazorpayWebhookSignature passes (a failed signature returns 400
    # before any row is written -- see Phase M5's evidence). A row existing
    # with signature_valid=false would mean the write path changed; today
    # it structurally cannot happen. Phase O1: NOW EMITS every 6h to
    # RUNTIME_TELEMETRY (metric
    # letbuyy.slo.razorpay-webhook-signature-verification, filtered
    # provider=razorpay). Still NOT MEASURED. This is the sharpest of the
    # four rewrites: no batch cadence can ever serve "immediately," so the
    # 6h policy is a genuine reduction in stated posture, not a cosmetic
    # one. intendedErrorBudgetPolicy preserves the real requirement --
    # closing it needs event-driven emission from the webhook handler
    # itself, not a faster cron.

  - name: outbox-event-processing-lag
    owner: platform-sre
    sli: p95(outbox_events.dispatched_at - outbox_events.created_at) for status='processed' rows
    target: 60
    window: 24h
    errorBudgetPolicy: flag-at-next-6h-evaluation-if-24h-p95-exceeds-target
    intendedErrorBudgetPolicy: page-on-call-if-p95-exceeds-target-for-15m
    evidenceTable: outbox_events
    # outbox_events.created_at, .dispatched_at, and .status (queued/
    # processing/processed/failed/dead) are real columns this repository
    # already writes (transactional-outbox relay, per root AGENTS.md;
    # database/supabase/migrations/000_baseline.sql, complete_outbox_event
    # sets status='processed'). Column names re-verified against every
    # later migration touching this table (179, 202), not just baseline.
    # Phase O1: NOW EMITS every 6h to RUNTIME_TELEMETRY (metric
    # letbuyy.slo.outbox-event-processing-lag), computed as a nearest-rank
    # p95 in TypeScript over a bounded (LIMIT 5000), time-windowed row fetch
    # -- not a server-side SQL percentile function, to keep this emitter's
    # blast radius auditable without a new migration. Still NOT MEASURED.
    # The errorBudgetPolicy above was rewritten to the 6h evaluation the
    # emitter can actually perform; intendedErrorBudgetPolicy preserves the
    # 15-minute p95 breach detection this SLO wants, which the current cron
    # is roughly 24x too coarse to serve.

  - name: tenant-isolation-zero-cross-tenant-rows
    owner: security-platform
    sli: cross_tenant_rows_returned_under_unscoped_query / total_red_team_probes
    target: 0
    window: continuous
    errorBudgetPolicy: page-on-call-immediately-on-any-nonzero
    evidenceTable: N/A -- not measurable via a database rollup
    # NOT REWRITTEN to a 6h cadence, deliberately: this SLO is not emitted by
    # the 6-hourly job at all, so restating it in that job's terms would
    # falsely imply the cron covers it. It stays aspirational until a probe
    # job exists (SKIP-CAP-TENANT-REDTEAM-ADOPTION).
    # This SLO is intentionally different in shape: it is a zero-tolerance
    # invariant (RLS FORCE + tenant GUC), not a percentage target with a
    # meaningful error budget. Its only real evidence today is the RT-1
    # through RT-9 red-team suite (tests/executable/tenant-redteam-postgres.
    # test.mjs), which is a point-in-time behavioural test run by a human or
    # CI, not a continuous production signal. NOT MEASURABLE via a database
    # evidenceTable as written -- would need a scheduled, production-safe
    # red-team probe job (SKIP-CAP-TENANT-REDTEAM-ADOPTION) before this
    # entry means anything beyond "the suite passed once, locally, on this
    # commit."
