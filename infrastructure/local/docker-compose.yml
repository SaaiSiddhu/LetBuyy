name: letbuyy-local

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: letbuyy_local
      POSTGRES_USER: letbuyy
      POSTGRES_PASSWORD: letbuyy_local_password
    ports:
      - "54322:5432"
    volumes:
      - local-postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
      - ./postgres/seed:/local-seed:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U letbuyy -d letbuyy_local"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "63790:6379"
    volumes:
      - local-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  queue-emulator:
    image: softwaremill/elasticmq-native:1.6.12
    ports:
      - "9324:9324"
      - "9325:9325"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:9324 >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10

  mail-sandbox:
    image: axllent/mailpit:v1.21
    ports:
      - "1025:1025"
      - "8025:8025"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8025/api/v1/info"]
      interval: 10s
      timeout: 5s
      retries: 10

  provider-sandbox:
    image: wiremock/wiremock:3.9.1
    command: ["--global-response-templating", "--verbose"]
    ports:
      - "8088:8080"
    volumes:
      - ./wiremock:/home/wiremock:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/__admin/mappings"]
      interval: 10s
      timeout: 5s
      retries: 10

  feature-flags:
    image: flipt/flipt:v1.47.0
    environment:
      FLIPT_STORAGE_TYPE: local
      FLIPT_STORAGE_LOCAL_PATH: /var/opt/flipt/flipt.db
    ports:
      - "8081:8080"
    volumes:
      - local-flipt-data:/var/opt/flipt
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  replay-runtime:
    image: node:22-alpine
    working_dir: /workspace
    command: ["node", "/workspace/replay-runtime.mjs"]
    environment:
      LETBUYY_ENVIRONMENT: local
      LOCAL_EVENT_STORE_URL: postgresql://letbuyy:letbuyy_local_password@postgres:5432/letbuyy_local
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    ports:
      - "8091:8091"
    volumes:
      - ./:/workspace:ro
    depends_on:
      postgres:
        condition: service_healthy
      otel-collector:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8091/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.105.0
    command: ["--config=/etc/otelcol/config.yaml"]
    ports:
      - "4317:4317"
      - "4318:4318"
      - "8889:8889"
      - "13133:13133"
    volumes:
      - ./otel-collector.yaml:/etc/otelcol/config.yaml:ro
    depends_on:
      - tempo

  prometheus:
    image: prom/prometheus:v2.54.1
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=48h"]
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - local-prometheus-data:/prometheus
    depends_on:
      - otel-collector

  grafana:
    image: grafana/grafana:11.1.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_USERS_DEFAULT_THEME: light
    ports:
      - "3009:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - local-grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
      - tempo
      - loki

  loki:
    image: grafana/loki:3.1.0
    command: ["-config.file=/etc/loki/local-config.yaml"]
    ports:
      - "3100:3100"

  tempo:
    image: grafana/tempo:2.5.0
    command: ["-config.file=/etc/tempo.yaml"]
    ports:
      - "3200:3200"
    volumes:
      - ./tempo.yaml:/etc/tempo.yaml:ro
      - local-tempo-data:/tmp/tempo

volumes:
  local-postgres-data:
  local-redis-data:
  local-flipt-data:
  local-prometheus-data:
  local-grafana-data:
  local-tempo-data:
