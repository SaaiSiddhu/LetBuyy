apiVersion: 1

datasources:
  - name: Local Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true

  - name: Local Tempo
    type: tempo
    access: proxy
    url: http://tempo:3200

  - name: Local Loki
    type: loki
    access: proxy
    url: http://loki:3100
