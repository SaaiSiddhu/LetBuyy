environments:
  staging:
    promotionSource: feature-branch-or-main-preview
    secrets: provider-staging
    deploy: staging-preview
    deploymentCommand: node infrastructure/scripts/deploy/production-deploy.mjs --environment=staging --target=all --execute
    rollbackCommand: node infrastructure/scripts/deploy/production-rollback.mjs --environment=staging --worker=letbuyy-api-staging
    healthGates:
      - governance-validation
      - lifecycle-validation
      - typecheck
      - staging-e2e
      - migration-plan
      - smoke-tests
  production:
    promotionSource: signed-release-tag
    secrets: provider-production
    deploy: blue-green
    deploymentCommand: node infrastructure/scripts/deploy/production-deploy.mjs --environment=production --target=all --execute
    rollbackCommand: node infrastructure/scripts/deploy/production-rollback.mjs --environment=production --worker=letbuyy-api
    healthGates:
      - governance-validation
      - phase4-ultimate-validation
      - production-readiness-validator
      - cloudflare-provider-contract-validation
      - database-migration-dry-run
      - supabase-operational-verification
      - observability-rollout-verification
      - worker-health
      - storefront-health
      - queue-lag
      - error-budget
      - security-gates
startupSequence:
  - name: staging-workers
    command: node infrastructure/scripts/deploy/production-deploy.mjs --environment=staging --target=cloudflare --execute && node infrastructure/scripts/deploy/production-deploy.mjs --environment=staging --target=workers --execute
    owns:
      - staging-api-worker
      - staging-queue-workers
      - staging-webhook-worker
      - staging-queue-bindings
      - staging-kv-cache
      - staging-r2-storage
  - name: phase4-ultimate-preflight
    command: node infrastructure/scripts/operations/phase4-ultimate-validate.mjs --environment=production
    owns:
      - provider-contract-validation
      - supabase-operational-verification
      - observability-rollout-verification
  - name: cloudflare-primitives
    command: terraform -chdir=infrastructure/cloudflare apply -input=false
    owns:
      - queues
      - kv-cache
      - r2-storage
    requires:
      - phase4-ultimate-preflight
  - name: database-migrations
    command: node infrastructure/scripts/deploy/verify-health-gates.mjs --environment=production --preflight
    requires:
      - cloudflare-primitives
  - name: queue-workers
    command: node infrastructure/scripts/deploy/deploy-worker-runtime.mjs --config services/queue-workers/wrangler.toml --env production
    requires:
      - cloudflare-primitives
      - database-migrations
  - name: api-gateway
    command: node infrastructure/scripts/deploy/deploy-worker-runtime.mjs --config services/api-gateway/wrangler.toml --env production
    requires:
      - queue-workers
  - name: webhook-service
    command: node infrastructure/scripts/deploy/deploy-worker-runtime.mjs --config services/webhook-service/wrangler.toml --env production
    requires:
      - api-gateway
  - name: web-runtimes
    command: pnpm dlx vercel deploy --prod --yes
    requires:
      - api-gateway
      - webhook-service
rollback:
  apiGateway: wrangler-rollback-previous-version
  webhookService: wrangler-rollback-approved-previous-version
  queueWorkers: wrangler-rollback-approved-previous-version
  webApps: vercel-promote-previous-deployment
  database: forward-fix-or-approved-reversible-migration
  queues: pause-consumer-redrive-after-fix
  queueLifecycle: pnpm run validate:queues
  rollbackIntegrity: pnpm run validate:rollback
driftValidation:
  command: node scripts/validators/production-readiness-validator.mjs
  requiredBeforePromotion: true
