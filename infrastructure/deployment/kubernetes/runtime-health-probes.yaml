apiVersion: v1
kind: ConfigMap
metadata:
  name: letbuyy-runtime-health-probes
  namespace: letbuyy-production
data:
  probes.yaml: |
    probes:
      - name: api-gateway
        url: https://api.letbuyy.store/v1/health
        owner: services/api-gateway
        severity: critical
      - name: webhooks
        url: https://webhooks.letbuyy.store/health
        owner: services/webhook-service
        severity: critical
      - name: identity-platform
        url: https://accounts.letbuyy.store/
        owner: apps/identity-platform
        severity: critical
      - name: storefront-runtime
        url: https://letbuyy.store/
        owner: apps/storefront-runtime
        severity: critical
      - name: platform-console
        url: https://console.letbuyy.store/
        owner: apps/platform-console
        severity: high
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: runtime-health-probe
  namespace: letbuyy-production
spec:
  schedule: "*/1 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 10
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app.kubernetes.io/name: runtime-health-probe
        spec:
          restartPolicy: Never
          containers:
            - name: probe
              image: curlimages/curl:8.11.1
              command:
                - /bin/sh
                - -c
                - |
                  set -eu
                  for url in \
                    https://api.letbuyy.store/v1/health \
                    https://webhooks.letbuyy.store/health \
                    https://accounts.letbuyy.store/ \
                    https://letbuyy.store/ \
                    https://console.letbuyy.store/
                  do
                    curl --fail --silent --show-error --max-time 5 "$url" >/dev/null
                  done
