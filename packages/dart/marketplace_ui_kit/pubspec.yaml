name: letbuyy_marketplace_ui_kit
description: Shared UI components, themes, and widgets for LetBuyy apps
version: 1.0.0
publish_to: none
resolution: workspace

environment:
  sdk: '^3.10.0'
  flutter: '>=3.16.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Internal packages
  letbuyy_marketplace_core:
    path: ../marketplace_core
  letbuyy_marketplace_models:
    path: ../marketplace_models
  
  # Utilities
  url_launcher: ^6.3.1
  
  # UI Components
  cupertino_icons: ^1.0.8
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  carousel_slider: ^5.0.0
  flutter_rating_bar: ^4.0.1
  lottie: ^3.2.0
  flutter_animate: ^4.5.0
  fl_chart: ^0.69.2
  flutter_svg: ^2.0.10+1
  google_fonts: ^6.2.1
  timeline_tile: ^2.0.0
  flutter_markdown: ^0.7.1
  confetti: ^0.7.0
  photo_view: ^0.14.0
  font_awesome_flutter: ^10.7.0
  fluttertoast: ^8.2.8
  qr_flutter: ^4.1.0
  
  # State Management
  provider: ^6.1.2
  
  # Utilities
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
