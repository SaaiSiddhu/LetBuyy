name: letbuyy_marketplace_models
description: Shared data models for LetBuyy apps
version: 1.0.0
publish_to: none
resolution: workspace

environment:
  sdk: '^3.10.0'
  flutter: '>=3.16.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Core package
  letbuyy_marketplace_core:
    path: ../marketplace_core

  # Firebase (for Firestore types) -- removed, Phase 1R final pass: support_chat_model.dart and
  # category_attribute_schema_model.dart were this package's last two Firestore-Timestamp-coupled
  # files; both trimmed to plain data classes once their owning services were deleted (see
  # marketplace_services' barrel-file comment). Zero `package:cloud_firestore` imports remain
  # anywhere in this package (grepped fresh).

  # Utilities
  equatable: ^2.0.7
  intl: ^0.20.2
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
