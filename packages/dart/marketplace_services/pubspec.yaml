name: letbuyy_marketplace_services
description: Shared backend services for LetBuyy apps (Firebase, APIs, etc.)
version: 1.0.0
publish_to: none
resolution: workspace

environment:
  sdk: '^3.10.0'
  flutter: '>=3.16.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Internal packages
  letbuyy_marketplace_core:
    path: ../marketplace_core
  letbuyy_marketplace_models:
    path: ../marketplace_models
  # C2 (canonical rewire): ProductProvider/CategoryProvider read the canonical gateway through
  # this client rather than Firestore -- see their own doc comments.
  letbuyy_api_client:
    path: ../api_client

  # Firebase — Phase 1R final pass (owner-requested completion, same day): firebase_core and
  # cloud_firestore removed entirely. support_chat_service.dart, visual_search_service.dart and
  # category_attribute_service.dart (each previously disclosed as "safe but not yet closed" in
  # earlier passes' comments here) are deleted outright, not merely disconnected -- "reachable but
  # safe because it always fails" was judged insufficient: a reachable feature that calls an
  # unavailable Firebase backend is not Firebase-free. Their callers now decide the honest
  # "not available" state locally instead. Combined with firebase_auth/firebase_storage/
  # cloud_functions/firebase_messaging/firebase_analytics removed in earlier passes, this package
  # now requires no Firebase package at all (zero `package:firebase_*`/`package:cloud_firestore`/
  # `package:cloud_functions` imports anywhere in this workspace, grepped fresh).

  # Networking
  http: ^1.2.2
  dio: ^5.7.0
  
  # State Management
  provider: ^6.1.2
  
  # Notifications
  flutter_local_notifications: ^18.0.1
  
  # Location
  geolocator: ^13.0.2
  geocoding: ^3.0.0
  location: ^7.0.0
  
  # Local Storage
  shared_preferences: ^2.5.3
  
  # Buyer AI uses the typed Gateway boundary; no native provider SDK.
  
  # Payment
  razorpay_flutter: ^1.3.7
  
  # Authentication
  google_sign_in: ^6.2.1
  
  # Android
  android_intent_plus: ^5.1.0
  
  # Utilities
  intl: ^0.20.2
  uuid: ^4.5.1

  letbuyy_marketplace_ui_kit: any
  crypto: any
  url_launcher: any
  video_player: any
  package_info_plus: any
  path: any
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
