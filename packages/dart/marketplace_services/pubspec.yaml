name: letbuyy_marketplace_services
description: Shared backend services for LetBuyy apps (Firebase, APIs, etc.)
version: 1.0.0
publish_to: none
resolution: workspace

environment:
  sdk: '^3.10.0'
  flutter: '>=3.16.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Internal packages
  letbuyy_marketplace_core:
    path: ../marketplace_core
  letbuyy_marketplace_models:
    path: ../marketplace_models
  # C2 (canonical rewire): ProductProvider/CategoryProvider read the canonical gateway through
  # this client rather than Firestore -- see their own doc comments.
  letbuyy_api_client:
    path: ../api_client

  # Firebase — Phase 1R (R1.4) removed firebase_messaging/firebase_analytics (zero callers).
  # C3 corrective (27 September 2026 review continuation, second pass) deleted ~30 more
  # Firebase-coupled services/models/screens from this workspace (loyalty/reels/deals-UI/
  # seller-analytics/custom-checkout/~19 dead ad-marketplace-and-SaaS models/seller_model.dart/
  # app_update_model.dart/firebase_safety.dart and more -- see this package's and
  # marketplace_models' own barrel-file comments) and firebase_auth, firebase_storage and
  # cloud_functions entirely (zero remaining `package:firebase_auth`/`package:firebase_storage`/
  # `package:cloud_functions` imports anywhere in this workspace, grepped -- ai_chat_service.dart,
  # firebase_auth's last real caller, is rewired onto the canonical buyer session; custom_checkout_
  # service.dart, cloud_functions' one real caller, was itself deleted as unreachable once
  # payment_method_screen.dart's own honest "not available yet" dialog made its 3 consumer widgets
  # orphaned).
  # STILL a real, required dependency, not yet fully retired: support_chat_service.dart,
  # visual_search_service.dart and category_attribute_service.dart each have no canonical
  # successor yet (R1.1) and are individually disclosed in their own file-header doc comments --
  # each already fails safely (no crash, no fabricated data) rather than being a live risk.
  firebase_core: ^3.6.0
  cloud_firestore: ^5.4.4

  # Networking
  http: ^1.2.2
  dio: ^5.7.0
  
  # State Management
  provider: ^6.1.2
  
  # Notifications
  flutter_local_notifications: ^18.0.1
  
  # Location
  geolocator: ^13.0.2
  geocoding: ^3.0.0
  location: ^7.0.0
  
  # Local Storage
  shared_preferences: ^2.5.3
  
  # AI
  google_generative_ai: ^0.4.7
  
  # Payment
  razorpay_flutter: ^1.3.7
  
  # Authentication
  google_sign_in: ^6.2.1
  
  # Android
  android_intent_plus: ^5.1.0
  
  # Utilities
  intl: ^0.20.2
  uuid: ^4.5.1

  letbuyy_marketplace_ui_kit: any
  crypto: any
  url_launcher: any
  video_player: any
  package_info_plus: any
  path: any
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
