name: letbuyy_marketplace_services
description: Shared backend services for LetBuyy apps (Firebase, APIs, etc.)
version: 1.0.0
publish_to: none
resolution: workspace

environment:
  sdk: '^3.10.0'
  flutter: '>=3.16.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Internal packages
  letbuyy_marketplace_core:
    path: ../marketplace_core
  letbuyy_marketplace_models:
    path: ../marketplace_models
  
  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  cloud_functions: ^5.1.3
  firebase_storage: ^12.3.4
  firebase_messaging: ^15.1.3
  firebase_analytics: ^11.3.3
  
  # Networking
  http: ^1.2.2
  dio: ^5.7.0
  
  # State Management
  provider: ^6.1.2
  
  # Notifications
  flutter_local_notifications: ^18.0.1
  
  # Location
  geolocator: ^13.0.2
  geocoding: ^3.0.0
  location: ^7.0.0
  
  # Local Storage
  shared_preferences: ^2.5.3
  
  # AI
  google_generative_ai: ^0.4.7
  
  # Payment
  razorpay_flutter: ^1.3.7
  
  # Authentication
  google_sign_in: ^6.2.1
  
  # Android
  android_intent_plus: ^5.1.0
  
  # Utilities
  intl: ^0.20.2
  uuid: ^4.5.1

  letbuyy_marketplace_ui_kit: any
  crypto: any
  url_launcher: any
  video_player: any
  package_info_plus: any
  path: any
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
