name: quickcommerce_core
description: Core package for Quickcommerce - Contains models, constants, utilities, and error handling shared across all apps.
version: 1.0.0
publish_to: 'none'

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  # Core utilities
  equatable: ^2.0.7
  intl: ^0.20.2
  uuid: ^4.5.1
  crypto: ^3.0.5
  
  # Local Storage (for models that serialize)
  hive: ^2.2.3
dev_dependencies:
  flutter_lints: ^5.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.13
  test: ^1.25.8
