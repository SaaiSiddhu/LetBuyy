name = "letbuyy-api"
main = "src/index.ts"
compatibility_date = "2026-05-01"
workers_dev = true

[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true

[triggers]
crons = ["*/1 * * * *"]

[vars]
ENVIRONMENT = "local"
APP_ENV = "local"
NODE_ENV = "development"
DEPLOYMENT_ENV = "local"
TELEMETRY_ENV = "local"
RUNTIME_NAME = "API Gateway"
PRIMARY_REGION = "ap-south-1"
FAILOVER_REGION = "ap-southeast-1"
EVENT_QUEUE_NAME = "letbuyy-events-local"
ANALYTICS_QUEUE_NAME = "letbuyy-analytics-local"
SEARCH_QUEUE_NAME = "letbuyy-search-indexing-local"
NOTIFICATION_QUEUE_NAME = "letbuyy-notifications-local"

[[queues.producers]]
binding = "EVENT_QUEUE"
queue = "letbuyy-events-local"

[[queues.producers]]
binding = "ANALYTICS_QUEUE"
queue = "letbuyy-analytics-local"

[[queues.producers]]
binding = "SEARCH_QUEUE"
queue = "letbuyy-search-indexing-local"

[[queues.producers]]
binding = "NOTIFICATION_QUEUE"
queue = "letbuyy-notifications-local"

[[r2_buckets]]
binding = "R2_BUCKET"
bucket_name = "letbuyy-local-storage"
preview_bucket_name = "letbuyy-local-storage"

[placement]
mode = "smart"

[dev]
port = 8787
inspector_port = 9231
local_protocol = "http"

[env.dev]
name = "letbuyy-api-dev"
workers_dev = false
routes = [
  { pattern = "api-dev.letbuyy.store", custom_domain = true }
]

[env.dev.observability]
enabled = true
head_sampling_rate = 1

[env.dev.observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true

[env.dev.triggers]
crons = ["*/1 * * * *"]

[env.dev.vars]
ENVIRONMENT = "development"
APP_ENV = "development"
NODE_ENV = "development"
DEPLOYMENT_ENV = "dev"
TELEMETRY_ENV = "development"
RUNTIME_NAME = "API Gateway"
PRIMARY_REGION = "ap-south-1"
FAILOVER_REGION = "ap-southeast-1"
EVENT_QUEUE_NAME = "letbuyy-events-dev"
ANALYTICS_QUEUE_NAME = "letbuyy-analytics-dev"
SEARCH_QUEUE_NAME = "letbuyy-search-indexing-dev"
NOTIFICATION_QUEUE_NAME = "letbuyy-notifications-dev"

[[env.dev.queues.producers]]
binding = "EVENT_QUEUE"
queue = "letbuyy-events-dev"

[[env.dev.queues.producers]]
binding = "ANALYTICS_QUEUE"
queue = "letbuyy-analytics-dev"

[[env.dev.queues.producers]]
binding = "SEARCH_QUEUE"
queue = "letbuyy-search-indexing-dev"

[[env.dev.queues.producers]]
binding = "NOTIFICATION_QUEUE"
queue = "letbuyy-notifications-dev"

[[env.dev.kv_namespaces]]
binding = "CACHE"
id = "__LETBUYY_RUNTIME_CACHE_DEV_NAMESPACE_ID__"
preview_id = "__LETBUYY_RUNTIME_CACHE_DEV_NAMESPACE_ID__"

[[env.dev.r2_buckets]]
binding = "R2_BUCKET"
bucket_name = "letbuyy-dev-storage"

[env.dev.placement]
mode = "smart"

[env.staging]
name = "letbuyy-api-staging"
