name = "letbuyy-api"
main = "src/index.ts"
compatibility_date = "2026-05-25"
compatibility_flags = ["nodejs_compat"]
workers_dev = false

[build]
command = "pnpm build"

[observability]
enabled = true
head_sampling_rate = 0.1

[observability.logs]
enabled = true
head_sampling_rate = 0.1
invocation_logs = true

[triggers]
crons = ["*/5 * * * *"]

[[migrations]]
tag = "v1-runtime-coordinator"
new_sqlite_classes = ["LetbuyyRuntimeDurableObject"]

[vars]
ENVIRONMENT = "staging"
APP_ENV = "staging"
NODE_ENV = "production"
NEXT_PUBLIC_ENV = "staging"
WORKER_ENV = "staging"
DEPLOYMENT_ENV = "staging"
TELEMETRY_ENV = "staging"
FEATURE_GRAPHQL = "true"
FEATURE_EXTENSIONS = "true"
FEATURE_LIQUID = "true"
STOREFRONT_CACHE = "on"
STOREFRONT_POOLED_SQL = "on"
STOREFRONT_VIEW_SAMPLE_RATE = "0.1"
REQUEST_LOG_SAMPLE_RATE = "0.02"
RUNTIME_NAME = "LetBuyy API Staging"
PRIMARY_REGION = "ap-south-1"
FAILOVER_REGION = "ap-southeast-1"
ASSET_PUBLIC_BASE_URL = "https://cdn-staging.letbuyy.store"
EVENT_QUEUE_NAME = "letbuyy-events-staging"
ANALYTICS_QUEUE_NAME = "letbuyy-analytics-queue-staging"
SEARCH_QUEUE_NAME = "letbuyy-search-queue-staging"
NOTIFICATION_QUEUE_NAME = "letbuyy-notifications-queue-staging"
RUNTIME_QUEUE_NAME = "letbuyy-staging-queue"

[[queues.producers]]
binding = "EVENT_QUEUE"
queue = "letbuyy-events-staging"

[[queues.producers]]
binding = "ANALYTICS_QUEUE"
queue = "letbuyy-analytics-queue-staging"

[[queues.producers]]
binding = "SEARCH_QUEUE"
queue = "letbuyy-search-queue-staging"

[[queues.producers]]
binding = "NOTIFICATION_QUEUE"
queue = "letbuyy-notifications-queue-staging"

[[queues.producers]]
binding = "RUNTIME_QUEUE"
queue = "letbuyy-staging-queue"

[[r2_buckets]]
binding = "R2_BUCKET"
bucket_name = "letbuyy-media-staging"
preview_bucket_name = "letbuyy-media-staging"

[placement]
mode = "smart"

[env.staging]
name = "letbuyy-api-staging"
workers_dev = false
routes = [
  { pattern = "api-staging.letbuyy.store", custom_domain = true },
  { pattern = "api.staging.letbuyy.store", custom_domain = true }
]

[env.staging.observability]
enabled = true
head_sampling_rate = 0.1

[env.staging.observability.logs]
enabled = true
head_sampling_rate = 0.1
invocation_logs = true

[env.staging.triggers]
crons = ["*/5 * * * *"]

[env.staging.vars]
ENVIRONMENT = "staging"
APP_ENV = "staging"
NODE_ENV = "production"
NEXT_PUBLIC_ENV = "staging"
WORKER_ENV = "staging"
DEPLOYMENT_ENV = "staging"
TELEMETRY_ENV = "staging"
FEATURE_GRAPHQL = "true"
FEATURE_EXTENSIONS = "true"
FEATURE_LIQUID = "true"
STOREFRONT_CACHE = "on"
STOREFRONT_POOLED_SQL = "on"
STOREFRONT_VIEW_SAMPLE_RATE = "0.1"
REQUEST_LOG_SAMPLE_RATE = "0.02"
RUNTIME_NAME = "LetBuyy API Staging"
PRIMARY_REGION = "ap-south-1"
FAILOVER_REGION = "ap-southeast-1"
ASSET_PUBLIC_BASE_URL = "https://cdn-staging.letbuyy.store"
EVENT_QUEUE_NAME = "letbuyy-events-staging"
ANALYTICS_QUEUE_NAME = "letbuyy-analytics-queue-staging"
SEARCH_QUEUE_NAME = "letbuyy-search-queue-staging"
NOTIFICATION_QUEUE_NAME = "letbuyy-notifications-queue-staging"
RUNTIME_QUEUE_NAME = "letbuyy-staging-queue"

[[env.staging.queues.producers]]
binding = "EVENT_QUEUE"
queue = "letbuyy-events-staging"

[[env.staging.queues.producers]]
binding = "ANALYTICS_QUEUE"
queue = "letbuyy-analytics-queue-staging"

[[env.staging.queues.producers]]
binding = "SEARCH_QUEUE"
queue = "letbuyy-search-queue-staging"

[[env.staging.queues.producers]]
binding = "NOTIFICATION_QUEUE"
queue = "letbuyy-notifications-queue-staging"

[[env.staging.queues.producers]]
binding = "RUNTIME_QUEUE"
queue = "letbuyy-staging-queue"

[[env.staging.kv_namespaces]]
binding = "CACHE"
id = "90551a8f994642f989f6ee6fa984b4a0"
preview_id = "90551a8f994642f989f6ee6fa984b4a0"

[[env.staging.r2_buckets]]
binding = "R2_BUCKET"
bucket_name = "letbuyy-media-staging"

[[env.staging.hyperdrive]]
binding = "HYPERDRIVE"
id = "69fdd43f334747ae90d158bbb905d5c0"

[[env.staging.d1_databases]]
binding = "RUNTIME_DB"
database_name = "letbuyy-staging-d1"
database_id = "d1e49c22-7345-4e3a-94d0-02ce5075566d"
migrations_dir = "../../database/cloudflare/d1/migrations"

[[env.staging.durable_objects.bindings]]
name = "RUNTIME_COORDINATOR"
class_name = "LetbuyyRuntimeDurableObject"

[[env.staging.services]]
binding = "WEBHOOK_SERVICE"
service = "letbuyy-webhook-staging"

[[env.staging.analytics_engine_datasets]]
binding = "RUNTIME_TELEMETRY"
dataset = "letbuyy-staging-telemetry"

[env.staging.placement]
mode = "smart"

[env.production]
name = "letbuyy-api"
workers_dev = false
routes = [
  { pattern = "api.letbuyy.store", custom_domain = true }
]

[env.production.observability]
enabled = true
head_sampling_rate = 0.1

[env.production.observability.logs]
enabled = true
head_sampling_rate = 0.1
