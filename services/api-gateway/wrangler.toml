[env.production]
name = "letbuyy-api"
workers_dev = false
routes = [
  { pattern = "api.letbuyy.com", custom_domain = true }
]

[env.production.observability]
enabled = true
head_sampling_rate = 0.1

[env.production.observability.logs]
enabled = true
head_sampling_rate = 0.1
invocation_logs = true

[env.production.triggers]
# Beta free-tier: was */1 (1,440 fires/day, the main queue/invocation drain). 15m = 96 fires/day.
crons = ["*/15 * * * *"]

[env.production.vars]
STOREFRONT_INTERNAL_PERIMETER = "bound-request-v1"
MERCHANT_RAZORPAY_WEBHOOK_ORIGIN = "https://webhooks.letbuyy.com"
ENVIRONMENT = "production"
APP_ENV = "production"
NODE_ENV = "production"
NEXT_PUBLIC_STORE_ROOT_DOMAIN = "letbuyy.store"
CUSTOM_DOMAIN_CNAME_TARGET = "storefront.letbuyy.store"
DEPLOYMENT_ENV = "production"
TELEMETRY_ENV = "production"
FEATURE_GRAPHQL = "false"
FEATURE_EXTENSIONS = "false"
FEATURE_LIQUID = "false"
FEATURE_AI_CREDIT_PURCHASE = "false"
# Query-cost admission uses configured atomic Redis, or the existing coordinator.
# KV remains a cache/fixed-window compatibility path; never a query-cost counter.
RATE_LIMIT_KV_FALLBACK = "off"
STOREFRONT_CACHE = "on"
STOREFRONT_POOLED_SQL = "on"
STOREFRONT_SEARCH_PROJECTION = "on"
ANALYTICS_PROJECTION_READS = "on"
PRODUCT_VARIANT_DIFF = "on"
CHECKOUT_POSTCOMMIT_DEFERRAL = "on"
ORDER_ITEMS_RELATIONAL_READS = "on"
PRODUCT_VARIANTS_RELATIONAL_READS = "on"
BUYER_AI_ENABLED = "false"
AI_PROVIDER_MODE = "sandbox"
AI_CREDIT_PURCHASE_MODE = "sandbox"
AI_CREDIT_PURCHASE_PROVIDER = "letbuyy_sandbox"
AI_CREDIT_PRICE_INR_PAISE = "100"
# Disabled credit purchases need no invalid provider-key placeholder; FEATURE_AI_CREDIT_PURCHASE remains false.
LETBUYY_IDENTITY_ISSUER = "https://accounts.letbuyy.com"
WHATSAPP_PROVIDER_MODE = "sandbox"
WHATSAPP_PROVIDER = "letbuyy_sandbox"
# Sandbox WhatsApp needs no invalid account/sender placeholder. Keep its existing
# provider/mode gates; the freed Free-plan variable slot holds the separately
# encrypted TURNSTILE_DOMAIN_MANAGEMENT credential, never a live Twilio key.
RUNTIME_NAME = "LetBuyy API"
PRIMARY_REGION = "ap-south-1"
EDGE_SCOPE = "global-edge"
ASSET_PUBLIC_BASE_URL = "https://cdn.letbuyy.com"
UPLOAD_PUBLIC_BASE_URL = "https://api.letbuyy.com/assets"
CHECKOUT_ORIGIN = "https://checkout.letbuyy.com"
EVENT_QUEUE_NAME = "letbuyy-events-production"
ANALYTICS_QUEUE_NAME = "letbuyy-analytics-queue-production"
SEARCH_QUEUE_NAME = "letbuyy-search-queue-production"
NOTIFICATION_QUEUE_NAME = "letbuyy-notifications-queue-production"
RUNTIME_QUEUE_NAME = "letbuyy-production-queue"

[[env.production.queues.producers]]
binding = "EVENT_QUEUE"
queue = "letbuyy-events-production"

[[env.production.queues.producers]]
binding = "ANALYTICS_QUEUE"
queue = "letbuyy-analytics-queue-production"

[[env.production.queues.producers]]
binding = "SEARCH_QUEUE"
queue = "letbuyy-search-queue-production"

[[env.production.queues.producers]]
binding = "NOTIFICATION_QUEUE"
queue = "letbuyy-notifications-queue-production"

[[env.production.queues.producers]]
binding = "RUNTIME_QUEUE"
queue = "letbuyy-production-queue"

[[env.production.kv_namespaces]]
binding = "CACHE"
id = "ee82af4721b349c89e757ed8155c2b5b"
preview_id = "ee82af4721b349c89e757ed8155c2b5b"

[[env.production.r2_buckets]]
binding = "R2_BUCKET"
bucket_name = "letbuyy-media-production"

[[env.production.hyperdrive]]
binding = "HYPERDRIVE"
id = "9e08563f410040d9a8bd67b7938f0bb5"

[[env.production.services]]
binding = "WEBHOOK_SERVICE"
service = "letbuyy-webhook"

[[env.production.analytics_engine_datasets]]
binding = "RUNTIME_TELEMETRY"
dataset = "letbuyy-production-telemetry"

[env.production.placement]
mode = "smart"

# Existing class/migration; bind production query-cost admission without a new runtime.
[[env.production.durable_objects.bindings]]
name = "RUNTIME_COORDINATOR"
class_name = "LetbuyyRuntimeDurableObject"

# Static Argon2 loader is pinned to reviewed upstream bytes; fail on drift.
[build]
command = "node ../../scripts/generators/generate-store-access-wasm.mjs --check"
