name = "letbuyy-api"
main = "src/index.ts"
compatibility_date = "2026-05-25"
compatibility_flags = ["nodejs_compat"]
workers_dev = false

# No [build] command on purpose. wrangler bundles `main` (src/index.ts) via its own
# esbuild, so a custom command here is only an extra gate. The previous
# `command = "pnpm build"` ran `tsc --noEmit` on EVERY hot-reload, which churned and
# wedged workerd whenever backend source changed (recurring "fetch failed"). Type
# safety is enforced by CI (`pnpm turbo typecheck`) and the standalone `pnpm build`.

[observability]
enabled = true
head_sampling_rate = 0.1

[observability.logs]
enabled = true
head_sampling_rate = 0.1
invocation_logs = true

# Beta free-tier: top-level/default deploy is staging-flavored — keep it idle.
# Scheduled dispatch runs only on production (every 15m). See env.production.triggers.
[triggers]
crons = []

[[migrations]]
tag = "v1-runtime-coordinator"
new_sqlite_classes = ["LetbuyyRuntimeDurableObject"]

[vars]
ENVIRONMENT = "staging"
APP_ENV = "staging"
NODE_ENV = "production"
NEXT_PUBLIC_ENV = "staging"
NEXT_PUBLIC_STORE_ROOT_DOMAIN = "letbuyy.store"
WORKER_ENV = "staging"
DEPLOYMENT_ENV = "staging"
TELEMETRY_ENV = "staging"
FEATURE_GRAPHQL = "true"
FEATURE_EXTENSIONS = "true"
FEATURE_LIQUID = "true"
FEATURE_AI_CREDIT_PURCHASE = "false"
STOREFRONT_CACHE = "on"
STOREFRONT_POOLED_SQL = "on"
STOREFRONT_VIEW_SAMPLE_RATE = "0.1"
STOREFRONT_SEARCH_PROJECTION = "on"
ANALYTICS_PROJECTION_READS = "on"
PRODUCT_VARIANT_DIFF = "on"
CHECKOUT_POSTCOMMIT_DEFERRAL = "on"
ORDER_ITEMS_RELATIONAL_READS = "on"
PRODUCT_VARIANTS_RELATIONAL_READS = "on"
BUYER_AI_ENABLED = "false"
AI_PROVIDER_MODE = "sandbox"
AI_PROVIDER = "letbuyy_sandbox"
AI_PROVIDER_MODEL = "letbuyy-sandbox-copywriter"
AI_CREDIT_PURCHASE_MODE = "sandbox"
AI_CREDIT_PURCHASE_PROVIDER = "letbuyy_sandbox"
AI_CREDIT_PRICE_INR_PAISE = "100"
LETBUYY_IDENTITY_ISSUER = "https://accounts-staging.letbuyy.com"
WHATSAPP_PROVIDER_MODE = "sandbox"
WHATSAPP_PROVIDER = "letbuyy_sandbox"
REQUEST_LOG_SAMPLE_RATE = "0.02"
RUNTIME_NAME = "LetBuyy API Staging"
PRIMARY_REGION = "ap-south-1"
EDGE_SCOPE = "global-edge"
ASSET_PUBLIC_BASE_URL = "https://cdn-staging.letbuyy.com"
CHECKOUT_ORIGIN = "https://checkout-staging.letbuyy.com"
EVENT_QUEUE_NAME = "letbuyy-events-staging"
ANALYTICS_QUEUE_NAME = "letbuyy-analytics-queue-staging"
SEARCH_QUEUE_NAME = "letbuyy-search-queue-staging"
NOTIFICATION_QUEUE_NAME = "letbuyy-notifications-queue-staging"
RUNTIME_QUEUE_NAME = "letbuyy-staging-queue"

[[queues.producers]]
binding = "EVENT_QUEUE"
queue = "letbuyy-events-staging"

[[queues.producers]]
binding = "ANALYTICS_QUEUE"
queue = "letbuyy-analytics-queue-staging"

[[queues.producers]]
binding = "SEARCH_QUEUE"
queue = "letbuyy-search-queue-staging"

[[queues.producers]]
binding = "NOTIFICATION_QUEUE"
queue = "letbuyy-notifications-queue-staging"

[[queues.producers]]
binding = "RUNTIME_QUEUE"
queue = "letbuyy-staging-queue"

[[r2_buckets]]
binding = "R2_BUCKET"
bucket_name = "letbuyy-media-staging"
preview_bucket_name = "letbuyy-media-staging"

[placement]
mode = "smart"

[env.staging]
name = "letbuyy-api-staging"
workers_dev = false
routes = [
  { pattern = "api-staging.letbuyy.com", custom_domain = true },
  { pattern = "api.staging.letbuyy.com", custom_domain = true }
]

[env.staging.observability]
