name = "letbuyy-api"
main = "src/index.ts"
compatibility_date = "2026-05-01"

[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true

[triggers]
crons = ["*/1 * * * *"]

[vars]
ENVIRONMENT = "local"
RUNTIME_NAME = "API Gateway"
PRIMARY_REGION = "ap-south-1"
FAILOVER_REGION = "ap-southeast-1"

[[queues.producers]]
binding = "EVENT_QUEUE"
queue = "letbuyy-events"

[[queues.producers]]
binding = "ANALYTICS_QUEUE"
queue = "letbuyy-analytics"

[[queues.producers]]
binding = "SEARCH_QUEUE"
queue = "letbuyy-search-indexing"

[[queues.producers]]
binding = "NOTIFICATION_QUEUE"
queue = "letbuyy-notifications"

[[kv_namespaces]]
binding = "CACHE"
id = "replace-with-production-kv-namespace-id"
preview_id = "replace-with-preview-kv-namespace-id"

[[r2_buckets]]
binding = "R2_BUCKET"
bucket_name = "letbuyy-production-storage"
preview_bucket_name = "letbuyy-staging-storage"

[placement]
mode = "smart"

[dev]
port = 8787
inspector_port = 9231
local_protocol = "http"
