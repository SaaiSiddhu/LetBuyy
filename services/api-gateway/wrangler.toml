name = "letbuyy-api"
main = "src/index.ts"
compatibility_date = "2024-01-01"

[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true

[triggers]
crons = ["*/1 * * * *"]

# Environment variables (set via wrangler secret)
[vars]
ENVIRONMENT = "development"

# KV Namespaces for caching
# [[kv_namespaces]]
# binding = "CACHE"
# id = "your-kv-namespace-id"

# R2 Bucket for file storage
# [[r2_buckets]]
# binding = "STORAGE"
# bucket_name = "letbuyy-storage"

# Development settings
[dev]
port = 8787
inspector_port = 9231
local_protocol = "http"
