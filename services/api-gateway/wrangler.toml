PRIMARY_REGION = "ap-south-1"
FAILOVER_REGION = "ap-southeast-1"
ASSET_PUBLIC_BASE_URL = "https://cdn.letbuyy.store"
EVENT_QUEUE_NAME = "letbuyy-events-production"
ANALYTICS_QUEUE_NAME = "letbuyy-analytics-queue-production"
SEARCH_QUEUE_NAME = "letbuyy-search-queue-production"
NOTIFICATION_QUEUE_NAME = "letbuyy-notifications-queue-production"
RUNTIME_QUEUE_NAME = "letbuyy-production-queue"

[[env.production.queues.producers]]
binding = "EVENT_QUEUE"
queue = "letbuyy-events-production"

[[env.production.queues.producers]]
binding = "ANALYTICS_QUEUE"
queue = "letbuyy-analytics-queue-production"

[[env.production.queues.producers]]
binding = "SEARCH_QUEUE"
queue = "letbuyy-search-queue-production"

[[env.production.queues.producers]]
binding = "NOTIFICATION_QUEUE"
queue = "letbuyy-notifications-queue-production"

[[env.production.queues.producers]]
binding = "RUNTIME_QUEUE"
queue = "letbuyy-production-queue"

[[env.production.kv_namespaces]]
binding = "CACHE"
id = "PRODUCTION_CACHE_KV_ID_PLACEHOLDER"
preview_id = "PRODUCTION_CACHE_KV_ID_PLACEHOLDER"

[[env.production.r2_buckets]]
binding = "R2_BUCKET"
bucket_name = "letbuyy-media-production"

[[env.production.hyperdrive]]
binding = "HYPERDRIVE"
id = "PRODUCTION_HYPERDRIVE_ID_PLACEHOLDER"

[[env.production.d1_databases]]
binding = "RUNTIME_DB"
database_name = "letbuyy-production-d1"
database_id = "__LETBUYY_RUNTIME_D1_PRODUCTION_DATABASE_ID__"
