name = "letbuyy-queue-workers"
main = "src/index.ts"
compatibility_date = "2026-05-25"
compatibility_flags = ["nodejs_compat"]
workers_dev = false

[observability]
enabled = true
head_sampling_rate = 0.1

[observability.logs]
enabled = true
head_sampling_rate = 0.1
invocation_logs = true

[triggers]
crons = ["17 */6 * * *"]

[vars]
ENVIRONMENT = "staging"
APP_ENV = "staging"
NODE_ENV = "production"
NEXT_PUBLIC_ENV = "staging"
WORKER_ENV = "staging"
DEPLOYMENT_ENV = "staging"
TELEMETRY_ENV = "staging"
RUNTIME_NAME = "Queue Workers"
PRIMARY_REGION = "ap-south-1"
EDGE_SCOPE = "global-edge"
PLATFORM_QUEUE_CLAIM_LIMIT = "25"
PLATFORM_QUEUE_DRAIN_BUDGET_PER_BATCH = "25"
PLATFORM_QUEUE_CIRCUIT_FAILURE_THRESHOLD = "3"
PLATFORM_QUEUE_CIRCUIT_OPEN_SECONDS = "60"
PLATFORM_QUEUE_DRAIN_GENERIC_FANOUT = "off"
INVENTORY_RESERVATION_SWEEPER_LIMIT = "250"
PUSH_DISPATCH_MODE = "dry-run"
FCM_PROJECT_ID = "SKIP_NEEDS_HUMAN_PUSH_FCM_PROJECT_ID"
FCM_CLIENT_EMAIL = "SKIP_NEEDS_HUMAN_PUSH_FCM_CLIENT_EMAIL"
APNS_KEY_ID = "SKIP_NEEDS_HUMAN_PUSH_APNS_KEY_ID"
APNS_TEAM_ID = "SKIP_NEEDS_HUMAN_PUSH_APNS_TEAM_ID"
APNS_BUNDLE_ID = "SKIP_NEEDS_HUMAN_PUSH_APNS_BUNDLE_ID"
APNS_ENVIRONMENT = "sandbox"
# FCM_PRIVATE_KEY and APNS_PRIVATE_KEY are Worker secrets provisioned with wrangler secret put.

[[queues.consumers]]
queue = "letbuyy-events-staging"
max_batch_size = 50
max_batch_timeout = 10
max_concurrency = 10
max_retries = 3
retry_delay = 30
dead_letter_queue = "letbuyy-dead-letters-staging"

[[queues.consumers]]
queue = "letbuyy-analytics-queue-staging"
max_batch_size = 50
max_batch_timeout = 10
max_concurrency = 10
max_retries = 8
retry_delay = 30
dead_letter_queue = "letbuyy-dead-letters-staging"

[[queues.consumers]]
queue = "letbuyy-search-queue-staging"
max_batch_size = 25
max_batch_timeout = 10
max_concurrency = 10
max_retries = 8
retry_delay = 45
dead_letter_queue = "letbuyy-dead-letters-staging"

[[queues.consumers]]
queue = "letbuyy-notifications-queue-staging"
max_batch_size = 25
max_batch_timeout = 10
max_concurrency = 5
max_retries = 6
retry_delay = 60
dead_letter_queue = "letbuyy-dead-letters-staging"

[[queues.consumers]]
queue = "letbuyy-dead-letters-staging"
max_batch_size = 25
max_batch_timeout = 30
max_concurrency = 3
max_retries = 3
retry_delay = 300

[[queues.consumers]]
queue = "letbuyy-staging-queue"
max_batch_size = 50
max_batch_timeout = 10
max_concurrency = 10
max_retries = 8
retry_delay = 30
dead_letter_queue = "letbuyy-staging-dead-letter-queue"

[[queues.consumers]]
queue = "letbuyy-staging-dead-letter-queue"
max_batch_size = 25
max_batch_timeout = 30
max_concurrency = 3
max_retries = 3
retry_delay = 300

[placement]
mode = "smart"

