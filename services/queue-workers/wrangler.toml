name = "letbuyy-queue-workers"
main = "src/index.ts"
compatibility_date = "2026-05-01"
workers_dev = false

[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true

[vars]
ENVIRONMENT = "local"
APP_ENV = "local"
NODE_ENV = "development"
DEPLOYMENT_ENV = "local"
TELEMETRY_ENV = "local"
RUNTIME_NAME = "Queue Workers"
PRIMARY_REGION = "ap-south-1"
FAILOVER_REGION = "ap-southeast-1"

[[queues.consumers]]
queue = "letbuyy-events-local"
max_batch_size = 50
max_batch_timeout = 10
max_concurrency = 25
max_retries = 10
retry_delay = 30
dead_letter_queue = "letbuyy-dead-letters-local"

[[queues.consumers]]
queue = "letbuyy-analytics-local"
max_batch_size = 50
max_batch_timeout = 10
max_concurrency = 20
max_retries = 8
retry_delay = 30
dead_letter_queue = "letbuyy-dead-letters-local"

[[queues.consumers]]
queue = "letbuyy-search-indexing-local"
max_batch_size = 25
max_batch_timeout = 10
max_concurrency = 20
max_retries = 8
retry_delay = 45
dead_letter_queue = "letbuyy-dead-letters-local"

[[queues.consumers]]
queue = "letbuyy-notifications-local"
max_batch_size = 25
max_batch_timeout = 10
max_concurrency = 10
max_retries = 6
retry_delay = 60
dead_letter_queue = "letbuyy-dead-letters-local"

[[queues.consumers]]
queue = "letbuyy-dead-letters-local"
max_batch_size = 25
max_batch_timeout = 30
max_concurrency = 5
max_retries = 3
retry_delay = 300

[placement]
mode = "smart"

[dev]
port = 8791
inspector_port = 9234
local_protocol = "http"

