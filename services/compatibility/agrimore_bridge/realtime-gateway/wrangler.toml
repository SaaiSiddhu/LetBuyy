name = "agrimore-realtime-gateway"
main = "src/index.ts"
compatibility_date = "2026-05-24"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true
head_sampling_rate = 1

[vars]
APP_ENV = "local"
SUPABASE_URL = "http://localhost:54321"
SUPABASE_ANON_KEY = "placeholder-local-anon-key"

[[durable_objects.bindings]]
name = "ORDER_TRACKER"
class_name = "OrderTracker"

[[durable_objects.bindings]]
name = "RIDER_LOCATION"
class_name = "RiderLocation"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["OrderTracker", "RiderLocation"]
