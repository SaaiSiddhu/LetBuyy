name: letbuyy_workspace
description: LetBuyy Monorepo - E-commerce Platform for Marketplace, Seller, and Admin apps

publish_to: none

environment:
  sdk: '^3.11.0'

# ✅ MELOS 7.x: Workspace definition (replaces melos.yaml packages)
# New structure: six-app model roots + packages/dart/*
# Updated 2026-09-02 (Phase M, Stage 6): apps/mobile/merchant-app renamed to
# apps/merchant_app in Stage 3 — the only one of the six-app-model Flutter
# apps that is native to this repository. See CLAUDE.md's "Six-App Target
# Topology" section.
#
# apps/customer_app (Stage 3, cross-repo from System A) and
# apps/phase_2/{rider_app,store_ops_app} (Stage 4, cross-repo from System B)
# are deliberately NOT workspace members yet (Stage 8 finding, corrected
# after two broken attempts): customer_app path-depended on System
# A's own packages/{core,models,services,ui_kit} (4 packages); the phase_2
# apps path-depend on 6 packages/agrimore_* packages. None of those 10
# packages were copied into this repository — Stage 5 deliberately deferred
# ALL packages/agrimore_*-and-packages/core-class consolidation as
# D0_BLOCKED, since verifying they're genuinely compatible with (not
# name-colliding against) this workspace's own packages/dart/{core,models,
# ui_kit} needs real per-package comparison, not a rushed copy under this
# stage's time pressure. Declaring resolution: workspace on any of these 4
# apps without their dependencies present breaks pub resolution for the
# ENTIRE workspace, not just that app (reproduced and reverted twice this
# stage — see the journal). All four apps' own README.md already discloses
# "NOT production-ready" for the phase_2 pair; customer_app carries real
# production-relevant identity (it is the shipped Play Store app) but its
# *shared Dart package* dependencies were unresolved pending the deferred
# package-unification pass — not being a pub workspace member yet was an
# accurate reflection of that, not a regression that stage caused.
#
# Updated 2026-09-05 (phase FB-1): apps/admin_app is no longer a workspace
# member and no longer has a pubspec.yaml. Its Firestore implementation was
# deleted under the owner's decision to retire Firebase completely, and the
# root is now RESERVED (manifest-only). See apps/admin_app/AGENTS.md.
workspace:
  - apps/merchant_app
  - packages/dart/core
  - packages/dart/api_client
  - packages/dart/models
  - packages/dart/ui_kit
  - packages/dart/quickcommerce_domain
  - packages/dart/quickcommerce_observability
  - packages/dart/quickcommerce_design_system
  - packages/dart/quickcommerce_offline
  - packages/dart/quickcommerce_api
  - packages/dart/quickcommerce_realtime
  - packages/dart/marketplace_core
  - packages/dart/marketplace_ui_kit
  - packages/dart/marketplace_models
  - packages/dart/marketplace_services
  - apps/customer_app
  - packages/dart/quickcommerce_core
  - apps/phase_2/rider_app
  - apps/phase_2/store_ops_app



# ✅ MELOS 7.x: Configuration (moved from melos.yaml)
melos:
  repository: https://github.com/letbuyy/letbuyy
  
  command:
    bootstrap:
      usePubspecOverrides: true
  
  scripts:
    # Run apps
    run:builder:
      run: cd apps/merchant_app && flutter run
      description: Run the Builder (Store Builder) app
    
    run:super_admin:
      run: cd apps/mobile/operator-app && flutter run
      description: Run the Super Admin app

    # Build commands
    build:android:
      run: flutter build apk --release
      exec:
        concurrency: 1
      packageFilters:
        scope: "letbuyy_*"
        fileExists: "android/app/build.gradle"
      description: Build Android APK for all apps

    build:ios:
      run: flutter build ios --release
      exec:
        concurrency: 1
      packageFilters:
        scope: "letbuyy_*"
        fileExists: "ios/Runner.xcodeproj"
      description: Build iOS for all apps

    build:web:
      run: flutter build web --release
      exec:
        concurrency: 1
      packageFilters:
        scope: "letbuyy_*"
        fileExists: "web/index.html"
      description: Build Web for all apps

    # Clean
    clean:
      run: flutter clean
      exec:
        concurrency: 6
      description: Clean all packages

    # Analyze
    analyze:
      run: flutter analyze
      exec:
        concurrency: 1
      description: Analyze all packages

    # Test
    test:
      run: flutter test
      exec:
        concurrency: 6
      packageFilters:
        dirExists: test
      description: Run tests for all packages

    # Format
    format:
      run: dart format .
      exec:
        concurrency: 6
      description: Format all packages

    # Get dependencies
    get:
      run: flutter pub get
      exec:
        concurrency: 6
      description: Get dependencies for all packages

dev_dependencies:
  melos: ^7.0.0
  flutter_lints: ^5.0.0
