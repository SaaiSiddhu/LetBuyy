ntents · Occasion · ₹</text><rect x="962.6666666666666" y="690" width="437.3333333333333" height="300" rx="4" fill="#F0E1DB" stroke="#8B6874" stroke-width="1"/><path d="M1072.0,915.0 L1181.3333333333333,762.0 L1295.04,915.0 Z" fill="none" stroke="#8B6874"/><text x="970.6666666666666" y="714" fill="#352329" font-family="Arial,sans-serif" font-size="17" font-weight="600">Gift C</text><text x="966.6666666666666" y="1013" fill="#352329" font-family="Arial,sans-serif" font-size="15" font-weight="400">Contents · Occasion · ₹</text><rect x="40" y="1170" width="650" height="280" rx="6" fill="#F0E1DB" stroke="#8B6874" stroke-width="1"/><text x="60" y="1213" fill="#352329" font-family="Arial,sans-serif" font-size="23" font-weight="600">05  What arrives in the box</text><text x="60" y="1243" fill="#352329" font-family="Arial,sans-serif" font-size="16" font-weight="400">Included items and packaging described truthfully.</text><path d="M60,1424 L287.0,1315.6 L417.0,1380.0 L670,1268.0" fill="none" stroke="#8B6874" stroke-width="1"/><rect x="718" y="1170" width="682" height="280" rx="6" fill="#FFFFFF" stroke="#8B6874" stroke-width="1"/><text x="738" y="1213" fill="#352329" font-family="Arial,sans-serif" font-size="23" font-weight="600">06  Gift help</text><text x="738" y="1243" fill="#352329" font-family="Arial,sans-serif" font-size="16" font-weight="400">Suitability and real shipping policy; no guaranteed arrival date.</text><path d="M0,1000 H1440" stroke="#555" stroke-dasharray="8 8"/><text x="12" y="992" fill="#352329" font-family="Arial,sans-serif" font-size="11" font-weight="400">Opening viewport boundary</text><rect x="40" y="1690" width="1360" height="80" rx="6" fill="#FFFFFF" stroke="#8B6874" stroke-width="1"/><text x="60" y="1733" fill="#352329" font-family="Arial,sans-serif" font-size="23" font-weight="600">07  Research annotation</text><text x="60" y="1763" fill="#352329" font-family="Arial,sans-serif" font-size="16" font-weight="400">Hierarchy and facts differ; server 