<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1800" viewBox="0 0 1440 1800" role="img" aria-labelledby="t d"><title id="t">Kindred home desktop</title><desc id="d">Original proposed research schematic. Boxes are annotated content zones, not implemented controls. No transaction functionality.</desc><rect x="0" y="0" width="1440" height="1800" rx="0" fill="#FBF5F2" stroke="#8B6874" stroke-width="1"/><text x="40" y="25" fill="#352329" font-family="Arial,sans-serif" font-size="12" font-weight="400">LETBUYY · DESIGN PROPOSAL · HOME</text><text x="40" y="49" fill="#352329" font-family="Arial,sans-serif" font-size="11" font-weight="400">Schematic / no live data / 1440 × 1000 opening viewport</text><rect x="0" y="62" width="1440" height="76" rx="0" fill="#FFFFFF" stroke="#8B6874" stroke-width="1"/><text x="40" y="96" fill="#352329" font-family="Arial,sans-serif" font-size="21" font-weight="400">Kindred</text><text x="300" y="97" fill="#352329" font-family="Arial,sans-serif" font-size="16" font-weight="400">Occasions / For whom / Under a budget / Ready-made sets / Gift help</text><rect x="40" y="162" width="440" height="180" rx="6" fill="#FFFFFF" stroke="#8B6874" stroke-width="1"/><text x="60" y="205" fill="#352329" font-family="Arial,sans-serif" font-size="23" font-weight="600">01  Occasion</text><text x="60" y="235" fill="#352329" font-family="Arial,sans-serif" font-size="16" font-weight="400">Independent choices with clear-all; skip-to-all</text><text x="60" y="258" fill="#352329" font-family="Arial,sans-serif" font-size="16" font-weight="400">remains visible.</text><rect x="500" y="162" width="440" height="180" rx="6" fill="#FFFFFF" stroke="#8B6874" stroke-width="1"/><text x="520" y="205" fill="#352329" font-family="Arial,sans-serif" font-size="23" font-weight="600">02  Recipient preference</text><text x="520" y="235" fill="#352329" font-family="Arial,sans-serif" font-size="16" font-weight="400">Independent choices with clear-all; skip-to-all</text><text x