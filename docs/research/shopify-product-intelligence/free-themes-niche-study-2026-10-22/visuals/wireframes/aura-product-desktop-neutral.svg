<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1800" viewBox="0 0 1440 1800" role="img" aria-labelledby="t d"><title id="t">Anonymous structure product desktop</title><desc id="d">Original proposed research schematic. Boxes are annotated content zones, not implemented controls. No transaction functionality.</desc><rect x="0" y="0" width="1440" height="1800" rx="0" fill="#FAFAFA" stroke="#888" stroke-width="1"/><text x="40" y="25" fill="#202020" font-family="Arial,sans-serif" font-size="12" font-weight="400">NEUTRAL STRUCTURE · PRODUCT</text><text x="40" y="49" fill="#202020" font-family="Arial,sans-serif" font-size="11" font-weight="400">Schematic / no live data / 1440 × 1000 opening viewport</text><rect x="0" y="62" width="1440" height="76" rx="0" fill="#FFF" stroke="#888" stroke-width="1"/><text x="40" y="96" fill="#202020" font-family="Arial,sans-serif" font-size="21" font-weight="400">STORE</text><text x="300" y="97" fill="#202020" font-family="Arial,sans-serif" font-size="16" font-weight="400">Shop by use / Routine / Ingredients / Shades / About</text><rect x="40" y="162" width="460" height="620" rx="0" fill="#E7E7E7" stroke="#888" stroke-width="1"/><text x="60" y="205" fill="#202020" font-family="Arial,sans-serif" font-size="23" font-weight="600">01  Product image</text><text x="60" y="235" fill="#202020" font-family="Arial,sans-serif" font-size="16" font-weight="400">Whole packaging</text><path d="M60,756 L214.8,484.40000000000003 L306.79999999999995,627.0 L480,379.0" fill="none" stroke="#888" stroke-width="1"/><rect x="524" y="162" width="300" height="620" rx="0" fill="#E7E7E7" stroke="#888" stroke-width="1"/><text x="544" y="205" fill="#202020" font-family="Arial,sans-serif" font-size="23" font-weight="600">02  Texture / shade</text><text x="544" y="235" fill="#202020" font-family="Arial,sans-serif" font-size="16" font-weight="400">Named shade, no automatic</text><text x="544" y="258" fill="#202020" font-family="Arial,sans-serif" font-size="16" font-weight="400">efficacy imagery</text><path d="M544,756 L638.0,484.40000000000003 L698.0,627.0 L804,379.0" fill="none" stroke="#888" stroke-width="1"/><rect x="854" y="162" width="546" height="300" rx="0" fill="#FFF" stroke="#888" stroke-width="1"/><text x="874" y="205" fill="#202020" font-family="Arial,sans-serif" font-size="23" font-weight="600">03  Use and variant</text><text x="874" y="235" fill="#202020" font-family="Arial,sans-serif" font-size="16" font-weight="400">Format → shade name → price → availability</text><rect x="854" y="490" width="546" height="292" rx="0" fill="#FFF" stroke="#888" stroke-width="1"/><text x="874" y="533" fill="#202020" font-family="Arial,sans-serif" font-size="23" font-weight="600">04  Ingredients + add</text><text x="874" y="563" fill="#202020" font-family="Arial,sans-serif" font-size="16" font-weight="400">Factual ingredients/directions visible near purchase</text><rect x="40" y="850" width="1360" height="350" rx="0" fill="#FFF" stroke="#888" stroke-width="1"/><text x="60" y="893" fill="#202020" font-family="Arial,sans-serif" font-size="23" font-weight="600">05  Routine and directions</text><text x="60" y="923" fill="#202020" font-family="Arial,sans-serif" font-size="16" font-weight="400">Products independently purchasable; no diagnostic recommendations</text><path d="M0,1000 H1440" stroke="#555" stroke-dasharray="8 8"/><text x="12" y="992" fill="#202020" font-family="Arial,sans-serif" font-size="11" font-weight="400">Opening viewport boundary</text><rect x="40" y="1690" width="1360" height="80" rx="0" fill="#FFF" stroke="#888" stroke-width="1"/><text x="60" y="1733" fill="#202020" font-family="Arial,sans-serif" font-size="23" font-weight="600">06  Research annotation</text><text x="60" y="1763" fill="#202020" font-family="Arial,sans-serif" font-size="16" font-weight="400">Hierarchy and facts differ; server cart and hosted checkout stay shared.</text></svg>