<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1800" viewBox="0 0 1440 1800" role="img" aria-labelledby="t d"><title id="t">Pantry product desktop</title><desc id="d">Original proposed research schematic. Boxes are annotated content zones, not implemented controls. No transaction functionality.</desc><rect x="0" y="0" width="1440" height="1800" rx="0" fill="#FCF8EF" stroke="#707858" stroke-width="1"/><text x="40" y="25" fill="#262A1D" font-family="Arial,sans-serif" font-size="12" font-weight="400">LETBUYY · DESIGN PROPOSAL · PRODUCT</text><text x="40" y="49" fill="#262A1D" font-family="Arial,sans-serif" font-size="11" font-weight="400">Schematic / no live data / 1440 × 1000 opening viewport</text><rect x="0" y="62" width="1440" height="76" rx="0" fill="#FFFFFF" stroke="#707858" stroke-width="1"/><text x="40" y="96" fill="#262A1D" font-family="Arial,sans-serif" font-size="21" font-weight="400">Pantry</text><text x="300" y="97" fill="#262A1D" font-family="Arial,sans-serif" font-size="16" font-weight="400">Search / Pantry shelves / Dietary information / Recipes / About</text><rect x="40" y="162" width="430" height="570" rx="6" fill="#EEE8D8" stroke="#707858" stroke-width="1"/><text x="60" y="205" fill="#262A1D" font-family="Arial,sans-serif" font-size="23" font-weight="600">01  Package and serving photo</text><text x="60" y="235" fill="#262A1D" font-family="Arial,sans-serif" font-size="16" font-weight="400">Whole pack and labelled preparation context</text><path d="M60,706 L203.4,458.40000000000003 L289.4,589.5 L450,361.5" fill="none" stroke="#707858" stroke-width="1"/><rect x="498" y="162" width="430" height="570" rx="6" fill="#FFFFFF" stroke="#707858" stroke-width="1"/><text x="518" y="205" fill="#262A1D" font-family="Arial,sans-serif" font-size="23" font-weight="600">02  Ingredients / allergens</text><text x="518" y="235" fill="#262A1D" font-family="Arial,sans-serif" font-size="16" font-weight="400">Visible summary before purchase; nutrition and</text><text x="518" y="258" fill="#262A1D" font-family="Arial,sans-serif" font-size="16" font-weight="400">storage below</text><rect x="956" y="162" width="444" height="570" rx="6" fill="#FFFFFF" stroke="#707858" stroke-width="1"/><text x="976" y="205" fill="#262A1D" font-family="Arial,sans-serif" font-size="23" font-weight="600">03  Pack purchase</text><text x="976" y="235" fill="#262A1D" font-family="Arial,sans-serif" font-size="16" font-weight="400">Pack count → net quantity → unit price → quantity</text><text x="976" y="258" fill="#262A1D" font-family="Arial,sans-serif" font-size="16" font-weight="400">→ add</text><rect x="40" y="810" width="1360" height="380" rx="6" fill="#FFFFFF" stroke="#707858" stroke-width="1"/><text x="60" y="853" fill="#262A1D" font-family="Arial,sans-serif" font-size="23" font-weight="600">04  Nutrition / storage / recipe</text><text x="60" y="883" fill="#262A1D" font-family="Arial,sans-serif" font-size="16" font-weight="400">Merchant-supplied factual content, no made-up freshness promise</text><path d="M0,1000 H1440" stroke="#555" stroke-dasharray="8 8"/><text x="12" y="992" fill="#262A1D" font-family="Arial,sans-serif" font-size="11" font-weight="400">Opening viewport boundary</text><rect x="40" y="1690" width="1360" height="80" rx="6" fill="#FFFFFF" stroke="#707858" stroke-width="1"/><text x="60" y="1733" fill="#262A1D" font-family="Arial,sans-serif" font-size="23" font-weight="600">05  Research annotation</text><text x="60" y="1763" fill="#262A1D" font-family="Arial,sans-serif" font-size="16" font-weight="400">Hierarchy and facts differ; server cart and hosted checkout stay shared.</text></svg>