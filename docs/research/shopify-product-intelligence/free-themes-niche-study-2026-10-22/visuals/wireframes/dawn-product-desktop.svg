<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1800" viewBox="0 0 1440 1800" role="img" aria-labelledby="t d"><title id="t">Marginalia product desktop</title><desc id="d">Original proposed research schematic. Boxes are annotated content zones, not implemented controls. No transaction functionality.</desc><rect x="0" y="0" width="1440" height="1800" rx="0" fill="#FAF6EA" stroke="#867354" stroke-width="1"/><text x="40" y="25" fill="#30291E" font-family="Arial,sans-serif" font-size="12" font-weight="400">LETBUYY · DESIGN PROPOSAL · PRODUCT</text><text x="40" y="49" fill="#30291E" font-family="Arial,sans-serif" font-size="11" font-weight="400">Schematic / no live data / 1440 × 1000 opening viewport</text><rect x="0" y="62" width="1440" height="76" rx="0" fill="#FFFFFF" stroke="#867354" stroke-width="1"/><text x="40" y="96" fill="#30291E" font-family="Arial,sans-serif" font-size="21" font-weight="400">Marginalia</text><text x="300" y="97" fill="#30291E" font-family="Arial,sans-serif" font-size="16" font-weight="400">Prominent search / Books / Authors / Subjects / Stationery / Journal</text><rect x="40" y="162" width="260" height="400" rx="6" fill="#EDE5D1" stroke="#867354" stroke-width="1"/><text x="60" y="205" fill="#30291E" font-family="Arial,sans-serif" font-size="23" font-weight="600">01  Book cover</text><text x="60" y="235" fill="#30291E" font-family="Arial,sans-serif" font-size="16" font-weight="400">2:3; contain image</text><path d="M60,536 L138.8,370.0 L190.79999999999998,462.0 L280,302.0" fill="none" stroke="#867354" stroke-width="1"/><rect x="330" y="162" width="650" height="250" rx="6" fill="#FFFFFF" stroke="#867354" stroke-width="1"/><text x="350" y="205" fill="#30291E" font-family="Arial,sans-serif" font-size="23" font-weight="600">02  Title / author / edition</text><text x="350" y="235" fill="#30291E" font-family="Arial,sans-serif" font-size="16" font-weight="400">Language, publisher, format and ISBN when supplied</text><rect x="1010" y="162" width="390" height="400" rx="6" fill="#FFFFFF" stroke="#867354" stroke-width="1"/><text x="1030" y="205" fill="#30291E" font-family="Arial,sans-serif" font-size="23" font-weight="600">03  Format / price / add</text><text x="1030" y="235" fill="#30291E" font-family="Arial,sans-serif" font-size="16" font-weight="400">Distinguishable editions and actual stock</text><rect x="330" y="450" width="650" height="650" rx="6" fill="#FFFFFF" stroke="#867354" stroke-width="1"/><text x="350" y="493" fill="#30291E" font-family="Arial,sans-serif" font-size="23" font-weight="600">04  Synopsis / permitted excerpt</text><text x="350" y="523" fill="#30291E" font-family="Arial,sans-serif" font-size="16" font-weight="400">Readable measure; licensed excerpt text, no scanned inaccessible reader</text><rect x="40" y="1160" width="1360" height="230" rx="6" fill="#FFFFFF" stroke="#867354" stroke-width="1"/><text x="60" y="1203" fill="#30291E" font-family="Arial,sans-serif" font-size="23" font-weight="600">05  Bibliography / stationery facts</text><text x="60" y="1233" fill="#30291E" font-family="Arial,sans-serif" font-size="16" font-weight="400">Book pages/edition; stationery paper size and weight use a different fact group</text><path d="M0,1000 H1440" stroke="#555" stroke-dasharray="8 8"/><text x="12" y="992" fill="#30291E" font-family="Arial,sans-serif" font-size="11" font-weight="400">Opening viewport boundary</text><rect x="40" y="1690" width="1360" height="80" rx="6" fill="#FFFFFF" stroke="#867354" stroke-width="1"/><text x="60" y="1733" fill="#30291E" font-family="Arial,sans-serif" font-size="23" font-weight="600">06  Research annotation</text><text x="60" y="1763" fill="#30291E" font-family="Arial,sans-serif" font-size="16" font-weight="400">Hierarchy and facts differ; server cart and hosted checkout stay shared.</text></svg>