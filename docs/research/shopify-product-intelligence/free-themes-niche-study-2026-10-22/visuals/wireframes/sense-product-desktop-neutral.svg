<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1800" viewBox="0 0 1440 1800" role="img" aria-labelledby="t d"><title id="t">Anonymous structure product desktop</title><desc id="d">Original proposed research schematic. Boxes are annotated content zones, not implemented controls. No transaction functionality.</desc><rect x="0" y="0" width="1440" height="1800" rx="0" fill="#FAFAFA" stroke="#888" stroke-width="1"/><text x="40" y="25" fill="#202020" font-family="Arial,sans-serif" font-size="12" font-weight="400">NEUTRAL STRUCTURE · PRODUCT</text><text x="40" y="49" fill="#202020" font-family="Arial,sans-serif" font-size="11" font-weight="400">Schematic / no live data / 1440 × 1000 opening viewport</text><rect x="0" y="62" width="1440" height="76" rx="0" fill="#FFF" stroke="#888" stroke-width="1"/><text x="40" y="96" fill="#202020" font-family="Arial,sans-serif" font-size="21" font-weight="400">STORE</text><text x="300" y="97" fill="#202020" font-family="Arial,sans-serif" font-size="16" font-weight="400">New / Clothing / Collections / Fit guide / About</text><rect x="40" y="162" width="400" height="570" rx="0" fill="#E7E7E7" stroke="#888" stroke-width="1"/><text x="60" y="205" fill="#202020" font-family="Arial,sans-serif" font-size="23" font-weight="600">01  Outfit image</text><text x="60" y="235" fill="#202020" font-family="Arial,sans-serif" font-size="16" font-weight="400">Portrait / full silhouette</text><path d="M60,706 L192.0,458.40000000000003 L272.0,589.5 L420,361.5" fill="none" stroke="#888" stroke-width="1"/><rect x="464" y="162" width="400" height="570" rx="0" fill="#E7E7E7" stroke="#888" stroke-width="1"/><text x="484" y="205" fill="#202020" font-family="Arial,sans-serif" font-size="23" font-weight="600">02  Garment detail</text><text x="484" y="235" fill="#202020" font-family="Arial,sans-serif" font-size="16" font-weight="400">Fabric, fit and construction</text><path d="M484,706 L616.0,458.40000000000003 L696.0,589.5 L844,361.5" fill="none" stroke="#888" stroke-width="1"/><rect x="898" y="162" width="502" height="700" rx="0" fill="#FFF" stroke="#888" stroke-width="1"/><text x="918" y="205" fill="#202020" font-family="Arial,sans-serif" font-size="23" font-weight="600">03  Fit purchase rail</text><text x="918" y="235" fill="#202020" font-family="Arial,sans-serif" font-size="16" font-weight="400">Name → price → color → size → measurements → valid add</text><rect x="40" y="930" width="1360" height="450" rx="0" fill="#FFF" stroke="#888" stroke-width="1"/><text x="60" y="973" fill="#202020" font-family="Arial,sans-serif" font-size="23" font-weight="600">04  Fabric / care / separate outfit products</text><text x="60" y="1003" fill="#202020" font-family="Arial,sans-serif" font-size="16" font-weight="400">No automatic outfit bundle. Each item is separately priced.</text><path d="M0,1000 H1440" stroke="#555" stroke-dasharray="8 8"/><text x="12" y="992" fill="#202020" font-family="Arial,sans-serif" font-size="11" font-weight="400">Opening viewport boundary</text><rect x="40" y="1690" width="1360" height="80" rx="0" fill="#FFF" stroke="#888" stroke-width="1"/><text x="60" y="1733" fill="#202020" font-family="Arial,sans-serif" font-size="23" font-weight="600">05  Research annotation</text><text x="60" y="1763" fill="#202020" font-family="Arial,sans-serif" font-size="16" font-weight="400">Hierarchy and facts differ; server cart and hosted checkout stay shared.</text></svg>