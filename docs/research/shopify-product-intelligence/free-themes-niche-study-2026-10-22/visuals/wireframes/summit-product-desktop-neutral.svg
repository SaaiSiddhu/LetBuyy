<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1800" viewBox="0 0 1440 1800" role="img" aria-labelledby="t d"><title id="t">Anonymous structure product desktop</title><desc id="d">Original proposed research schematic. Boxes are annotated content zones, not implemented controls. No transaction functionality.</desc><rect x="0" y="0" width="1440" height="1800" rx="0" fill="#FAFAFA" stroke="#888" stroke-width="1"/><text x="40" y="25" fill="#202020" font-family="Arial,sans-serif" font-size="12" font-weight="400">NEUTRAL STRUCTURE · PRODUCT</text><text x="40" y="49" fill="#202020" font-family="Arial,sans-serif" font-size="11" font-weight="400">Schematic / no live data / 1440 × 1000 opening viewport</text><rect x="0" y="62" width="1440" height="76" rx="0" fill="#FFF" stroke="#888" stroke-width="1"/><text x="40" y="96" fill="#202020" font-family="Arial,sans-serif" font-size="21" font-weight="400">STORE</text><text x="300" y="97" fill="#202020" font-family="Arial,sans-serif" font-size="16" font-weight="400">Occasions / For whom / Under a budget / Ready-made sets / Gift help</text><rect x="40" y="162" width="420" height="500" rx="0" fill="#E7E7E7" stroke="#888" stroke-width="1"/><text x="60" y="205" fill="#202020" font-family="Arial,sans-serif" font-size="23" font-weight="600">01  Closed gift box</text><text x="60" y="235" fill="#202020" font-family="Arial,sans-serif" font-size="16" font-weight="400">Actual supplied packaging</text><path d="M60,636 L199.6,422.0 L283.6,537.0 L440,337.0" fill="none" stroke="#888" stroke-width="1"/><rect x="484" y="162" width="420" height="500" rx="0" fill="#E7E7E7" stroke="#888" stroke-width="1"/><text x="504" y="205" fill="#202020" font-family="Arial,sans-serif" font-size="23" font-weight="600">02  Open box</text><text x="504" y="235" fill="#202020" font-family="Arial,sans-serif" font-size="16" font-weight="400">Visible included items</text><path d="M504,636 L643.6,422.0 L727.6,537.0 L884,337.0" fill="none" stroke="#888" stroke-width="1"/><rect x="934" y="162" width="466" height="500" rx="0" fill="#FFF" stroke="#888" stroke-width="1"/><text x="954" y="205" fill="#202020" font-family="Arial,sans-serif" font-size="23" font-weight="600">03  Contents + purchase</text><text x="954" y="235" fill="#202020" font-family="Arial,sans-serif" font-size="16" font-weight="400">Ready-made set / actual variant / price / add</text><rect x="40" y="730" width="850" height="340" rx="0" fill="#FFF" stroke="#888" stroke-width="1"/><text x="60" y="773" fill="#202020" font-family="Arial,sans-serif" font-size="23" font-weight="600">04  Packaging and suitability</text><text x="60" y="803" fill="#202020" font-family="Arial,sans-serif" font-size="16" font-weight="400">Explicit contents checklist, actual packaging and recipient guidance</text><rect x="918" y="730" width="482" height="340" rx="0" fill="#FFF" stroke="#888" stroke-width="1"/><text x="938" y="773" fill="#202020" font-family="Arial,sans-serif" font-size="23" font-weight="600">05  Supported message</text><text x="938" y="803" fill="#202020" font-family="Arial,sans-serif" font-size="16" font-weight="400">Absent until text limits, cart/order persistence and</text><text x="938" y="826" fill="#202020" font-family="Arial,sans-serif" font-size="16" font-weight="400">fulfillment work</text><path d="M0,1000 H1440" stroke="#555" stroke-dasharray="8 8"/><text x="12" y="992" fill="#202020" font-family="Arial,sans-serif" font-size="11" font-weight="400">Opening viewport boundary</text><rect x="40" y="1690" width="1360" height="80" rx="0" fill="#FFF" stroke="#888" stroke-width="1"/><text x="60" y="1733" fill="#202020" font-family="Arial,sans-serif" font-size="23" font-weight="600">06  Research annotation</text><text x="60" y="1763" fill="#202020" font-family="Arial,sans-serif" font-size="16" font-weight="400">Hierarchy and facts differ; server cart and hosted checkout stay shared.</text></svg>