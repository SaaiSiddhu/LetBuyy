<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1800" viewBox="0 0 1440 1800" role="img" aria-labelledby="t d"><title id="t">Playfield collection desktop</title><desc id="d">Original proposed research schematic. Boxes are annotated content zones, not implemented controls. No transaction functionality.</desc><rect x="0" y="0" width="1440" height="1800" rx="0" fill="#FFF9EE" stroke="#7A6A4D" stroke-width="1"/><text x="40" y="25" fill="#29251D" font-family="Arial,sans-serif" font-size="12" font-weight="400">LETBUYY · DESIGN PROPOSAL · COLLECTION</text><text x="40" y="49" fill="#29251D" font-family="Arial,sans-serif" font-size="11" font-weight="400">Schematic / no live data / 1440 × 1000 opening viewport</text><rect x="0" y="62" width="1440" height="76" rx="0" fill="#FFFFFF" stroke="#7A6A4D" stroke-width="1"/><text x="40" y="96" fill="#29251D" font-family="Arial,sans-serif" font-size="21" font-weight="400">Playfield</text><text x="300" y="97" fill="#29251D" font-family="Arial,sans-serif" font-size="16" font-weight="400">Shop by age / Interests / Toys / Creative kits / Product information</text><rect x="40" y="160" width="1360" height="120" rx="6" fill="#FFFFFF" stroke="#7A6A4D" stroke-width="1"/><text x="60" y="203" fill="#29251D" font-family="Arial,sans-serif" font-size="23" font-weight="600">01  Collection / category context</text><text x="60" y="233" fill="#29251D" font-family="Arial,sans-serif" font-size="16" font-weight="400">Merchant age bands, interest, product type, price; unknown age stays labelled information not supplied.</text><rect x="40" y="312" width="1360" height="90" rx="6" fill="#FFFFFF" stroke="#7A6A4D" stroke-width="1"/><text x="60" y="355" fill="#29251D" font-family="Arial,sans-serif" font-size="23" font-weight="600">02  Age / interest / type</text><text x="60" y="385" fill="#29251D" font-family="Arial,sans-serif" font-size="16" font-weight="400">Result count, sort and removable applied filters</text><rect x="40" y="440" width="1360" height="80" rx="6" fill="#FFFFFF" stroke="#7A6A4D" stroke-width="1"/><text x="60" y="483" fill="#29251D" font-family="Arial,sans-serif" font-size="23" font-weight="600">03  Age band: build and create</text><text x="60" y="513" fill="#29251D" font-family="Arial,sans-serif" font-size="16" font-weight="400">Grouping supports adult comparison of contents and suitability</text><rect x="40.0" y="550" width="437.3333333333333" height="270" rx="4" fill="#F3E6C8" stroke="#7A6A4D" stroke-width="1"/><path d="M149.33333333333331,752.5 L258.66666666666663,614.8 L372.37333333333333,752.5 Z" fill="none" stroke="#7A6A4D"/><text x="48.0" y="574" fill="#29251D" font-family="Arial,sans-serif" font-size="17" font-weight="600">Creative kit</text><text x="44.0" y="843" fill="#29251D" font-family="Arial,sans-serif" font-size="15" font-weight="400">Age · Pieces · ₹ price</text><rect x="501.3333333333333" y="550" width="437.3333333333333" height="270" rx="4" fill="#F3E6C8" stroke="#7A6A4D" stroke-width="1"/><path d="M610.6666666666666,752.5 L720.0,614.8 L833.7066666666667,752.5 Z" fill="none" stroke="#7A6A4D"/><text x="509.3333333333333" y="574" fill="#29251D" font-family="Arial,sans-serif" font-size="17" font-weight="600">Puzzle</text><text x="505.3333333333333" y="843" fill="#29251D" font-family="Arial,sans-serif" font-size="15" font-weight="400">Age · Pieces · ₹ price</text><rect x="962.6666666666666" y="550" width="437.3333333333333" height="270" rx="4" fill="#F3E6C8" stroke="#7A6A4D" stroke-width="1"/><path d="M1072.0,752.5 L1181.3333333333333,614.8 L1295.04,752.5 Z" fill="none" stroke="#7A6A4D"/><text x="970.6666666666666" y="574" fill="#29251D" font-family="Arial,sans-serif" font-size="17" font-weight="600">Construction set</text><text x="966.6666666666666" y="843" fill="#29251D" font-family="Arial,sans-serif" font-size="15" font-weight="400">Age · Pieces · ₹ price</text><rect x="40" y="950" width="1360" height="80" rx="6" fill="#FFFFFF" stroke="#7A6A4D" stroke-width="1"/><text x="60" 