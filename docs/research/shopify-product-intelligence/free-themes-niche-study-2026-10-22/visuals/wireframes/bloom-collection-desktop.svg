t-size="23" font-weight="600">05  Query / pagination / empty recovery</text><text x="60" y="1583" fill="#29251D" font-family="Arial,sans-serif" font-size="16" font-weight="400">No infinite hidden dependency; return from product retains selection. Compare is shown only after a working contract.</text><path d="M0,1000 H1440" stroke="#555" stroke-dasharray="8 8"/><text x="12" y="992" fill="#29251D" font-family="Arial,sans-serif" font-size="11" font-weight="400">Opening viewport boundary</text><rect x="40" y="1690" width="1360" height="80" rx="6" fill="#FFFFFF" stroke="#7A6A4D" stroke-width="1"/><text x="60" y="1733" fill="#29251D" font-family="Arial,sans-serif" font-size="23" font-weight="600">06  Research annotation</text><text x="60" y="1763" fill="#29251D" font-family="Arial,sans-serif" font-size="16" font-weight="400">Hierarchy and facts differ; server cart and hosted checkout stay shared.</text></svg>