<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1800" viewBox="0 0 1440 1800" role="img" aria-labelledby="t d"><title id="t">Anonymous structure product desktop</title><desc id="d">Original proposed research schematic. Boxes are annotated content zones, not implemented controls. No transaction functionality.</desc><rect x="0" y="0" width="1440" height="1800" rx="0" fill="#FAFAFA" stroke="#888" stroke-width="1"/><text x="40" y="25" fill="#202020" font-family="Arial,sans-serif" font-size="12" font-weight="400">NEUTRAL STRUCTURE · PRODUCT</text><text x="40" y="49" fill="#202020" font-family="Arial,sans-serif" font-size="11" font-weight="400">Schematic / no live data / 1440 × 1000 opening viewport</text><rect x="0" y="62" width="1440" height="76" rx="0" fill="#FFF" stroke="#888" stroke-width="1"/><text x="40" y="96" fill="#202020" font-family="Arial,sans-serif" font-size="21" font-weight="400">STORE</text><text x="300" y="97" fill="#202020" font-family="Arial,sans-serif" font-size="16" font-weight="400">Rooms / Furniture / Materials / Measurement guide / Delivery information</text><rect x="40" y="162" width="1360" height="500" rx="0" fill="#E7E7E7" stroke="#888" stroke-width="1"/><text x="60" y="205" fill="#202020" font-family="Arial,sans-serif" font-size="23" font-weight="600">01  Panoramic room context</text><text x="60" y="235" fill="#202020" font-family="Arial,sans-serif" font-size="16" font-weight="400">Keep the entire furniture object visible</text><path d="M60,636 L556.8,422.0 L828.8,537.0 L1380,337.0" fill="none" stroke="#888" stroke-width="1"/><rect x="40" y="710" width="850" height="350" rx="0" fill="#FFF" stroke="#888" stroke-width="1"/><text x="60" y="753" fill="#202020" font-family="Arial,sans-serif" font-size="23" font-weight="600">02  Dimension diagram with text equivalent</text><text x="60" y="783" fill="#202020" font-family="Arial,sans-serif" font-size="16" font-weight="400">W × D × H; access/assembly guidance; explicit units</text><rect x="918" y="710" width="482" height="500" rx="0" fill="#FFF" stroke="#888" stroke-width="1"/><text x="938" y="753" fill="#202020" font-family="Arial,sans-serif" font-size="23" font-weight="600">03  Finish and purchase</text><text x="938" y="783" fill="#202020" font-family="Arial,sans-serif" font-size="16" font-weight="400">Actual variant price, material and shipping policy</text><rect x="40" y="1120" width="850" height="220" rx="0" fill="#FFF" stroke="#888" stroke-width="1"/><text x="60" y="1163" fill="#202020" font-family="Arial,sans-serif" font-size="23" font-weight="600">04  Assembly and material facts</text><text x="60" y="1193" fill="#202020" font-family="Arial,sans-serif" font-size="16" font-weight="400">No automatic delivery-date checker without a contract</text><path d="M0,1000 H1440" stroke="#555" stroke-dasharray="8 8"/><text x="12" y="992" fill="#202020" font-family="Arial,sans-serif" font-size="11" font-weight="400">Opening viewport boundary</text><rect x="40" y="1690" width="1360" height="80" rx="0" fill="#FFF" stroke="#888" stroke-width="1"/><text x="60" y="1733" fill="#202020" font-family="Arial,sans-serif" font-size="23" font-weight="600">05  Research annotation</text><text x="60" y="1763" fill="#202020" font-family="Arial,sans-serif" font-size="16" font-weight="400">Hierarchy and facts differ; server cart and hosted checkout stay shared.</text></svg>