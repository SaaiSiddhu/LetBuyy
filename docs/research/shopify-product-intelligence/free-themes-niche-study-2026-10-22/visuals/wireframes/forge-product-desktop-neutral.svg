<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1800" viewBox="0 0 1440 1800" role="img" aria-labelledby="t d"><title id="t">Anonymous structure product desktop</title><desc id="d">Original proposed research schematic. Boxes are annotated content zones, not implemented controls. No transaction functionality.</desc><rect x="0" y="0" width="1440" height="1800" rx="0" fill="#FAFAFA" stroke="#888" stroke-width="1"/><text x="40" y="25" fill="#202020" font-family="Arial,sans-serif" font-size="12" font-weight="400">NEUTRAL STRUCTURE · PRODUCT</text><text x="40" y="49" fill="#202020" font-family="Arial,sans-serif" font-size="11" font-weight="400">Schematic / no live data / 1440 × 1000 opening viewport</text><rect x="0" y="62" width="1440" height="76" rx="0" fill="#FFF" stroke="#888" stroke-width="1"/><text x="40" y="96" fill="#202020" font-family="Arial,sans-serif" font-size="21" font-weight="400">STORE</text><text x="300" y="97" fill="#202020" font-family="Arial,sans-serif" font-size="16" font-weight="400">Persistent search / Devices / Accessories / Compatibility guide / Support</text><rect x="40" y="162" width="120" height="600" rx="0" fill="#FFF" stroke="#888" stroke-width="1"/><text x="60" y="205" fill="#202020" font-family="Arial,sans-serif" font-size="23" font-weight="600">01  Views</text><text x="60" y="235" fill="#202020" font-family="Arial,sans-serif" font-size="16" font-weight="400">Manual</text><text x="60" y="258" fill="#202020" font-family="Arial,sans-serif" font-size="16" font-weight="400">thumbnails</text><rect x="184" y="162" width="610" height="600" rx="0" fill="#E7E7E7" stroke="#888" stroke-width="1"/><text x="204" y="205" fill="#202020" font-family="Arial,sans-serif" font-size="23" font-weight="600">02  Product / connector diagram</text><text x="204" y="235" fill="#202020" font-family="Arial,sans-serif" font-size="16" font-weight="400">Contained image does not crop ports</text><path d="M204,736 L415.8,474.0 L537.8,612.0 L774,372.0" fill="none" stroke="#888" stroke-width="1"/><rect x="824" y="162" width="576" height="270" rx="0" fill="#FFF" stroke="#888" stroke-width="1"/><text x="844" y="205" fill="#202020" font-family="Arial,sans-serif" font-size="23" font-weight="600">03  Model + compatibility</text><text x="844" y="235" fill="#202020" font-family="Arial,sans-serif" font-size="16" font-weight="400">Source-supported match; unknown stays unconfirmed</text><rect x="824" y="460" width="576" height="302" rx="0" fill="#FFF" stroke="#888" stroke-width="1"/><text x="844" y="503" fill="#202020" font-family="Arial,sans-serif" font-size="23" font-weight="600">04  Price / SKU / add</text><text x="844" y="533" fill="#202020" font-family="Arial,sans-serif" font-size="16" font-weight="400">Server validates chosen model and stock</text><rect x="40" y="830" width="1360" height="520" rx="0" fill="#FFF" stroke="#888" stroke-width="1"/><text x="60" y="873" fill="#202020" font-family="Arial,sans-serif" font-size="23" font-weight="600">05  Technical specification table</text><text x="60" y="903" fill="#202020" font-family="Arial,sans-serif" font-size="16" font-weight="400">Unit-aware rows with unknown values; optional compare only after functioning query contract</text><path d="M0,1000 H1440" stroke="#555" stroke-dasharray="8 8"/><text x="12" y="992" fill="#202020" font-family="Arial,sans-serif" font-size="11" font-weight="400">Opening viewport boundary</text><rect x="40" y="1690" width="1360" height="80" rx="0" fill="#FFF" stroke="#888" stroke-width="1"/><text x="60" y="1733" fill="#202020" font-family="Arial,sans-serif" font-size="23" font-weight="600">06  Research annotation</text><text x="60" y="1763" fill="#202020" font-family="Arial,sans-serif" font-size="16" font-weight="400">Hierarchy and facts differ; server cart and hosted checkout stay shared.</text></svg>