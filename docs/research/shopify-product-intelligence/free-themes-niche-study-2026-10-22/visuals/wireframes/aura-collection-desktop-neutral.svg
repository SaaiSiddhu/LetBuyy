<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1800" viewBox="0 0 1440 1800" role="img" aria-labelledby="t d"><title id="t">Anonymous structure collection desktop</title><desc id="d">Original proposed research schematic. Boxes are annotated content zones, not implemented controls. No transaction functionality.</desc><rect x="0" y="0" width="1440" height="1800" rx="0" fill="#FAFAFA" stroke="#888" stroke-width="1"/><text x="40" y="25" fill="#202020" font-family="Arial,sans-serif" font-size="12" font-weight="400">NEUTRAL STRUCTURE · COLLECTION</text><text x="40" y="49" fill="#202020" font-family="Arial,sans-serif" font-size="11" font-weight="400">Schematic / no live data / 1440 × 1000 opening viewport</text><rect x="0" y="62" width="1440" height="76" rx="0" fill="#FFF" stroke="#888" stroke-width="1"/><text x="40" y="96" fill="#202020" font-family="Arial,sans-serif" font-size="21" font-weight="400">STORE</text><text x="300" y="97" fill="#202020" font-family="Arial,sans-serif" font-size="16" font-weight="400">Shop by use / Routine / Ingredients / Shades / About</text><rect x="40" y="160" width="1360" height="120" rx="0" fill="#FFF" stroke="#888" stroke-width="1"/><text x="60" y="203" fill="#202020" font-family="Arial,sans-serif" font-size="23" font-weight="600">01  Collection / category context</text><text x="60" y="233" fill="#202020" font-family="Arial,sans-serif" font-size="16" font-weight="400">Routine stage, format, supplied ingredient attributes, shade, price; no disease-related suitability promises.</text><rect x="40" y="312" width="1360" height="90" rx="0" fill="#FFF" stroke="#888" stroke-width="1"/><text x="60" y="355" fill="#202020" font-family="Arial,sans-serif" font-size="23" font-weight="600">02  Use / format / shade</text><text x="60" y="385" fill="#202020" font-family="Arial,sans-serif" font-size="16" font-weight="400">Result count, sort and removable applied filters</text><rect x="40" y="440" width="440" height="110" rx="0" fill="#FFF" strok