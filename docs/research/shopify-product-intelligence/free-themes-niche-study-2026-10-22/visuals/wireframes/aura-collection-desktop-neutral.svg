" font-family="Arial,sans-serif" font-size="21" font-weight="600">Care product 3</text><text x="1096" y="1170" fill="#202020" font-family="Arial,sans-serif" font-size="16" font-weight="400">Use / format / ingredients supplied</text><text x="1096" y="1192" fill="#202020" font-family="Arial,sans-serif" font-size="16" font-weight="400">/ named shade / ₹</text><rect x="40" y="1510" width="1360" height="140" rx="0" fill="#FFF" stroke="#888" stroke-width="1"/><text x="60" y="1553" fill="#202020" font-family="Arial,sans-serif" font-size="23" font-weight="600">06  Query / pagination / empty recovery</text><text x="60" y="1583" fill="#202020" font-family="Arial,sans-serif" font-size="16" font-weight="400">No infinite hidden dependency; return from product retains selection. Compare is shown only after a working contract.</text><path d="M0,1000 H1440" stroke="#555" stroke-dasharray="8 8"/><text x="12" y="992" fill="#202020" font-family="Arial,sans-serif" font-size="11" font-weight="400">Opening viewport boundary</text><rect x="40" y="1690" width="1360" height="80" rx="0" fill="#FFF" stroke="#888" stroke-width="1"/><text x="60" y="1733" fill="#202020" font-family="Arial,sans-serif" font-size="23" font-weight="600">07  Research annotation</text><text x="60" y="1763" fill="#202020" font-family="Arial,sans-serif" font-size="16" font-weight="400">Hierarchy and facts differ; server cart and hosted checkout stay shared.</text></svg>