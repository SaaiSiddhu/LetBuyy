<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1800" viewBox="0 0 1440 1800" role="img" aria-labelledby="t d"><title id="t">Anonymous structure collection desktop</title><desc id="d">Original proposed research schematic. Boxes are annotated content zones, not implemented controls. No transaction functionality.</desc><rect x="0" y="0" width="1440" height="1800" rx="0" fill="#FAFAFA" stroke="#888" stroke-width="1"/><text x="40" y="25" fill="#202020" font-family="Arial,sans-serif" font-size="12" font-weight="400">NEUTRAL STRUCTURE · COLLECTION</text><text x="40" y="49" fill="#202020" font-family="Arial,sans-serif" font-size="11" font-weight="400">Schematic / no live data / 1440 × 1000 opening viewport</text><rect x="0" y="62" width="1440" height="76" rx="0" fill="#FFF" stroke="#888" stroke-width="1"/><text x="40" y="96" fill="#202020" font-family="Arial,sans-serif" font-size="21" font-weight="400">STORE</text><text x="300" y="97" fill="#202020" font-family="Arial,sans-serif" font-size="16" font-weight="400">Search / Pantry shelves / Dietary information / Recipes / About</text><rect x="40" y="160" width="1360" height="120" rx="0" fill="#FFF" stroke="#888" stroke-width="1"/><text x="60" y="203" fill="#202020" font-family="Arial,sans-serif" font-size="23" font-weight="600">01  Collection / category context</text><text x="60" y="233" fill="#202020" font-family="Arial,sans-serif" font-size="16" font-weight="400">Product shelf, supplied dietary tags, price; dietary tags are not medical advice or a guarantee against cross-contact.</text><rect x="40" y="312" width="1360" height="90" rx="0" fill="#FFF" stroke="#888" stroke-width="1"/><text x="60" y="355" fill="#202020" font-family="Arial,sans-serif" font-size="23" font-weight="600">02  Shelf / dietary fact / price</text><text x="60" y="385" fill="#202020" font-family="Arial,sans-serif" font-size="16" font-weight="400">Result count, sort and removable applied filters</text><rect x="40" y="440" width="1360" height="150" rx="0" fill="#FFF" stroke="#888" stroke-width="1"/><rect x="50" y="450" width="150" height="130" rx="0" fill="#E7E7E7" stroke="#888" stroke-width="1"/><text x="216" y="474" fill="#202020" font-family="Arial,sans-serif" font-size="21" font-weight="600">Item 1</text><text x="216" y="500" fill="#202020" font-family="Arial,sans-serif" font-size="16" font-weight="400">Ingredients summary / net quantity / pack size / INR price / supported quantity</text><rect x="40" y="616" width="1360" height="150" rx="0" fill="#FFF" stroke="#888" stroke-width="1"/><rect x="50" y="626" width="150" height="130" rx="0" fill="#E7E7E7" stroke="#888" stroke-width="1"/><text x="216" y="650" fill="#202020" font-family="Arial,sans-serif" font-size="21" font-weight="600">Item 2</text><text x="216" y="676" fill="#202020" font-family="Arial,sans-serif" font-size="16" font-weight="400">Ingredients summary / net quantity / pack size / INR price / supported quantity</text><rect x="40" y="792" width="1360" height="150" rx="0" fill="#FFF" stroke="#888" stroke-width="1"/><rect x="50" y="802" width="150" height="130" rx="0" fill="#E7E7E7" stroke="#888" stroke-width="1"/><text x="216" y="826" fill="#202020" font-family="Arial,sans-serif" font-size="21" font-weight="600">Item 3</text><text x="216" y="852" fill="#202020" font-family="Arial,sans-serif" font-size="16" font-weight="400">Ingredients summary / net quantity / pack size / INR price / supported quantity</text><rect x="40" y="968" width="1360" height="150" rx="0" fill="#FFF" stroke="#888" stroke-width="1"/><rect x="50" y="978" width="150" height="130" rx="0" fill="#E7E7E7" stroke="#888" stroke-width="1"/><text x="216" y="1002" fill="#202020" font-family="Arial,sans-serif" font-size="21" font-weight="600">Item 4</text><text x="216" y="1028" fill="#202020" font-family="Arial,sans-serif" font-size="16" font-weight="400">Ingredients summary / net quantity / pack size / INR price / supported quantity</text><rect x="40" y="1144" width="1360" height="150" rx="0" fill="#FFF" stroke="#888" stroke-width="1"/><rect x="50" y="1154" width="150" height="130" rx="0" fill="#E7E7E7" stroke="#888" stroke-width="1"/><text x="216" y="1178" fill="#202020" font-family="Arial,sans-serif" font-size="21" font-weight="600">Item 5</text><text x="216" y="1204" fill="#202020" font-family="Arial,sans-serif" font-size="16" font-weight="400">Ingredients summary / net quantity / pack size / INR price / supported quantity</text><rect x="40" y="1320" width="1360" height="150" rx="0" fill="#FFF" stroke="#888" stroke-width="1"/><rect x="50" y="1330" width="150" height="130" rx="0" fill="#E7E7E7" stroke="#888" stroke-width="1"/><text x="216" y="1354" fill="#202020" font-family="Arial,sans-serif" font-size="21" font-weight="600">Item 6</text><text x="216" y="1380" fill="#202020" font-family="Arial,sans-serif" font-size="16" font-weight="400">Ingredients summary / net quantity / pack size / INR price / supported quantity</text><rect x="40" y="1510" width="1360" height="140" rx="0" fill="#FFF" stroke="#888" stroke-width="1"/><text x="60" y="1553" fill="#202020" font-family="Arial,sans-serif" font-size="23" font-weight="600">03  Query / pagination / empty recovery</text><text x="60" y="1583" fill="#202020" font-family="Arial,sans-serif" font-size="16" font-weight="400">No infinite hidden dependency; return from product retains selection. Compare is shown only after a working contract.</text><path d="M0,1000 H1440" stroke="#555" stroke-dasharray="8 8"/><text x="12" y="992" fill="#202020" font-family="Arial,sans-serif" font-size="11" font-weight="400">Opening viewport boundary</text><rect x="40" y="1690" width="1360" height="80" rx="0" fill="#FFF" stroke="#888" stroke-width="1"/><text x="60" y="1733" fill="#202020" font-family="Arial,sans-serif" font-size="23" font-weight="600">04  Research annotation</text><text x="60" y="1763" fill="#202020" font-family="Arial,sans-serif" font-size="16" font-weight="400">Hierarchy and facts differ; server cart and hosted checkout stay shared.</text></svg>