<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1800" viewBox="0 0 1440 1800" role="img" aria-labelledby="t d"><title id="t">Marginalia home desktop</title><desc id="d">Original proposed research schematic. Boxes are annotated content zones, not implemented controls. No transaction functionality.</desc><rect x="0" y="0" width="1440" height="1800" rx="0" fill="#FAF6EA" stroke="#867354" stroke-width="1"/><text x="40" y="25" fill="#30291E" font-family="Arial,sans-serif" font-size="12" font-weight="400">LETBUYY · DESIGN PROPOSAL · HOME</text><text x="40" y="49" fill="#30291E" font-family="Arial,sans-serif" font-size="11" font-weight="400">Schematic / no live data / 1440 × 1000 opening viewport</text><rect x="0" y="62" width="1440" height="76" rx="0" fill="#FFFFFF" stroke="#867354" stroke-width="1"/><text x="40" y="96" fill="#30291E" font-family="Arial,sans-serif" font-size="21" font-weight="400">Marginalia</text><text x="300" y="97" fill="#30291E" font-family="Arial,sans-serif" font-size="16" font-weight="400">Prominent search / Books / Authors / Subjects / Stationery / Journal</text><rect x="40" y="162" width="1360" height="100" rx="6" fill="#FFFFFF" stroke="#867354" stroke-width="1"/><text x="60" y="205" fill="#30291E" font-family="Arial,sans-serif" font-size="23" font-weight="600">01  Search title, author or subject</text><text x="60" y="235" fill="#30291E" font-family="Arial,sans-serif" font-size="16" font-weight="400">Known-item retrieval remains primary.</text><rect x="40" y="290" width="280" height="630" rx="6" fill="#FFFFFF" stroke="#867354" stroke-width="1"/><text x="60" y="333" fill="#30291E" font-family="Arial,sans-serif" font-size="23" font-weight="600">02  Subject index</text><text x="60" y="363" fill="#30291E" font-family="Arial,sans-serif" font-size="16" font-weight="400">Fiction / design / history /</text><text x="60" y="386" fill="#30291E" font-family="Arial,sans-serif" font-size="16" font-weight="400">art / stationery</text><rect x="348" y="290" width="220" height="330" rx="6" fill="#EDE5D1" stroke="#867354" stroke-width="1"/><text x="368" y="333" fill="#30291E" font-family="Arial,sans-serif" font-size="23" font-weight="600">03  Cover</text><text x="368" y="363" fill="#30291E" font-family="Arial,sans-serif" font-size="16" font-weight="400">2:3 contained cover</text><path d="M368,594 L431.6,461.6 L475.6,537.5 L548,405.5" fill="none" stroke="#867354" stroke-width="1"/><rect x="596" y="290" width="804" height="330" rx="6" fill="#FFFFFF" stroke="#867354" stroke-width="1"/><text x="616" y="333" fill="#30291E" font-family="Arial,sans-serif" font-size="23" font-weight="600">04  Editorial reading pick</text><text x="616" y="363" fill="#30291E" font-family="Arial,sans-serif" font-size="16" font-weight="400">Title, author, format, short permitted excerpt and explicit product link.</text><rect x="348.0" y="700" width="245.0" height="280" rx="4" fill="#EDE5D1" stroke="#867354" stroke-width="1"/><path d="M409.25,910.0 L470.5,767.2 L534.2,910.0 Z" fill="none" stroke="#867354"/><text x="356.0" y="724" fill="#30291E" font-family="Arial,sans-serif" font-size="17" font-weight="600">Book A</text><text x="352.0" y="1003" fill="#30291E" font-family="Arial,sans-serif" font-size="15" font-weight="400">Author · Format · Language · ₹</text><rect x="617.0" y="700" width="245.0" height="280" rx="4" fill="#EDE5D1" stroke="#867354" stroke-width="1"/><path d="M678.25,910.0 L739.5,767.2 L803.2,910.0 Z" fill="none" stroke="#867354"/><text x="625.0" y="724" fill="#30291E" font-family="Arial,sans-serif" font-size="17" font-weight="600">Book B</text><text x="621.0" y="1003" fill="#30291E" font-family="Arial,sans-serif" font-size="15" font-weight="400">Author · Format · Language · ₹</text><rect x="886.0" y="700" width="245.0" height="280" rx="4" fill="#EDE5D1" stroke="#867354" stroke-width="1"/><path d="M947.25,910.0 L1008.5,767.2 L1072.2,910.0 Z" fill="none" stroke="#867354"/><text x="894.0" y="724" fill="#30291E" font-family="Arial,sans-serif" font-size="17" font-weight="600">Book C</text><text x="890.0" y="1003" fill="#30291E" font-family="Arial,sans-serif" font-size="15" font-weight="400">Author · Format · Language · ₹</text><rect x="1155.0" y="700" width="245.0" height="280" rx="4" fill="#EDE5D1" stroke="#867354" stroke-width="1"/><path d="M1216.25,910.0 L1277.5,767.2 L1341.2,910.0 Z" fill="none" stroke="#867354"/><text x="1163.0" y="724" fill="#30291E" font-family="Arial,sans-serif" font-size="17" font-weight="600">Book D</text><text x="1159.0" y="1003" fill="#30291E" font-family="Arial,sans-serif" font-size="15" font-weight="400">Author · Format · Language · ₹</text><rect x="40" y="1160" width="1360" height="300" rx="6" fill="#FFFFFF" stroke="#867354" stroke-width="1"/><text x="60" y="1203" fill="#30291E" font-family="Arial,sans-serif" font-size="23" font-weight="600">05  Author spotlight / stationery by use</text><text x="60" y="1233" fill="#30291E" font-family="Arial,sans-serif" font-size="16" font-weight="400">Distinct bibliography and paper/size models share product fundamentals.</text><path d="M0,1000 H1440" stroke="#555" stroke-dasharray="8 8"/><text x="12" y="992" fill="#30291E" font-family="Arial,sans-serif" font-size="11" font-weight="400">Opening viewport boundary</text><rect x="40" y="1690" width="1360" height="80" rx="6" fill="#FFFFFF" stroke="#867354" stroke-width="1"/><text x="60" y="1733" fill="#30291E" font-family="Arial,sans-serif" font-size="23" font-weight="600">06  Research annotation</text><text x="60" y="1763" fill="#30291E" font-family="Arial,sans-serif" font-size="16" font-weight="400">Hierarchy and facts differ; server cart and hosted checkout stay shared.</text></svg>