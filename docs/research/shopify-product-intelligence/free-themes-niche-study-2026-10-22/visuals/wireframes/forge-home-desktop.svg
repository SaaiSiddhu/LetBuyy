ices</text><rect x="324" y="286" width="1076" height="180" rx="6" fill="#E7EDF5" stroke="#67768B" stroke-width="1"/><text x="344" y="329" fill="#142236" font-family="Arial,sans-serif" font-size="23" font-weight="600">03  New device range</text><text x="344" y="359" fill="#142236" font-family="Arial,sans-serif" font-size="16" font-weight="400">Model-level feature summary and one restrained product image.</text><path d="M344,440 L732.88,379.6 L948.0799999999999,421.0 L1380,349.0" fill="none" stroke="#67768B" stroke-width="1"/><rect x="324.0" y="520" width="251.0" height="251.0" rx="4" fill="#E7EDF5" stroke="#67768B" stroke-width="1"/><path d="M386.75,708.25 L449.5,580.24 L514.76,708.25 Z" fill="none" stroke="#67768B"/><text x="332.0" y="544" fill="#142236" font-family="Arial,sans-serif" font-size="17" font-weight="600">Model A</text><text x="328.0" y="794.0" fill="#142236" font-family="Arial,sans-serif" font-size="15" font-weight="400">Model · W · Port · ₹</text><rect x="599.0" y="520" width="251.0" height="251.0" rx="4" fill="#E7EDF5" stroke="#67768B" stroke-width="1"/><path d="M661.75,708.25 L724.5,580.24 L789.76,708.25 Z" fill="none" stroke="#67768B"/><text x="607.0" y="544" fill="#142236" font-family="Arial,sans-serif" font-size="17" font-weight="600">Model B</text><text x="603.0" y="794.0" fill="#142236" font-family="Arial,sans-serif" font-size="15" font-weight="400">Model · W · Port · ₹</text><rect x="874.0" y="520" width="251.0" height="251.0" rx="4" fill="#E7EDF5" stroke="#67768B" stroke-width="1"/><path d="M936.75,708.25 L999.5,580.24 L1064.76,708.25 Z" fill="none" stroke="#67768B"/><text x="882.0" y="544" fill="#142236" font-family="Arial,sans-serif" font-size="17" font-weight="600">Model C</text><text x="878.0" y="794.0" fill="#142236" font-family="Arial,sans-serif" font-size="15" font-weight="400">Model · W · Port · ₹</text><rect x="1149.0" y="520" width="251.0" height="251.0" rx="4" fill="#E7EDF5" stroke="#67768B" stroke-width="1"/><path d="M1211.75,708.2