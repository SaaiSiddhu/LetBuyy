<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1800" viewBox="0 0 1440 1800" role="img" aria-labelledby="t d"><title id="t">Anonymous structure product desktop</title><desc id="d">Original proposed research schematic. Boxes are annotated content zones, not implemented controls. No transaction functionality.</desc><rect x="0" y="0" width="1440" height="1800" rx="0" fill="#FAFAFA" stroke="#888" stroke-width="1"/><text x="40" y="25" fill="#202020" font-family="Arial,sans-serif" font-size="12" font-weight="400">NEUTRAL STRUCTURE · PRODUCT</text><text x="40" y="49" fill="#202020" font-family="Arial,sans-serif" font-size="11" font-weight="400">Schematic / no live data / 1440 × 1000 opening viewport</text><rect x="0" y="62" width="1440" height="76" rx="0" fill="#FFF" stroke="#888" stroke-width="1"/><text x="40" y="96" fill="#202020" font-family="Arial,sans-serif" font-size="21" font-weight="400">STORE</text><text x="300" y="97" fill="#202020" font-family="Arial,sans-serif" font-size="16" font-weight="400">Shop by age / Interests / Toys / Creative kits / Product information</text><rect x="40" y="162" width="760" height="500" rx="0" fill="#E7E7E7" stroke="#888" stroke-width="1"/><text x="60" y="205" fill="#202020" font-family="Arial,sans-serif" font-size="23" font-weight="600">01  Toy / contents gallery</text><text x="60" y="235" fill="#202020" font-family="Arial,sans-serif" font-size="16" font-weight="400">Whole object, actual included pieces and scale</text><path d="M60,636 L328.8,422.0 L480.79999999999995,537.0 L780,337.0" fill="none" stroke="#888" stroke-width="1"/><rect x="830" y="162" width="570" height="230" rx="0" fill="#FFF" stroke="#888" stroke-width="1"/><text x="850" y="205" fill="#202020" font-family="Arial,sans-serif" font-size="23" font-weight="600">02  Age and suitability facts</text><text x="850" y="235" fill="#202020" font-family="Arial,sans-serif" font-size="16" font-weight="400">Merchant age recommendation, source text, warnings</text><rect x="830" y="416" width="570" height="246" rx="0" fill="#FFF" stroke="#888" stroke-width="1"/><text x="850" y="459" fill="#202020" font-family="Arial,sans-serif" font-size="23" font-weight="600">03  Options / price / add</text><text x="850" y="489" fill="#202020" font-family="Arial,sans-serif" font-size="16" font-weight="400">No certification inferred from design.</text><rect x="40" y="720" width="1360" height="200" rx="0" fill="#FFF" stroke="#888" stroke-width="1"/><text x="60" y="763" fill="#202020" font-family="Arial,sans-serif" font-size="23" font-weight="600">04  What is included</text><text x="60" y="793" fill="#202020" font-family="Arial,sans-serif" font-size="16" font-weight="400">Piece count and labelled contents diagram</text><rect x="40" y="980" width="1360" height="340" rx="0" fill="#FFF" stroke="#888" stroke-width="1"/><text x="60" y="1023" fill="#202020" font-family="Arial,sans-serif" font-size="23" font-weight="600">05  Dimensions / materials / care</text><text x="60" y="1053" fill="#202020" font-family="Arial,sans-serif" font-size="16" font-weight="400">Facts support the adult purchaser before commitment.</text><path d="M0,1000 H1440" stroke="#555" stroke-dasharray="8 8"/><text x="12" y="992" fill="#202020" font-family="Arial,sans-serif" font-size="11" font-weight="400">Opening viewport boundary</text><rect x="40" y="1690" width="1360" height="80" rx="0" fill="#FFF" stroke="#888" stroke-width="1"/><text x="60" y="1733" fill="#202020" font-family="Arial,sans-serif" font-size="23" font-weight="600">06  Research annotation</text><text x="60" y="1763" fill="#202020" font-family="Arial,sans-serif" font-size="16" font-weight="400">Hierarchy and facts differ; server cart and hosted checkout stay shared.</text></svg>