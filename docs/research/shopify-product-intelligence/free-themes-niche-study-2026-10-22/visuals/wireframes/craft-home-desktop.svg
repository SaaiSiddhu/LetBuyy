<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1800" viewBox="0 0 1440 1800" role="img" aria-labelledby="t d"><title id="t">Habitat home desktop</title><desc id="d">Original proposed research schematic. Boxes are annotated content zones, not implemented controls. No transaction functionality.</desc><rect x="0" y="0" width="1440" height="1800" rx="0" fill="#F7F3EB" stroke="#7B7261" stroke-width="1"/><text x="40" y="25" fill="#302C25" font-family="Arial,sans-serif" font-size="12" font-weight="400">LETBUYY · DESIGN PROPOSAL · HOME</text><text x="40" y="49" fill="#302C25" font-family="Arial,sans-serif" font-size="11" font-weight="400">Schematic / no live data / 1440 × 1000 opening viewport</text><rect x="0" y="62" width="1440" height="76" rx="0" fill="#FFFDFA" stroke="#7B7261" stroke-width="1"/><text x="40" y="96" fill="#302C25" font-family="Arial,sans-serif" font-size="21" font-weight="400">Habitat</text><text x="300" y="97" fill="#302C25" font-family="Arial,sans-serif" font-size="16" font-weight="400">Rooms / Furniture / Materials / Measurement guide / Delivery information</text><rect x="40" y="162" width="300" height="540" rx="6" fill="#FFFDFA" stroke="#7B7261" stroke-width="1"/><text x="60" y="205" fill="#302C25" font-family="Arial,sans-serif" font-size="23" font-weight="600">01  Shop rooms</text><text x="60" y="235" fill="#302C25" font-family="Arial,sans-serif" font-size="16" font-weight="400">Living / dining / bedroom. Keep</text><text x="60" y="258" fill="#302C25" font-family="Arial,sans-serif" font-size="16" font-weight="400">navigation outside the</text><text x="60" y="281" fill="#302C25" font-family="Arial,sans-serif" font-size="16" font-weight="400">photograph.</text><rect x="368" y="162" width="1032" height="540" rx="6" fill="#E9E2D5" stroke="#7B7261" stroke-width="1"/><text x="388" y="205" fill="#302C25" font-family="Arial,sans-serif" font-size="23" font-weight="600">02  Room-scale panorama</text><text x="388" y="235" fill="#302C25" font-famil