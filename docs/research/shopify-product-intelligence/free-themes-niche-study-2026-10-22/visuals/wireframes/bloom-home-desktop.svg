<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1800" viewBox="0 0 1440 1800" role="img" aria-labelledby="t d"><title id="t">Playfield home desktop</title><desc id="d">Original proposed research schematic. Boxes are annotated content zones, not implemented controls. No transaction functionality.</desc><rect x="0" y="0" width="1440" height="1800" rx="0" fill="#FFF9EE" stroke="#7A6A4D" stroke-width="1"/><text x="40" y="25" fill="#29251D" font-family="Arial,sans-serif" font-size="12" font-weight="400">LETBUYY · DESIGN PROPOSAL · HOME</text><text x="40" y="49" fill="#29251D" font-family="Arial,sans-serif" font-size="11" font-weight="400">Schematic / no live data / 1440 × 1000 opening viewport</text><rect x="0" y="62" width="1440" height="76" rx="0" fill="#FFFFFF" stroke="#7A6A4D" stroke-width="1"/><text x="40" y="96" fill="#29251D" font-family="Arial,sans-serif" font-size="21" font-weight="400">Playfield</text><text x="300" y="97" fill="#29251D" font-family="Arial,sans-serif" font-size="16" font-weight="400">Shop by age / Interests / Toys / Creative kits / Product information</text><rect x="40" y="162" width="1360" height="140" rx="6" fill="#FFFFFF" stroke="#7A6A4D" stroke-width="1"/><text x="60" y="205" fill="#29251D" font-family="Arial,sans-serif" font-size="23" font-weight="600">01  Adult-facing chooser</text><text x="60" y="235" fill="#29251D" font-family="Arial,sans-serif" font-size="16" font-weight="400">Shop by merchant-stated age range and interest. Skip directly to all toys.</text><rect x="40" y="330" width="650" height="350" rx="6" fill="#F3E6C8" stroke="#7A6A4D" stroke-width="1"/><text x="60" y="373" fill="#29251D" font-family="Arial,sans-serif" font-size="23" font-weight="600">02  Build / make / imagine</text><text x="60" y="403" fill="#29251D" font-family="Arial,sans-serif" font-size="16" font-weight="400">Activity bento with meaningful category labels.</text><path d="M60,654 L287.0,512.0 L417.0,592.5 L670,452.5" fill="none" stroke="#7A6A4D" stroke-width="1"/><rect x="718" y="330" width="682" height="160" rx="6" fill="#FFFFFF" stroke="#7A6A4D" stroke-width="1"/><text x="738" y="373" fill="#29251D" font-family="Arial,sans-serif" font-size="23" font-weight="600">03  Age range entries</text><text x="738" y="403" fill="#29251D" font-family="Arial,sans-serif" font-size="16" font-weight="400">Unknown values are not inferred.</text><rect x="718" y="514" width="682" height="166" rx="6" fill="#FFFFFF" stroke="#7A6A4D" stroke-width="1"/><text x="738" y="557" fill="#29251D" font-family="Arial,sans-serif" font-size="23" font-weight="600">04  Interest entries</text><text x="738" y="587" fill="#29251D" font-family="Arial,sans-serif" font-size="16" font-weight="400">Art / puzzles / construction based on actual taxonomy.</text><rect x="40.0" y="770" width="437.3333333333333" height="437.3333333333333" rx="4" fill="#F3E6C8" stroke="#7A6A4D" stroke-width="1"/><path d="M149.33333333333331,1098.0 L258.66666666666663,874.96 L372.37333333333333,1098.0 Z" fill="none" stroke="#7A6A4D"/><text x="48.0" y="794" fill="#29251D" font-family="Arial,sans-serif" font-size="17" font-weight="600">Creative kit</text><text x="44.0" y="1230.3333333333333" fill="#29251D" font-family="Arial,sans-serif" font-size="15" font-weight="400">Age · Pieces · ₹ price</text><rect x="501.3333333333333" y="770" width="437.3333333333333" height="437.3333333333333" rx="4" fill="#F3E6C8" stroke="#7A6A4D" stroke-width="1"/><path d="M610.6666666666666,1098.0 L720.0,874.96 L833.7066666666667,1098.0 Z" fill="none" stroke="#7A6A4D"/><text x="509.3333333333333" y="794" fill="#29251D" font-family="Arial,sans-serif" font-size="17" font-weight="600">Puzzle</text><text x="505.3333333333333" y="1230.3333333333333" fill="#29251D" font-family="Arial,sans-serif" font-size="15" font-weight="400">Age · Pieces · ₹ price</text><rect x="962.6666666666666" y="770" width="437.3333333333333" height="437.3333333333333" rx="4" fill="#F3E6C8" stroke="#7A6A4D" stroke-width="1"/><path d="M1072.0,1098.0 L1181.3333333333333,874.96 L1295.04,1098.0 Z" fill="none" stroke="#7A6A4D"/><text x="970.6666666666666" y="794" fill="#29251D" font-family="Arial,sans-serif" font-size="17" font-weight="600">Construction set</text><text x="966.6666666666666" y="1230.3333333333333" fill="#29251D" font-family="Arial,sans-serif" font-size="15" font-weight="400">Age · Pieces · ₹ price</text><rect x="40" y="1330" width="1360" height="190" rx="6" fill="#FFFFFF" stroke="#7A6A4D" stroke-width="1"/><text x="60" y="1373" fill="#29251D" font-family="Arial,sans-serif" font-size="23" font-weight="600">05  Contents and dimensions</text><text x="60" y="1403" fill="#29251D" font-family="Arial,sans-serif" font-size="16" font-weight="400">What is included, merchant warnings and care; no platform certification.</text><path d="M0,1000 H1440" stroke="#555" stroke-dasharray="8 8"/><text x="12" y="992" fill="#29251D" font-family="Arial,sans-serif" font-size="11" font-weight="400">Opening viewport boundary</text><rect x="40" y="1690" width="1360" height="80" rx="6" fill="#FFFFFF" stroke="#7A6A4D" stroke-width="1"/><text x="60" y="1733" fill="#29251D" font-family="Arial,sans-serif" font-size="23" font-weight="600">06  Research annotation</text><text x="60" y="1763" fill="#29251D" font-family="Arial,sans-serif" font-size="16" font-weight="400">Hierarchy and facts differ; server cart and hosted checkout stay shared.</text></svg>