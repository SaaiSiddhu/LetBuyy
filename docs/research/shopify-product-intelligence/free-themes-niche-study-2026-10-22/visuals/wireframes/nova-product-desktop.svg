<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1800" viewBox="0 0 1440 1800" role="img" aria-labelledby="t d"><title id="t">MadeYours product desktop</title><desc id="d">Original proposed research schematic. Boxes are annotated content zones, not implemented controls. No transaction functionality.</desc><rect x="0" y="0" width="1440" height="1800" rx="0" fill="#F5F6FC" stroke="#747999" stroke-width="1"/><text x="40" y="25" fill="#23243E" font-family="Arial,sans-serif" font-size="12" font-weight="400">LETBUYY · DESIGN PROPOSAL · PRODUCT</text><text x="40" y="49" fill="#23243E" font-family="Arial,sans-serif" font-size="11" font-weight="400">Schematic / no live data / 1440 × 1000 opening viewport</text><rect x="0" y="62" width="1440" height="76" rx="0" fill="#FFFFFF" stroke="#747999" stroke-width="1"/><text x="40" y="96" fill="#23243E" font-family="Arial,sans-serif" font-size="21" font-weight="400">MadeYours</text><text x="300" y="97" fill="#23243E" font-family="Arial,sans-serif" font-size="16" font-weight="400">Choose a base / How personalization works / Examples / Production policy / Help</text><rect x="40" y="162" width="800" height="620" rx="6" fill="#E7EAF7" stroke="#747999" stroke-width="1"/><text x="60" y="205" fill="#23243E" font-family="Arial,sans-serif" font-size="23" font-weight="600">01  Illustrative placement preview</text><text x="60" y="235" fill="#23243E" font-family="Arial,sans-serif" font-size="16" font-weight="400">Authoritative text summary remains available; no upload or proof-approval promise</text><path d="M60,756 L344.0,484.40000000000003 L503.99999999999994,627.0 L820,379.0" fill="none" stroke="#747999" stroke-width="1"/><rect x="870" y="162" width="530" height="620" rx="6" fill="#FFFFFF" stroke="#747999" stroke-width="1"/><text x="890" y="205" fill="#23243E" font-family="Arial,sans-serif" font-size="23" font-weight="600">02  Configuration steps</text><text x="890" y="235" fill="#23243E" font-family="Arial,sans-serif" font-size="16" font-weight="400">1 Base variant → 2 permitted text → validation → 3</text><text x="890" y="258" fill="#23243E" font-family="Arial,sans-serif" font-size="16" font-weight="400">review/edit</text><rect x="40" y="840" width="800" height="330" rx="6" fill="#FFFFFF" stroke="#747999" stroke-width="1"/><text x="60" y="883" fill="#23243E" font-family="Arial,sans-serif" font-size="23" font-weight="600">03  Configuration summary</text><text x="60" y="913" fill="#23243E" font-family="Arial,sans-serif" font-size="16" font-weight="400">Exact normalized text, placement, method, version and constraints</text><rect x="870" y="840" width="530" height="330" rx="6" fill="#FFFFFF" stroke="#747999" stroke-width="1"/><text x="890" y="883" fill="#23243E" font-family="Arial,sans-serif" font-size="23" font-weight="600">04  Server price and add</text><text x="890" y="913" fill="#23243E" font-family="Arial,sans-serif" font-size="16" font-weight="400">Distinct configuration identity; retry-safe write; launch</text><text x="890" y="936" fill="#23243E" font-family="Arial,sans-serif" font-size="16" font-weight="400">gated on order readback</text><path d="M0,1000 H1440" stroke="#555" stroke-dasharray="8 8"/><text x="12" y="992" fill="#23243E" font-family="Arial,sans-serif" font-size="11" font-weight="400">Opening viewport boundary</text><rect x="40" y="1690" width="1360" height="80" rx="6" fill="#FFFFFF" stroke="#747999" stroke-width="1"/><text x="60" y="1733" fill="#23243E" font-family="Arial,sans-serif" font-size="23" font-weight="600">05  Research annotation</text><text x="60" y="1763" fill="#23243E" font-family="Arial,sans-serif" font-size="16" font-weight="400">Hierarchy and facts differ; server cart and hosted checkout stay shared.</text></svg>