<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1800" viewBox="0 0 1440 1800" role="img" aria-labelledby="t d"><title id="t">Anonymous structure collection desktop</title><desc id="d">Original proposed research schematic. Boxes are annotated content zones, not implemented controls. No transaction functionality.</desc><rect x="0" y="0" width="1440" height="1800" rx="0" fill="#FAFAFA" stroke="#888" stroke-width="1"/><text x="40" y="25" fill="#202020" font-family="Arial,sans-serif" font-size="12" font-weight="400">NEUTRAL STRUCTURE · COLLECTION</text><text x="40" y="49" fill="#202020" font-family="Arial,sans-serif" font-size="11" font-weight="400">Schematic / no live data / 1440 × 1000 opening viewport</text><rect x="0" y="62" width="1440" height="76" rx="0" fill="#FFF" stroke="#888" stroke-width="1"/><text x="40" y="96" fill="#202020" font-family="Arial,sans-serif" font-size="21" font-weight="400">STORE</text><text x="300" y="97" fill="#202020" font-family="Arial,sans-serif" font-size="16" font-weight="400">New / Clothing / Collections / Fit guide / About</text><rect x="40" y="160" width="1360" height="120" rx="0" fill="#FFF" stroke="#888" stroke-width="1"/><text x="60" y="203" fill="#202020" font-family="Arial,sans-serif" font-size="23" font-weight="600">01  Collection / category context</text><text x="60" y="233" fill="#202020" font-family="Arial,sans-serif" font-size="16" font-weight="400">Category, size, color, price; size facet must mean a purchasable variant, not a product tag alone.</text><rect x="40" y="312" width="1360" height="90" rx="0" fill="#FFF" stroke="#888" stroke-width="1"/><text x="60" y="355" fill="#202020" font-family="Arial,sans-serif" font-size="23" font-weight="600">02  Size / color / silhouette</text><text x="60" y="385" fill="#202020" font-family="Arial,sans-serif" font-size="16" font-weight="400">Result count, sort and removable applied filters</text><rect x="40.0" y="440" width="437.3333333333333" height="310" rx="0" fill="#E7E7E7" stroke="#888" stroke-width="1"/><text x="48.0" y="464" fill="#202020" font-family="Arial,sans-serif" font-size="17" font-weight="600">Item 1</text><text x="44.0" y="773" fill="#202020" font-family="Arial,sans-serif" font-size="15" font-weight="400">Color · Sizes · ₹ price</text><rect x="501.3333333333333" y="440" width="437.3333333333333" height="310" rx="0" fill="#E7E7E7" stroke="#888" stroke-width="1"/><text x="509.3333333333333" y="464" fill="#202020" font-family="Arial,sans-serif" font-size="17" font-weight="600">Item 2</text><text x="505.3333333333333" y="773" fill="#202020" font-family="Arial,sans-serif" font-size="15" font-weight="400">Color · Sizes · ₹ price</text><rect x="962.6666666666666" y="440" width="437.3333333333333" height="310" rx="0" fill="#E7E7E7" stroke="#888" stroke-width="1"/><text x="970.6666666666666" y="464" fill="#202020" font-family="Arial,sans-serif" font-size="17" font-weight="600">Item 3</text><text x="966.6666666666666" y="773" fill="#202020" font-family="Arial,sans-serif" font-size="15" font-weight="400">Color · Sizes · ₹ price</text><rect x="40.0" y="930" width="437.3333333333333" height="310" rx="0" fill="#E7E7E7" stroke="#888" stroke-width="1"/><text x="48.0" y="954" fill="#202020" font-family="Arial,sans-serif" font-size="17" font-weight="600">Item 5</text><text x="44.0" y="1263" fill="#202020" font-family="Arial,sans-serif" font-size="15" font-weight="400">Color · Sizes · ₹ price</text><rect x="501.3333333333333" y="930" width="437.3333333333333" height="310" rx="0" fill="#E7E7E7" stroke="#888" stroke-width="1"/><text x="509.3333333333333" y="954" fill="#202020" font-family="Arial,sans-serif" font-size="17" font-weight="600">Item 6</text><text x="505.3333333333333" y="1263" fill="#202020" font-family="Arial,sans-serif" font-size="15" font-weight="400">Color · Sizes · ₹ price</text><rect x="962.6666666666666" y="930" width="437.3333333333333" height="310" rx="0" fill="#E7E7E7" stroke="#888" stroke-width="1"/><text x="970.6666666666666" y="954" fill="#202020" font-family="Arial,sans-serif" font-size="17" font-weight="600">Item 7</text><text x="966.6666666666666" y="1263" fill="#202020" font-family="Arial,sans-serif" font-size="15" font-weight="400">Color · Sizes · ₹ price</text><rect x="40" y="1510" width="1360" height="140" rx="0" fill="#FFF" stroke="#888" stroke-width="1"/><text x="60" y="1553" fill="#202020" font-family="Arial,sans-serif" font-size="23" font-weight="600">03  Query / pagination / empty recovery</text><text x="60" y="1583" fill="#202020" font-family="Arial,sans-serif" font-size="16" font-weight="400">No infinite hidden dependency; return from product retains selection. Compare is shown only after a working contract.</text><path d="M0,1000 H1440" stroke="#555" stroke-dasharray="8 8"/><text x="12" y="992" fill="#202020" font-family="Arial,sans-serif" font-size="11" font-weight="400">Opening viewport boundary</text><rect x="40" y="1690" width="1360" height="80" rx="0" fill="#FFF" stroke="#888" stroke-width="1"/><text x="60" y="1733" fill="#202020" font-family="Arial,sans-serif" font-size="23" font-weight="600">04  Research annotation</text><text x="60" y="1763" fill="#202020" font-family="Arial,sans-serif" font-size="16" font-weight="400">Hierarchy and facts differ; server cart and hosted checkout stay shared.</text></svg>