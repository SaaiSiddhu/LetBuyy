e="16" font-weight="400">unknown remains explicit.</text><rect x="338.0" y="312" width="338.0" height="310" rx="4" fill="#E5E9DD" stroke="#708064" stroke-width="1"/><path d="M422.5,544.5 L507.0,386.4 L594.88,544.5 Z" fill="none" stroke="#708064"/><text x="346.0" y="336" fill="#222B22" font-family="Arial,sans-serif" font-size="17" font-weight="600">Item 1</text><text x="342.0" y="645" fill="#222B22" font-family="Arial,sans-serif" font-size="15" font-weight="400">Activity · Size · Weight · ₹</text><rect x="700.0" y="312" width="338.0" height="310" rx="4" fill="#E5E9DD" stroke="#708064" stroke-width="1"/><path d="M784.5,544.5 L869.0,386.4 L956.88,544.5 Z" fill="none" stroke="#708064"/><text x="708.0" y="336" fill="#222B22" font-family="Arial,sans-serif" font-size="17" font-weight="600">Item 2</text><text x="704.0" y="645" fill="#222B22" font-family="Arial,sans-serif" font-size="15" font-weight="400">Activity · Size · Weight · ₹</text><rect x="1062.0" y="312" width="338.0" height="310" rx="4" fill="#E5E9DD" stroke="#708064" stroke-width="1"/><path d="M1146.5,544.5 L1231.0,386.4 L1318.88,544.5 Z" fill="none" stroke="#708064"/><text x="1070.0" y="336" fill="#222B22" font-family="Arial,sans-serif" font-size="17" font-weight="600">Item 3</text><text x="1066.0" y="645" fill="#222B22" font-family="Arial,sans-serif" font-size="15" font-weight="400">Activity · Size · Weight · ₹</text><rect x="338.0" y="802" width="338.0" height="310" rx="4" fill="#E5E9DD" stroke="#708064" stroke-width="1"/><path d="M422.5,1034.5 L507.0,876.4 L594.88,1034.5 Z" fill="none" stroke="#708064"/><text x="346.0" y="826" fill="#222B22" font-family="Arial,sans-serif" font-size="17" font-weight="600">Item 5</text><text x="342.0" y="1135" fill="#222B22" font-family="Arial,sans-serif" font-size="15" font-weight="400">Activity · Size · Weight · ₹</text><rect x="700.0" y="802" width="338.0" height="310" rx="4" fill="#E5E9DD" stroke="#708064" stroke-width="1"/><path d="M784.5,1034.5 L869.0,876.4 L956.88,1034.5