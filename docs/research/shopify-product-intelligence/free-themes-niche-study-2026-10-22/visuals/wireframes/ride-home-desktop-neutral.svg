<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1800" viewBox="0 0 1440 1800" role="img" aria-labelledby="t d"><title id="t">Anonymous structure home desktop</title><desc id="d">Original proposed research schematic. Boxes are annotated content zones, not implemented controls. No transaction functionality.</desc><rect x="0" y="0" width="1440" height="1800" rx="0" fill="#FAFAFA" stroke="#888" stroke-width="1"/><text x="40" y="25" fill="#202020" font-family="Arial,sans-serif" font-size="12" font-weight="400">NEUTRAL STRUCTURE · HOME</text><text x="40" y="49" fill="#202020" font-family="Arial,sans-serif" font-size="11" font-weight="400">Schematic / no live data / 1440 × 1000 opening viewport</text><rect x="0" y="62" width="1440" height="76" rx="0" fill="#FFF" stroke="#888" stroke-width="1"/><text x="40" y="96" fill="#202020" font-family="Arial,sans-serif" font-size="21" font-weight="400">STORE</text><text x="300" y="97" fill="#202020" font-family="Arial,sans-serif" font-size="16" font-weight="400">Activities / Equipment / Clothing / Guides / Support</text><rect x="40" y="162" width="1360" height="320" rx="0" fill="#E7E7E7" stroke="#888" stroke-width="1"/><text x="60" y="205" fill="#202020" font-family="Arial,sans-serif" font-size="23" font-weight="600">01  Choose your activity</text><text x="60" y="235" fill="#202020" font-family="Arial,sans-serif" font-size="16" font-weight="400">Activity pathways above equipment; dark masthead / light facts below.</text><rect x="40.0" y="550" width="437.3333333333333" height="280" rx="0" fill="#E7E7E7" stroke="#888" stroke-width="1"/><text x="48.0" y="574" fill="#202020" font-family="Arial,sans-serif" font-size="17" font-weight="600">Activity equipment A</text><text x="44.0" y="853" fill="#202020" font-family="Arial,sans-serif" font-size="15" font-weight="400">Activity · Size · Weight · ₹</text><rect x="501.3333333333333" y="550" width="437.3333333333333" height="280" rx="0" fill="#E7E7E7" stroke="#888" stroke-width="1"/>