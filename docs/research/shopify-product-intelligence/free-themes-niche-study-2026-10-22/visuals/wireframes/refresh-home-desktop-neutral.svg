<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1800" viewBox="0 0 1440 1800" role="img" aria-labelledby="t d"><title id="t">Anonymous structure home desktop</title><desc id="d">Original proposed research schematic. Boxes are annotated content zones, not implemented controls. No transaction functionality.</desc><rect x="0" y="0" width="1440" height="1800" rx="0" fill="#FAFAFA" stroke="#888" stroke-width="1"/><text x="40" y="25" fill="#202020" font-family="Arial,sans-serif" font-size="12" font-weight="400">NEUTRAL STRUCTURE · HOME</text><text x="40" y="49" fill="#202020" font-family="Arial,sans-serif" font-size="11" font-weight="400">Schematic / no live data / 1440 × 1000 opening viewport</text><rect x="0" y="62" width="1440" height="76" rx="0" fill="#FFF" stroke="#888" stroke-width="1"/><text x="40" y="96" fill="#202020" font-family="Arial,sans-serif" font-size="21" font-weight="400">STORE</text><text x="300" y="97" fill="#202020" font-family="Arial,sans-serif" font-size="16" font-weight="400">Search / Pantry shelves / Dietary information / Recipes / About</text><rect x="40" y="162" width="740" height="210" rx="0" fill="#E7E7E7" stroke="#888" stroke-width="1"/><text x="60" y="205" fill="#202020" font-family="Arial,sans-serif" font-size="23" font-weight="600">01  Seasonal pantry selection</text><text x="60" y="235" fill="#202020" font-family="Arial,sans-serif" font-size="16" font-weight="400">Compact food context; clear link to shelf categories.</text><path d="M60,346 L321.2,271.2 L469.2,319.5 L760,235.5" fill="none" stroke="#888" stroke-width="1"/><rect x="808" y="162" width="592" height="210" rx="0" fill="#FFF" stroke="#888" stroke-width="1"/><text x="828" y="205" fill="#202020" font-family="Arial,sans-serif" font-size="23" font-weight="600">02  Pantry shelves</text><text x="828" y="235" fill="#202020" font-family="Arial,sans-serif" font-size="16" font-weight="400">Staples / condiments / snacks / ingredients</text><rect x="40" y="420" width="1360" heig