<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1800" viewBox="0 0 1440 1800" role="img" aria-labelledby="t d"><title id="t">Anonymous structure home desktop</title><desc id="d">Original proposed research schematic. Boxes are annotated content zones, not implemented controls. No transaction functionality.</desc><rect x="0" y="0" width="1440" height="1800" rx="0" fill="#FAFAFA" stroke="#888" stroke-width="1"/><text x="40" y="25" fill="#202020" font-family="Arial,sans-serif" font-size="12" font-weight="400">NEUTRAL STRUCTURE · HOME</text><text x="40" y="49" fill="#202020" font-family="Arial,sans-serif" font-size="11" font-weight="400">Schematic / no live data / 1440 × 1000 opening viewport</text><rect x="0" y="62" width="1440" height="76" rx="0" fill="#FFF" stroke="#888" stroke-width="1"/><text x="40" y="96" fill="#202020" font-family="Arial,sans-serif" font-size="21" font-weight="400">STORE</text><text x="300" y="97" fill="#202020" font-family="Arial,sans-serif" font-size="16" font-weight="400">Shop by use / Routine / Ingredients / Shades / About</text><rect x="40" y="162" width="550" height="440" rx="0" fill="#E7E7E7" stroke="#888" stroke-width="1"/><text x="60" y="205" fill="#202020" font-family="Arial,sans-serif" font-size="23" font-weight="600">01  Texture and product</text><text x="60" y="235" fill="#202020" font-family="Arial,sans-serif" font-size="16" font-weight="400">Restrained portrait media; no efficacy before/after.</text><path d="M60,576 L249.0,390.8 L359.0,492.0 L570,316.0" fill="none" stroke="#888" stroke-width="1"/><rect x="618" y="162" width="782" height="440" rx="0" fill="#FFF" stroke="#888" stroke-width="1"/><text x="638" y="205" fill="#202020" font-family="Arial,sans-serif" font-size="23" font-weight="600">02  Choose by use</text><text x="638" y="235" fill="#202020" font-family="Arial,sans-serif" font-size="16" font-weight="400">Routine stage, format and named shade. No diagnosis.</text><rect x="40.0" y="710" width="437.3333333333333" height="340" rx="0" fill="#E7E7E7" stroke="#888" stroke-width="1"/><text x="48.0" y="734" fill="#202020" font-family="Arial,sans-serif" font-size="17" font-weight="600">Cleanse</text><text x="44.0" y="1073" fill="#202020" font-family="Arial,sans-serif" font-size="15" font-weight="400">Use · Net qty · ₹</text><rect x="501.3333333333333" y="710" width="437.3333333333333" height="340" rx="0" fill="#E7E7E7" stroke="#888" stroke-width="1"/><text x="509.3333333333333" y="734" fill="#202020" font-family="Arial,sans-serif" font-size="17" font-weight="600">Prepare</text><text x="505.3333333333333" y="1073" fill="#202020" font-family="Arial,sans-serif" font-size="15" font-weight="400">Use · Net qty · ₹</text><rect x="962.6666666666666" y="710" width="437.3333333333333" height="340" rx="0" fill="#E7E7E7" stroke="#888" stroke-width="1"/><text x="970.6666666666666" y="734" fill="#202020" font-family="Arial,sans-serif" font-size="17" font-weight="600">Moisturize</text><text x="966.6666666666666" y="1073" fill="#202020" font-family="Arial,sans-serif" font-size="15" font-weight="400">Use · Net qty · ₹</text><rect x="40" y="1210" width="1360" height="260" rx="0" fill="#FFF" stroke="#888" stroke-width="1"/><text x="60" y="1253" fill="#202020" font-family="Arial,sans-serif" font-size="23" font-weight="600">03  Ingredient explanation</text><text x="60" y="1283" fill="#202020" font-family="Arial,sans-serif" font-size="16" font-weight="400">Readable directions, factual ingredient lists and supplied warnings.</text><path d="M0,1000 H1440" stroke="#555" stroke-dasharray="8 8"/><text x="12" y="992" fill="#202020" font-family="Arial,sans-serif" font-size="11" font-weight="400">Opening viewport boundary</text><rect x="40" y="1690" width="1360" height="80" rx="0" fill="#FFF" stroke="#888" stroke-width="1"/><text x="60" y="1733" fill="#202020" font-family="Arial,sans-serif" font-size="23" font-weight="600">04  Research annotation</text><text x="60" y="1763" fill="#202020" font-family="Arial,sans-serif" font-size="16" font-weight="400">Hierarchy and facts differ; server cart and hosted checkout stay shared.</text></svg>