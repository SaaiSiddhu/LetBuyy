<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1800" viewBox="0 0 1440 1800" role="img" aria-labelledby="t d"><title id="t">Anonymous structure collection desktop</title><desc id="d">Original proposed research schematic. Boxes are annotated content zones, not implemented controls. No transaction functionality.</desc><rect x="0" y="0" width="1440" height="1800" rx="0" fill="#FAFAFA" stroke="#888" stroke-width="1"/><text x="40" y="25" fill="#202020" font-family="Arial,sans-serif" font-size="12" font-weight="400">NEUTRAL STRUCTURE · COLLECTION</text><text x="40" y="49" fill="#202020" font-family="Arial,sans-serif" font-size="11" font-weight="400">Schematic / no live data / 1440 × 1000 opening viewport</text><rect x="0" y="62" width="1440" height="76" rx="0" fill="#FFF" stroke="#888" stroke-width="1"/><text x="40" y="96" fill="#202020" font-family="Arial,sans-serif" font-size="21" font-weight="400">STORE</text><text x="300" y="97" fill="#202020" font-family="Arial,sans-serif" font-size="16" font-weight="400">Prominent search / Books / Authors / Subjects / Stationery / Journal</text><rect x="40" y="160" width="1360" height="120" rx="0" fill="#FFF" stroke="#888" stroke-width="1"/><text x="60" y="203" fill="#202020" font-family="Arial,sans-serif" font-size="23" font-weight="600">01  Collection / category context</text><text x="60" y="233" fill="#202020" font-family="Arial,sans-serif" font-size="16" font-weight="400">Subject, author, format, language, price; stationery facets appear only in its collection.</text><rect x="40" y="312" width="270" height="1080" rx="0" fill="#FFF" stroke="#888" stroke-width="1"/><text x="60" y="355" fill="#202020" font-family="Arial,sans-serif" font-size="23" font-weight="600">02  Facet / subject rail</text><text x="60" y="385" fill="#202020" font-family="Arial,sans-serif" font-size="16" font-weight="400">Only data-backed attributes;</text><text x="60" y="408" fill="#202020" font-family="Arial,sans-serif" font-size="16" font-weight="400">unknown remains explicit.</text><rect x="338" y="312" width="1062" height="150" rx="0" fill="#FFF" stroke="#888" stroke-width="1"/><rect x="348" y="322" width="110" height="130" rx="0" fill="#E7E7E7" stroke="#888" stroke-width="1"/><text x="474" y="346" fill="#202020" font-family="Arial,sans-serif" font-size="21" font-weight="600">Item 1</text><text x="474" y="372" fill="#202020" font-family="Arial,sans-serif" font-size="16" font-weight="400">Author / title / format / language / INR price</text><rect x="338" y="488" width="1062" height="150" rx="0" fill="#FFF" stroke="#888" stroke-width="1"/><rect x="348" y="498" width="110" height="130" rx="0" fill="#E7E7E7" stroke="#888" stroke-width="1"/><text x="474" y="522" fill="#202020" font-family="Arial,sans-serif" font-size="21" font-weight="600">Item 2</text><text x="474" y="548" fill="#202020" font-family="Arial,sans-serif" font-size="16" font-weight="400">Author / title / format / language / INR price</text><rect x="338" y="664" width="1062" height="150" rx="0" fill="#FFF" stroke="#888" stroke-width="1"/><rect x="348" y="674" width="110" height="130" rx="0" fill="#E7E7E7" stroke="#888" stroke-width="1"/><text x="474" y="698" fill="#202020" font-family="Arial,sans-serif" font-size="21" font-weight="600">Item 3</text><text x="474" y="724" fill="#202020" font-family="Arial,sans-serif" font-size="16" font-weight="400">Author / title / format / language / INR price</text><rect x="338" y="840" width="1062" height="150" rx="0" fill="#FFF" stroke="#888" stroke-width="1"/><rect x="348" y="850" width="110" height="130" rx="0" fill="#E7E7E7" stroke="#888" stroke-width="1"/><text x="474" y="874" fill="#202020" font-family="Arial,sans-serif" font-size="21" font-weight="600">Item 4</text><text x="474" y="900" fill="#202020" font-family="Arial,sans-serif" font-size="16" font-weight="400">Author / title / format / language / INR price</text><rect x="338" y="1016" width="1062" height="150" rx="0" fill="#FFF" stroke="#888" stroke-width="1"/><rect x="348" y="1026" width="110" height="130" rx="0" fill="#E7E7E7" stroke="#888" stroke-width="1"/><text x="474" y="1050" fill="#202020" font-family="Arial,sans-serif" font-size="21" font-weight="600">Item 5</text><text x="474" y="1076" fill="#202020" font-family="Arial,sans-serif" font-size="16" font-weight="400">Author / title / format / language / INR price</text><rect x="338" y="1192" width="1062" height="150" rx="0" fill="#FFF" stroke="#888" stroke-width="1"/><rect x="348" y="1202" width="110" height="130" rx="0" fill="#E7E7E7" stroke="#888" stroke-width="1"/><text x="474" y="1226" fill="#202020" font-family="Arial,sans-serif" font-size="21" font-weight="600">Item 6</text><text x="474" y="1252" fill="#202020" font-family="Arial,sans-serif" font-size="16" font-weight="400">Author / title / format / language / INR price</text><rect x="40" y="1510" width="1360" height="140" rx="0" fill="#FFF" stroke="#888" stroke-width="1"/><text x="60" y="1553" fill="#202020" font-family="Arial,sans-serif" font-size="23" font-weight="600">03  Query / pagination / empty recovery</text><text x="60" y="1583" fill="#202020" font-family="Arial,sans-serif" font-size="16" font-weight="400">No infinite hidden dependency; return from product retains selection. Compare is shown only after a working contract.</text><path d="M0,1000 H1440" stroke="#555" stroke-dasharray="8 8"/><text x="12" y="992" fill="#202020" font-family="Arial,sans-serif" font-size="11" font-weight="400">Opening viewport boundary</text><rect x="40" y="1690" width="1360" height="80" rx="0" fill="#FFF" stroke="#888" stroke-width="1"/><text x="60" y="1733" fill="#202020" font-family="Arial,sans-serif" font-size="23" font-weight="600">04  Research annotation</text><text x="60" y="1763" fill="#202020" font-family="Arial,sans-serif" font-size="16" font-weight="400">Hierarchy and facts differ; server cart and hosted checkout stay shared.</text></svg>