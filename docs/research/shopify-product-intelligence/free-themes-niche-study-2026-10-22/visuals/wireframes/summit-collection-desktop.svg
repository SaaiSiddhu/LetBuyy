<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1800" viewBox="0 0 1440 1800" role="img" aria-labelledby="t d"><title id="t">Kindred collection desktop</title><desc id="d">Original proposed research schematic. Boxes are annotated content zones, not implemented controls. No transaction functionality.</desc><rect x="0" y="0" width="1440" height="1800" rx="0" fill="#FBF5F2" stroke="#8B6874" stroke-width="1"/><text x="40" y="25" fill="#352329" font-family="Arial,sans-serif" font-size="12" font-weight="400">LETBUYY · DESIGN PROPOSAL · COLLECTION</text><text x="40" y="49" fill="#352329" font-family="Arial,sans-serif" font-size="11" font-weight="400">Schematic / no live data / 1440 × 1000 opening viewport</text><rect x="0" y="62" width="1440" height="76" rx="0" fill="#FFFFFF" stroke="#8B6874" stroke-width="1"/><text x="40" y="96" fill="#352329" font-family="Arial,sans-serif" font-size="21" font-weight="400">Kindred</text><text x="300" y="97" fill="#352329" font-family="Arial,sans-serif" font-size="16" font-weight="400">Occasions / For whom / Under a budget / Ready-made sets / Gift help</text><rect x="40" y="160" width="1360" height="120" rx="6" fill="#FFFFFF" stroke="#8B6874" stroke-width="1"/><text x="60" y="203" fill="#352329" font-family="Arial,sans-serif" font-size="23" font-weight="600">01  Collection / category context</text><text x="60" y="233" fill="#352329" font-family="Arial,sans-serif" font-size="16" font-weight="400">Occasion, recipient preference, budget; recipient labels describe gifts, never inferred sensitive personal traits.</text><rect x="40" y="312" width="1360" height="90" rx="6" fill="#FFFFFF" stroke="#8B6874" stroke-width="1"/><text x="60" y="355" fill="#352329" font-family="Arial,sans-serif" font-size="23" font-weight="600">02  Occasion / recipient / budget</text><text x="60" y="385" fill="#352329" font-family="Arial,sans-serif" font-size="16" font-weight="400">Result count, sort and removable applied filters</text><rect x="40" y="440" width="300" height="960" rx="6" fill="#FFFFFF" stroke="#8B6874" stroke-width="1"/><text x="60" y="483" fill="#352329" font-family="Arial,sans-serif" font-size="23" font-weight="600">03  Occasion finder</text><text x="60" y="513" fill="#352329" font-family="Arial,sans-serif" font-size="16" font-weight="400">Recipient / budget / packaging;</text><text x="60" y="536" fill="#352329" font-family="Arial,sans-serif" font-size="16" font-weight="400">independent removable choices</text><rect x="370.0" y="440" width="503.0" height="310" rx="4" fill="#F0E1DB" stroke="#8B6874" stroke-width="1"/><path d="M495.75,672.5 L621.5,514.4 L752.28,672.5 Z" fill="none" stroke="#8B6874"/><text x="378.0" y="464" fill="#352329" font-family="Arial,sans-serif" font-size="17" font-weight="600">Curated gift A</text><text x="374.0" y="773" fill="#352329" font-family="Arial,sans-serif" font-size="15" font-weight="400">Contents · Occasion · ₹</text><rect x="897.0" y="440" width="503.0" height="310" rx="4" fill="#F0E1DB" stroke="#8B6874" stroke-width="1"/><path d="M1022.75,672.5 L1148.5,514.4 L1279.28,672.5 Z" fill="none" stroke="#8B6874"/><text x="905.0" y="464" fill="#352329" font-family="Arial,sans-serif" font-size="17" font-weight="600">Curated gift B</text><text x="901.0" y="773" fill="#352329" font-family="Arial,sans-serif" font-size="15" font-weight="400">Contents · Occasion · ₹</text><rect x="370" y="860" width="1030" height="140" rx="6" fill="#FFFFFF" stroke="#8B6874" stroke-width="1"/><text x="390" y="903" fill="#352329" font-family="Arial,sans-serif" font-size="23" font-weight="600">04  Suitability notes</text><text x="390" y="933" fill="#352329" font-family="Arial,sans-serif" font-size="16" font-weight="400">What arrives, who it is for, and actual packaging</text><rect x="370.0" y="1060" width="503.0" height="270" rx="4" fill="#F0E1DB" stroke="#8B6874" stroke-width="1"/><path d="M495.75,1262.5 L621.5,1124.8 L752.28,1262.5 Z" fill="none" stroke="#8B6874"/><text x="378.0" y="1084" fill="#352329" font-family="Arial,sans-serif" font-size="17" font-weight="600">Gift C</text><text x="374.0" y="1353" fill="#352329" font-family="Arial,sans-serif" font-size="15" font-weight="400">Contents · Occasion · ₹</text><rect x="897.0" y="1060" width="503.0" height="270" rx="4" fill="#F0E1DB" stroke="#8B6874" stroke-width="1"/><path d="M1022.75,1262.5 L1148.5,1124.8 L1279.28,1262.5 Z" fill="none" stroke="#8B6874"/><text x="905.0" y="1084" fill="#352329" font-family="Arial,sans-serif" font-size="17" font-weight="600">Gift D</text><text x="901.0" y="1353" fill="#352329" font-family="Arial,sans-serif" font-size="15" font-weight="400">Contents · Occasion · ₹</text><rect x="40" y="1510" width="1360" height="140" rx="6" fill="#FFFFFF" stroke="#8B6874" stroke-width="1"/><text x="60" y="1553" fill="#352329" font-family="Arial,sans-serif" font-size="23" font-weight="600">05  Query / pagination / empty recovery</text><text x="60" y="1583" fill="#352329" font-family="Arial,sans-serif" font-size="16" font-weight="400">No infinite hidden dependency; return from product retains selection. Compare is shown only after a working contract.</text><path d="M0,1000 H1440" stroke="#555" stroke-dasharray="8 8"/><text x="12" y="992" fill="#352329" font-family="Arial,sans-serif" font-size="11" font-weight="400">Opening viewport boundary</text><rect x="40" y="1690" width="1360" height="80" rx="6" fill="#FFFFFF" stroke="#8B6874" stroke-width="1"/><text x="60" y="1733" fill="#352329" font-family="Arial,sans-serif" font-size="23" font-weight="600">06  Research annotation</text><text x="60" y="1763" fill="#352329" font-family="Arial,sans-serif" font-size="16" font-weight="400">Hierarchy and facts differ; server cart and hosted checkout stay shared.</text></svg>