<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1800" viewBox="0 0 1440 1800" role="img" aria-labelledby="t d"><title id="t">Habitat collection desktop</title><desc id="d">Original proposed research schematic. Boxes are annotated content zones, not implemented controls. No transaction functionality.</desc><rect x="0" y="0" width="1440" height="1800" rx="0" fill="#F7F3EB" stroke="#7B7261" stroke-width="1"/><text x="40" y="25" fill="#302C25" font-family="Arial,sans-serif" font-size="12" font-weight="400">LETBUYY · DESIGN PROPOSAL · COLLECTION</text><text x="40" y="49" fill="#302C25" font-family="Arial,sans-serif" font-size="11" font-weight="400">Schematic / no live data / 1440 × 1000 opening viewport</text><rect x="0" y="62" width="1440" height="76" rx="0" fill="#FFFDFA" stroke="#7B7261" stroke-width="1"/><text x="40" y="96" fill="#302C25" font-family="Arial,sans-serif" font-size="21" font-weight="400">Habitat</text><text x="300" y="97" fill="#302C25" font-family="Arial,sans-serif" font-size="16" font-weight="400">Rooms / Furniture / Materials / Measurement guide / Delivery information</text><rect x="40" y="160" width="1360" height="120" rx="6" fill="#FFFDFA" stroke="#7B7261" stroke-width="1"/><text x="60" y="203" fill="#302C25" font-family="Arial,sans-serif" font-size="23" font-weight="600">01  Collection / category context</text><text x="60" y="233" fill="#302C25" font-family="Arial,sans-serif" font-size="16" font-weight="400">Room/type, maximum dimensions after normalized attributes, material, finish and price.</text><rect x="40" y="312" width="1360" height="90" rx="6" fill="#FFFDFA" stroke="#7B7261" stroke-width="1"/><text x="60" y="355" fill="#302C25" font-family="Arial,sans-serif" font-size="23" font-weight="600">02  Room / material / dimensions</text><text x="60" y="385" fill="#302C25" font-family="Arial,sans-serif" font-size="16" font-weight="400">Result count, sort and removable applied filters</text><rect x="40.0" y="440" width="668.0" height="400" rx="4" fill="#E9E2D5" stroke="#7B7261" stroke-width="1"/><path d="M207.0,740.0 L374.0,536.0 L547.6800000000001,740.0 Z" fill="none" stroke="#7B7261"/><text x="48.0" y="464" fill="#302C25" font-family="Arial,sans-serif" font-size="17" font-weight="600">Furniture A</text><text x="44.0" y="863" fill="#302C25" font-family="Arial,sans-serif" font-size="15" font-weight="400">W × D × H · Finish · ₹</text><rect x="732.0" y="440" width="668.0" height="400" rx="4" fill="#E9E2D5" stroke="#7B7261" stroke-width="1"/><path d="M899.0,740.0 L1066.0,536.0 L1239.68,740.0 Z" fill="none" stroke="#7B7261"/><text x="740.0" y="464" fill="#302C25" font-family="Arial,sans-serif" font-size="17" font-weight="600">Furniture B</text><text x="736.0" y="863" fill="#302C25" font-family="Arial,sans-serif" font-size="15" font-weight="400">W × D × H · Finish · ₹</text><rect x="40.0" y="1000" width="668.0" height="400" rx="4" fill="#E9E2D5" stroke="#7B7261" stroke-width="1"/><path d="M207.0,1300.0 L374.0,1096.0 L547.6800000000001,1300.0 Z" fill="none" stroke="#7B7261"/><text x="48.0" y="1024" fill="#302C25" font-family="Arial,sans-serif" font-size="17" font-weight="600">Furniture C</text><text x="44.0" y="1423" fill="#302C25" font-family="Arial,sans-serif" font-size="15" font-weight="400">W × D × H · Finish · ₹</text><rect x="732.0" y="1000" width="668.0" height="400" rx="4" fill="#E9E2D5" stroke="#7B7261" stroke-width="1"/><path d="M899.0,1300.0 L1066.0,1096.0 L1239.68,1300.0 Z" fill="none" stroke="#7B7261"/><text x="740.0" y="1024" fill="#302C25" font-family="Arial,sans-serif" font-size="17" font-weight="600">Furniture D</text><text x="736.0" y="1423" fill="#302C25" font-family="Arial,sans-serif" font-size="15" font-weight="400">W × D × H · Finish · ₹</text><rect x="40" y="1510" width="1360" height="140" rx="6" fill="#FFFDFA" stroke="#7B7261" stroke-width="1"/><text x="60" y="1553" fill="#302C25" font-family="Arial,sans-serif" font-size="23" font-weight="600">03  Query / pagination / empty recovery</text><text x="60" y="1583" fill="#302C25" font-family="Arial,sans-serif" font-size="16" font-weight="400">No infinite hidden dependency; return from product retains selection. Compare is shown only after a working contract.</text><path d="M0,1000 H1440" stroke="#555" stroke-dasharray="8 8"/><text x="12" y="992" fill="#302C25" font-family="Arial,sans-serif" font-size="11" font-weight="400">Opening viewport boundary</text><rect x="40" y="1690" width="1360" height="80" rx="6" fill="#FFFDFA" stroke="#7B7261" stroke-width="1"/><text x="60" y="1733" fill="#302C25" font-family="Arial,sans-serif" font-size="23" font-weight="600">04  Research annotation</text><text x="60" y="1763" fill="#302C25" font-family="Arial,sans-serif" font-size="16" font-weight="400">Hierarchy and facts differ; server cart and hosted checkout stay shared.</text></svg>