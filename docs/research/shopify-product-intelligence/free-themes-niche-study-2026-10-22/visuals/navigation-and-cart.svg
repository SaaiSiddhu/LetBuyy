<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1500" viewBox="0 0 1440 1500" role="img" aria-labelledby="t"><title id="t">Proposed navigation and cart interaction structures</title><rect width="1440" height="1500" fill="#f7f5f0"/><text x="40" y="48" font-family="Arial,sans-serif" font-size="30" fill="#242424">PROPOSED · navigation and cart structures</text><text x="40" y="80" font-family="Arial,sans-serif" font-size="17" fill="#242424">Annotated interaction specification; unimplemented. All checkout, price and stock authority remains canonical.</text><rect x="40" y="120" width="650" height="430" rx="8" fill="white" stroke="#666"/><text x="60" y="155" font-family="Arial,sans-serif" font-size="23" fill="#242424">Category / guided discovery menu</text><text x="60" y="195" font-family="Arial,sans-serif" font-size="17" fill="#242424">Fashion: named clothing categories, then collection and fit guide.</text><text x="60" y="234" font-family="Arial,sans-serif" font-size="17" fill="#242424">Toys: age and interest are independent discovery paths; all-</text><text x="60" y="259" font-family="Arial,sans-serif" font-size="17" fill="#242424">products is always reachable.</text><text x="60" y="298" font-family="Arial,sans-serif" font-size="17" fill="#242424">Furniture: room index → product type; gifts: occasion / recipient</text><text x="60" y="323" font-family="Arial,sans-serif" font-size="17" fill="#242424">preference / budget.</text><text x="60" y="362" font-family="Arial,sans-serif" font-size="17" fill="#242424">Beauty: use / routine stage; sports: activity → equipment type.</text><text x="60" y="401" font-family="Arial,sans-serif" font-size="17" fill="#242424">Mobile: open menu → nested category → back. Escape/close returns</text><text x="60" y="426" font-family="Arial,sans-serif" font-size="17" fill="#242424">focus to opener.</text><rect x="720" y="120" width="680" height="430" rx="8" fill="white" stroke="#666"/><text x="740" y="155" font-family="Arial,sans-serif" font-size="23" fill="#242424">Search / subject and process navigation</text><text x="740" y="195" font-family="Arial,sans-serif" font-size="17" fill="#242424">Electronics: persistent search, then device and technical category.</text><text x="740" y="234" font-family="Arial,sans-serif" font-size="17" fill="#242424">Pantry: shelf entry plus basic search; supported filters only.</text><text x="740" y="273" font-family="Arial,sans-serif" font-size="17" fill="#242424">Books: visible title/author search, subject index and explicit</text><text x="740" y="298" font-family="Arial,sans-serif" font-size="17" fill="#242424">stationery branch.</text><text x="740" y="337" font-family="Arial,sans-serif" font-size="17" fill="#242424">Personalization: choose base → specify → review; back/edit retains</text><text x="740" y="362" font-family="Arial,sans-serif" font-size="17" fill="#242424">input.</text><text x="740" y="401" font-family="Arial,sans-serif" font-size="17" fill="#242424">No menu requires hover. Query/selection state survives return from a</text><text x="740" y="426" font-family="Arial,sans-serif" font-size="17" fill="#242424">product.</text><rect x="40" y="600" width="430" height="650" rx="8" fill="white" stroke="#666"/><text x="60" y="635" font-family="Arial,sans-serif" font-size="23" fill="#242424">Shared stocked-product cart</text><text x="60" y="675" font-family="Arial,sans-serif" font-size="17" fill="#242424">Item image / name / actual variant</text><text x="60" y="714" font-family="Arial,sans-serif" font-size="17" fill="#242424">Quantity: decrease | number | increase</text><text x="60" y="753" font-family="Arial,sans-serif" font-size="17" fill="#242424">Server unit price and line total</text><text x="60" y="792" font-family="Arial,sans-serif" font-size="17" fill="#242424">Edit or remove item</text><text x="60" y="831" font-family="Arial,sans-serif" font-size="17" fill="#242424">Pending update → confirmed state OR</text><text x="60" y="856" font-family="Arial,sans-serif" font-size="17" fill="#242424">recoverable error with prior selection</text><text x="60" y="895" font-family="Arial,sans-serif" font-size="17" fill="#242424">Empty: meaningful niche discovery entry</text><text x="60" y="934" font-family="Arial,sans-serif" font-size="17" fill="#242424">Continue shopping / canonical hosted</text><text x="60" y="959" font-family="Arial,sans-serif" font-size="17" fill="#242424">checkout</text><text x="60" y="998" font-family="Arial,sans-serif" font-size="17" fill="#242424">Price or stock change requires explicit</text><text x="60" y="1023" font-family="Arial,sans-serif" font-size="17" fill="#242424">truthful acknowledgement.</text><rect x="505" y="600" width="430" height="650" rx="8" fill="white" stroke="#666"/><text x="525" y="635" font-family="Arial,sans-serif" font-size="23" fill="#242424">Pantry / ready-made gift cart</text><text x="525" y="675" font-family="Arial,sans-serif" font-size="17" fill="#242424">Pantry adds visible pack count and net</text><text x="525" y="700" font-family="Arial,sans-serif" font-size="17" fill="#242424">quantity; unit price only with valid data.</text><text x="525" y="739" font-family="Arial,sans-serif" font-size="17" fill="#242424">Ready-made gift adds actual set contents</text><text x="525" y="764" font-family="Arial,sans-serif" font-size="17" fill="#242424">and packaging description.</text><text x="525" y="803" font-family="Arial,sans-serif" font-size="17" fill="#242424">A supported gift note has Edit / length</text><text x="525" y="828" font-family="Arial,sans-serif" font-size="17" fill="#242424">limit / saved readback. No field appears</text><text x="525" y="853" font-family="Arial,sans-serif" font-size="17" fill="#242424">before the contract works.</text><text x="525" y="892" font-family="Arial,sans-serif" font-size="17" fill="#242424">Quantity and stock mechanics are shared. No</text><text x="525" y="917" font-family="Arial,sans-serif" font-size="17" fill="#242424">fast-delivery or configurable-bundle</text><text x="525" y="942" font-family="Arial,sans-serif" font-size="17" fill="#242424">promise.</text><text x="525" y="981" font-family="Arial,sans-serif" font-size="17" fill="#242424">Checkout path and payment methods stay</text><text x="525" y="1006" font-family="Arial,sans-serif" font-size="17" fill="#242424">canonical.</text><rect x="970" y="600" width="430" height="650" rx="8" fill="white" stroke="#666"/><text x="990" y="635" font-family="Arial,sans-serif" font-size="23" fill="#242424">Personalized configuration cart</text><text x="990" y="675" font-family="Arial,sans-serif" font-size="17" fill="#242424">GATED: requires CAP-15 before launch.</text><text x="990" y="714" font-family="Arial,sans-serif" font-size="17" fill="#242424">Base product / actual variant</text><text x="990" y="753" font-family="Arial,sans-serif" font-size="17" fill="#242424">Exact normalized text / placement / method</text><text x="990" y="778" font-family="Arial,sans-serif" font-size="17" fill="#242424">/ configuration version</text><text x="990" y="817" font-family="Arial,sans-serif" font-size="17" fill="#242424">Illustrative preview + authoritative text</text><text x="990" y="842" font-family="Arial,sans-serif" font-size="17" fill="#242424">summary</text><text x="990" y="881" font-family="Arial,sans-serif" font-size="17" fill="#242424">Edit configuration → validate → server</text><text x="990" y="906" font-family="Arial,sans-serif" font-size="17" fill="#242424">reprice → reviewed line snapshot</text><text x="990" y="945" font-family="Arial,sans-serif" font-size="17" fill="#242424">Two distinct configurations must not merge.</text><text x="990" y="984" font-family="Arial,sans-serif" font-size="17" fill="#242424">Order and merchant fulfillment view read</text><text x="990" y="1009" font-family="Arial,sans-serif" font-size="17" fill="#242424">back the same snapshot.</text><text x="40" y="1330" font-family="Arial,sans-serif" font-size="24" fill="#242424">State sequence for all mutations</text><text x="40" y="1375" font-family="Arial,sans-serif" font-size="19" fill="#242424">Ready → Pending → Confirmed  |  Validation error → Edit  |  Network failure → Retry without lost choices</text><text x="40" y="1420" font-family="Arial,sans-serif" font-size="17" fill="#242424">This visual defines reviewable behavior. It is not evidence that the backend, notes or personalization are implemented.</text></svg>