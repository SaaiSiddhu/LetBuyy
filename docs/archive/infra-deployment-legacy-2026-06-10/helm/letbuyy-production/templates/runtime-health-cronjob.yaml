apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ .Release.Name }}-runtime-health
  labels:
    app.kubernetes.io/name: letbuyy-runtime-health
    letbuyy.com/environment: {{ .Values.environment | quote }}
spec:
  schedule: {{ .Values.runtimeHealthProbe.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 10
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app.kubernetes.io/name: letbuyy-runtime-health
        spec:
          restartPolicy: Never
          containers:
            - name: probe
              image: {{ .Values.runtimeHealthProbe.image | quote }}
              command:
                - /bin/sh
                - -c
                - |
                  set -eu
                  {{- range .Values.runtimeHealthProbe.urls }}
                  curl --fail --silent --show-error --max-time 5 {{ . | quote }} >/dev/null
                  {{- end }}
