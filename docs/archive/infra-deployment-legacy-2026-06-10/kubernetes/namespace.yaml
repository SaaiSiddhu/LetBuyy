apiVersion: v1
kind: Namespace
metadata:
  name: letbuyy-production
  labels:
    app.kubernetes.io/name: letbuyy
    letbuyy.com/environment: production
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: production-runtime-quota
  namespace: letbuyy-production
spec:
  hard:
    requests.cpu: "16"
    requests.memory: 64Gi
    limits.cpu: "32"
    limits.memory: 128Gi
    pods: "120"
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: letbuyy-production
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-observability-scrape
  namespace: letbuyy-production
spec:
  podSelector:
    matchLabels:
      letbuyy.com/scrape: "true"
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: letbuyy-observability
      ports:
        - protocol: TCP
          port: 9090
