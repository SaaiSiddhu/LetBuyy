<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#090D17"/><stop offset="1" stop-color="#0D1426"/>
  </linearGradient>
  <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#8B5CF6"/><stop offset="1" stop-color="#4462FF"/>
  </linearGradient>
  <linearGradient id="brandV" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#8B5CF6"/><stop offset="1" stop-color="#4462FF"/>
  </linearGradient>
  <linearGradient id="accent" x1="510.578125" y1="0" x2="852.90625" y2="0" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#8EA2FF"/><stop offset="1" stop-color="#06B6D4"/>
  </linearGradient>
  <radialGradient id="glowP" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#8B5CF6" stop-opacity="0.45"/><stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="glowB" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#4462FF" stop-opacity="0.38"/><stop offset="1" stop-color="#4462FF" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="glowC" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#06B6D4" stop-opacity="0.22"/><stop offset="1" stop-color="#06B6D4" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="vig" cx="0.5" cy="0.46" r="0.75">
    <stop offset="0" stop-color="#04060C" stop-opacity="0"/><stop offset="0.62" stop-color="#04060C" stop-opacity="0"/><stop offset="1" stop-color="#04060C" stop-opacity="0.6"/>
  </radialGradient>
  <pattern id="gridMinor" width="60" height="60" patternUnits="userSpaceOnUse">
    <path d="M60 0H0V60" fill="none" stroke="#8EA2FF" stroke-opacity="0.075" stroke-width="1"/>
  </pattern>
  <pattern id="gridMajor" width="300" height="300" patternUnits="userSpaceOnUse">
    <path d="M300 0H0V300" fill="none" stroke="#8EA2FF" stroke-opacity="0.14" stroke-width="1"/>
    <path d="M-7 0H7 M0 -7V7" transform="translate(0,0)" stroke="#8EA2FF" stroke-opacity="0.30" stroke-width="1"/>
  </pattern>
</defs>

<rect width="1200" height="1200" fill="url(#bg)"/>
<rect width="1200" height="1200" fill="url(#gridMinor)"/>
<rect width="1200" height="1200" fill="url(#gridMajor)"/>
<ellipse cx="430" cy="715" rx="370" ry="370" fill="url(#glowP)"/>
<ellipse cx="770" cy="560" rx="330" ry="330" fill="url(#glowB)"/>
<ellipse cx="1010" cy="940" rx="210" ry="210" fill="url(#glowC)"/>
<ellipse cx="250" cy="360" rx="230" ry="230" fill="url(#glowB)"/>
<rect width="1200" height="1200" fill="url(#vig)"/>

<!-- top bar -->
<rect x="112" y="96" width="34" height="34" rx="9" fill="url(#brandV)"/>
<text x="129" y="120" font-family="'Liberation Sans',Arial,sans-serif" font-weight="bold" font-size="22" fill="#FFFFFF" text-anchor="middle">L</text>
<text x="160" y="121" font-family="'Liberation Sans',Arial,sans-serif" font-weight="bold" font-size="25" fill="#FFFFFF">LetBuyy</text>
<text x="1088" y="118" font-family="'DejaVu Sans Mono',monospace" font-size="15" letter-spacing="3" fill="#94A3B8" text-anchor="end">FOUNDER  JOURNEY</text>

<!-- eyebrow -->
<rect x="112" y="381" width="46" height="3" fill="url(#brand)"/>
<text x="176" y="393" font-family="'DejaVu Sans Mono',monospace" font-size="19" letter-spacing="5" fill="#8EA2FF">DAY 1<tspan fill="#94A3B8">  •  BUILDING LETBUYY</tspan></text>

<!-- headline -->
<g font-family="'Liberation Sans',Arial,sans-serif" font-weight="bold" font-size="78">
  <text x="112" y="523" fill="#B2BBCE">Most people are</text>
  <text x="112" y="614" fill="#B2BBCE">finishing college.</text>
  <text x="112" y="704" fill="#FFFFFF">I&#39;m building something</text>
  <text x="112" y="795" fill="#FFFFFF">that might </text>
  <text x="510.578125" y="795" fill="url(#accent)">outlive it.</text>
</g>

<!-- subtext -->
<g font-family="'Liberation Sans',Arial,sans-serif" font-size="25" fill="#94A3B8">
  <text x="112" y="860">A student rebuilding the foundations of an online-store</text>
  <text x="112" y="894">platform — slowly, and on purpose.</text>
</g>

<!-- timeline -->
<line x1="112" y1="1012" x2="1088" y2="1012" stroke="#94A3B8" stroke-opacity="0.35" stroke-width="1"/>
<circle cx="112" cy="1012" r="20" fill="url(#glowP)"/>
<circle cx="112" cy="1012" r="9" fill="url(#brandV)"/>
<circle cx="307" cy="1012" r="5" fill="none" stroke="#94A3B8" stroke-opacity="0.55" stroke-width="1"/>
<circle cx="502" cy="1012" r="5" fill="none" stroke="#94A3B8" stroke-opacity="0.45" stroke-width="1"/>
<circle cx="698" cy="1012" r="5" fill="none" stroke="#94A3B8" stroke-opacity="0.38" stroke-width="1"/>
<circle cx="893" cy="1012" r="5" fill="none" stroke="#94A3B8" stroke-opacity="0.30" stroke-width="1"/>
<circle cx="1088" cy="1012" r="5" fill="none" stroke="#94A3B8" stroke-opacity="0.24" stroke-width="1"/>

<!-- footer -->
<text x="112" y="1079" font-family="'DejaVu Sans Mono',monospace" font-size="16" letter-spacing="4" fill="#94A3B8">FOUNDER JOURNEY  •  DAY 1</text>
<text x="1088" y="1079" font-family="'DejaVu Sans Mono',monospace" font-size="15" letter-spacing="4" fill="#6E7C96" text-anchor="end">LETBUYY.COM</text>
</svg>