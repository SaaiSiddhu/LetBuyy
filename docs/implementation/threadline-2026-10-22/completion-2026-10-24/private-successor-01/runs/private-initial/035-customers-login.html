<div class="tl-theme"><section class="lb-auth lb-auth--login" data-section-id="customer-login-default">
  <h1>Sign in</h1>
  
  <form class="lb-auth__form" method="post" action="/api/customer/login">
    <input type="hidden" name="storeId" value="55555555-5555-4555-8555-555555555555">
    <input type="hidden" name="turnstileToken" value="">
    <lb-turnstile data-lb-island="turnstile"></lb-turnstile>
    <label>Email<input type="email" name="email" autocomplete="email" required=""></label>
    <label>Password<input type="password" name="password" autocomplete="current-password" required=""></label>
    <button type="submit">Sign in</button>
  </form>
  <a href="/store/threadline-private-render/customers/register">Create an account</a>
  <p class="lb-auth__letbuyy"><a href="/api/buyer-auth/start?return_to=/store/threadline-private-render/account">Continue with LetBuyy</a></p>
  <p>Have an older store account? Connect it with your verified LetBuyy account.</p>
  <form class="lb-auth__link-store" method="post" action="/api/buyer-auth/start">
    <input type="hidden" name="intent" value="link_store_customer">
    <input type="hidden" name="return_to" value="/store/threadline-private-render/account">
    <button type="submit">Connect my store account</button>
  </form>
</section>
</div>
