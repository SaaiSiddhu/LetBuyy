<script>
/* ── PNG export via canvas ── */
async function downloadPNG() {
  const svg   = document.getElementById('banner');
  const data  = new XMLSerializer().serializeToString(svg);
  const blob  = new Blob([data], { type: 'image/svg+xml;charset=utf-8' });
  const url   = URL.createObjectURL(blob);

  const canvas = document.createElement('canvas');
  canvas.width  = 1584;
  canvas.height = 396;
  const ctx = canvas.getContext('2d');

  const img = new Image();
  img.onload = () => {
    ctx.drawImage(img, 0, 0);
    URL.revokeObjectURL(url);
    canvas.toBlob(blob => {
      const a = document.createElement('a');
      a.href     = URL.createObjectURL(blob);
      a.download = 'letbuyy-linkedin-banner.png';
      a.click();
    }, 'image/png');
  };
  img.src = url;
}

/* ── SVG export ── */
function downloadSVG() {
  const svg  = document.getElementById('banner');
  const data = new XMLSerializer().serializeToString(svg);
  const blob = new Blob([data], { type: 'image/svg+xml' });
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href     = url;
  a.download = 'letbuyy-linkedin-banner.svg';
  a.click();
  URL.revokeObjectURL(url);
}

/* Preload Inter so the canvas export gets the real font */
document.fonts.load('800 70px Inter').then(() =>
  document.fonts.load('400 20px Inter')
);
</script>
