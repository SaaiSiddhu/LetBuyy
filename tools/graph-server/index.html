<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>LetBuyy Graph Intelligence</title>
<link rel="icon" type="image/svg+xml" href="/mark.svg" />
<style>
  /* Dark adaptation of the LetBuyy design system (config/tailwind/letbuyy-tokens.css):
     brand violet, semantic palette, radii 8/12/16, the --lb-space rhythm. */
  :root{
    --bg:#0a0912; --bg2:#0d0b16; --surface:#15131f; --raised:#1b1827; --sidebar:#0d0b15;
    --border:#272234; --border-soft:#1d1929; --overlay:rgba(13,11,21,.86);
    --text:#ECEAF5; --subdued:#9b94ae; --muted:#6e6883;
    --brand:#8B5CF6; --brand-cta:#6D28D9; --brand-2:#a78bfa; --brand-soft:rgba(139,92,246,.13); --glow:rgba(139,92,246,.5);
    --success:#22C55E; --warning:#F59E0B; --critical:#EF4444; --info:#3B82F6;
    --r-sm:4px; --r-md:8px; --r-lg:12px; --r-xl:16px; --r-pill:999px;
    --s2:8px; --s3:12px; --s4:16px; --s5:20px; --s6:24px;
    --font:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    --mono:'SF Mono',ui-monospace,'JetBrains Mono',Menlo,monospace;
    --shadow:0 8px 30px rgba(0,0,0,.5); --shadow-sm:0 2px 10px rgba(0,0,0,.4);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;font-family:var(--font);font-size:14px;line-height:1.5;color:var(--text);
    background:radial-gradient(1200px 700px at 78% -8%,rgba(139,92,246,.10),transparent 60%),
               radial-gradient(900px 600px at 0% 110%,rgba(59,130,246,.07),transparent 55%),var(--bg);
    -webkit-font-smoothing:antialiased;overflow:hidden}
  ::selection{background:rgba(139,92,246,.35)}
  ::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:#2a2538;border-radius:8px;border:2px solid transparent;background-clip:content-box}
  ::-webkit-scrollbar-thumb:hover{background:#3a3450;background-clip:content-box}

  header{display:flex;align-items:center;gap:var(--s4);padding:13px 22px;border-bottom:1px solid var(--border-soft);
    background:linear-gradient(180deg,rgba(255,255,255,.02),transparent),var(--bg2);backdrop-filter:blur(8px)}
  .brand{display:flex;align-items:center;gap:13px}
  .brand .logo{height:30px;width:auto;display:block;filter:drop-shadow(0 2px 8px rgba(68,98,255,.3))}
  .brand .sub{color:var(--subdued);font-weight:600;font-size:11px;letter-spacing:.7px;text-transform:uppercase;padding-left:13px;border-left:1px solid var(--border)}
  .chips{display:flex;gap:7px;flex-wrap:wrap;margin-left:auto}
  .chip{display:flex;gap:6px;align-items:center;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-pill);
    padding:4px 12px;font-size:12px;color:var(--subdued);transition:.15s}
  .chip:hover{border-color:#3a3450;color:var(--text)}
  .chip b{color:var(--text);font-variant-numeric:tabular-nums}
  .chip.key b{color:var(--brand-2)}

  .tabs{display:flex;gap:3px;padding:9px 18px;border-bottom:1px solid var(--border-soft);overflow-x:auto;background:var(--bg2)}
  .tab{padding:6px 13px;border-radius:var(--r-md);cursor:pointer;color:var(--subdued);white-space:nowrap;font-size:13px;font-weight:500;
    border:1px solid transparent;transition:.15s}
  .tab:hover{color:var(--text);background:var(--surface)}
  .tab.active{color:#fff;background:linear-gradient(180deg,var(--brand),var(--brand-cta));border-color:var(--brand);box-shadow:0 4px 14px rgba(109,40,217,.45)}
  .tab.star{color:var(--brand-2)} .tab.star.active{color:#fff}

  main{display:grid;grid-template-columns:1fr 332px;height:calc(100vh - 108px)}
  .stage{position:relative;overflow:hidden}
  .inspector{border-left:1px solid var(--border-soft);background:var(--sidebar);overflow:auto;padding:16px;display:flex;flex-direction:column;gap:14px}

  .field{position:relative}
  .field svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
  input[type=text]{width:100%;padding:9px 11px 9px 34px;background:var(--bg);border:1px solid var(--border);border-radius:var(--r-md);
    color:var(--text);font-family:inherit;font-size:13px;transition:.15s}
  input[type=text]:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
  input::placeholder{color:var(--muted)}
  button{padding:8px 11px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);color:var(--text);
    cursor:pointer;font-family:inherit;font-size:13px;font-weight:500;transition:.15s;display:inline-flex;align-items:center;gap:6px;justify-content:center}
  button:hover{border-color:var(--brand);background:#1c1827}
  button.primary{background:linear-gradient(180deg,var(--brand),var(--brand-cta));border-color:var(--brand);color:#fff}
  button.primary:hover{filter:brightness(1.08)}
  .label{font-size:10.5px;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);font-weight:600;margin:2px 0 7px}
  .pathgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  .pathgrid input{padding-left:11px;min-width:0}

  .results{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
  .results li{padding:9px 11px;border:1px solid var(--border);border-radius:var(--r-md);cursor:pointer;background:var(--bg);transition:.12s;position:relative}
  .results li:hover{border-color:var(--brand);background:#1a1626;transform:translateX(2px)}
  .results .lbl{font-weight:600;color:var(--brand-2);font-size:13px}
  .results .sf{font-size:11px;color:var(--muted);word-break:break-all;margin-top:2px;font-family:var(--mono)}
  .results .deg{position:absolute;right:10px;top:9px;font-size:10px;color:var(--subdued);background:var(--surface);border:1px solid var(--border);border-radius:var(--r-pill);padding:1px 7px;font-variant-numeric:tabular-nums}

  canvas{display:block;width:100%;height:100%}
  .hint{color:var(--subdued);font-size:13px;padding:24px;max-width:560px;line-height:1.7}
  .hint b{color:var(--brand-2)} .hint code{background:var(--surface);border:1px solid var(--border);border-radius:4px;padding:1px 6px;font-family:var(--mono);font-size:12px}

  /* dashboards */
  .dash{padding:22px 26px;overflow:auto;height:100%}
  .dash h2{margin:0;font-size:20px;font-weight:680;letter-spacing:-.2px}
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:13px;margin:16px 0}
  .card{position:relative;background:linear-gradient(180deg,var(--raised),var(--surface));border:1px solid var(--border);border-radius:var(--r-lg);
    padding:15px 16px;overflow:hidden;transition:.18s}
  .card:hover{transform:translateY(-2px);border-color:#352f48;box-shadow:var(--shadow-sm)}
  .card::before{content:'';position:absolute;inset:0 0 auto 0;height:2px;background:linear-gradient(90deg,var(--brand),transparent)}
  .card .n{font-size:26px;font-weight:720;letter-spacing:-.5px;font-variant-numeric:tabular-nums}
  .card .k{font-size:11px;color:var(--subdued);text-transform:uppercase;letter-spacing:.5px;margin-top:2px}
  .risk{height:7px;border-radius:var(--r-pill);background:#241f33;overflow:hidden;margin-top:9px}
  .risk>i{display:block;height:100%;border-radius:var(--r-pill)}
  .badges{display:flex;gap:6px;flex-wrap:wrap}
  .badge{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-pill);padding:3px 11px;font-size:12px;color:var(--subdued)}
  .badge b{color:var(--text);font-variant-numeric:tabular-nums}
  .badge.brand{background:var(--brand-soft);border-color:rgba(139,92,246,.3);color:var(--brand-2)}
  .sectionTitle{font-size:10.5px;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);font-weight:600;margin:20px 0 8px}
  .row{display:flex;gap:10px;align-items:center}
  table{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px}
  th{text-align:left;padding:7px 10px;color:var(--muted);font-weight:600;font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid var(--border)}
  td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--border-soft)}
  tr.clk{cursor:pointer;transition:.1s} tr.clk:hover td{background:var(--brand-soft)}
  td.lbl a{color:var(--brand-2);font-weight:600;text-decoration:none} td .mono{font-family:var(--mono);color:var(--muted);font-size:12px}
  td .deg{font-variant-numeric:tabular-nums;color:var(--subdued)}

  /* atlas */
  .atlasbar{position:absolute;top:14px;right:14px;display:flex;gap:8px;align-items:center;z-index:5}
  .seg{display:flex;background:var(--overlay);border:1px solid var(--border);border-radius:var(--r-md);overflow:hidden;backdrop-filter:blur(8px)}
  .seg button{border:0;border-radius:0;background:transparent;padding:7px 11px;color:var(--subdued);font-size:12px}
  .seg button:hover{background:var(--surface);color:var(--text)}
  .seg button.on{background:var(--brand);color:#fff}
  .iconbtn{background:var(--overlay);border:1px solid var(--border);border-radius:var(--r-md);width:34px;height:34px;padding:0;backdrop-filter:blur(8px)}
  .atlasPanel{display:flex;flex-direction:column;gap:12px}
  .legend{display:flex;flex-direction:column;gap:1px}
  .legend .li{display:flex;align-items:flex-start;gap:9px;padding:7px 8px;border-radius:var(--r-md);cursor:pointer;transition:.1s}
  .legend .li:hover{background:var(--surface)}
  .legend .li.on{background:var(--brand-soft);box-shadow:inset 2px 0 0 var(--brand)}
  .legend .sw{width:11px;height:11px;border-radius:3px;flex:none;margin-top:3px;box-shadow:0 0 7px currentColor}
  .legend .cinfo{flex:1;min-width:0}
  .legend .cname{font-size:13px;color:var(--text);font-weight:550;display:flex;justify-content:space-between;gap:8px;align-items:baseline}
  .legend .cname b{color:var(--subdued);font-variant-numeric:tabular-nums;font-weight:600;font-size:12px}
  .legend .chint{font-size:11px;color:var(--muted);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cdetail .sym{font-size:12.5px;color:var(--brand-2);cursor:pointer;padding:3px 0;font-family:var(--mono)} .cdetail .sym:hover{color:#fff}
  .back{color:var(--subdued);font-size:12px;cursor:pointer} .back:hover{color:var(--brand-2)}
  .nodecard{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:13px;box-shadow:var(--shadow-sm)}
  .nodecard .t{font-weight:660;color:var(--brand-2);font-size:14px;word-break:break-word}
  .nodecard .m{font-size:11.5px;color:var(--subdued);margin-top:3px;font-family:var(--mono);word-break:break-all}
  .nodecard .nb{font-size:12.5px;color:var(--info);cursor:pointer;padding:3px 0} .nodecard .nb:hover{color:var(--brand-2)}
  .nodecard a{color:var(--brand-2);text-decoration:none;font-size:12.5px}
  .spin{width:16px;height:16px;border:2px solid var(--border);border-top-color:var(--brand);border-radius:50%;animation:sp 0.7s linear infinite;display:inline-block}
  @keyframes sp{to{transform:rotate(360deg)}}
  .fade{animation:fade .25s ease}@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1}}

  /* ============ v6 dual-mode operating system ============ */
  .modetoggle{display:flex;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-pill);overflow:hidden;margin-left:auto}
  .modetoggle button{border:0;border-radius:0;background:transparent;padding:6px 16px;color:var(--subdued);font-weight:600;font-size:12.5px}
  .modetoggle button.on{background:linear-gradient(180deg,var(--brand),var(--brand-cta));color:#fff}
  .envswitch{display:flex;align-items:center;gap:7px;margin-left:12px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-pill);padding:3px 10px 3px 12px}
  .envswitch select{background:transparent;border:0;color:var(--text);font-family:inherit;font-size:12.5px;font-weight:600;cursor:pointer;outline:none}
  .envswitch select option{background:var(--raised);color:var(--text)}
  .envdot{width:8px;height:8px;border-radius:50%;background:var(--warning);box-shadow:0 0 7px var(--warning);flex:none}
  .notconn{display:inline-flex;align-items:center;gap:7px;background:rgba(245,158,11,.12);border:1px solid rgba(245,158,11,.32);color:#fcd34d;border-radius:var(--r-md);padding:8px 13px;font-size:12.5px;font-weight:600;margin:4px 0}
  .notconn .d{width:7px;height:7px;border-radius:50%;background:var(--warning);flex:none}
  .kbtn{margin-left:10px;color:var(--subdued);font-size:12px;border-radius:var(--r-md)}
  .kbtn kbd{background:var(--bg);border:1px solid var(--border);border-radius:4px;padding:0 5px;font-family:var(--mono);font-size:11px;margin-left:5px}

  #explain{height:calc(100vh - 56px);display:grid;grid-template-columns:268px 1fr;overflow:hidden}
  .xtree{border-right:1px solid var(--border-soft);background:var(--sidebar);overflow:auto;padding:12px 10px}
  .xtree .grp{margin-bottom:3px}
  .xtree .sec{display:flex;align-items:center;gap:9px;padding:9px 11px;border-radius:var(--r-md);cursor:pointer;color:var(--text);font-weight:600;font-size:13.5px;transition:.12s}
  .xtree .sec:hover{background:var(--surface)} .xtree .sec.active{background:var(--brand-soft);color:var(--brand-2);box-shadow:inset 2px 0 0 var(--brand)}
  .xtree .sec .ic{width:18px;text-align:center;color:var(--brand-2);font-size:14px}
  .xtree .sec .caret{margin-left:auto;color:var(--muted);transition:.15s;font-size:11px}
  .xtree .sec.open .caret{transform:rotate(90deg)}
  .xtree .kids{margin:2px 0 6px 0;overflow:hidden}
  .xtree .kid{padding:7px 11px 7px 38px;border-radius:var(--r-md);cursor:pointer;color:var(--subdued);font-size:12.5px;transition:.1s;display:flex;justify-content:space-between;gap:6px;align-items:center}
  .xtree .kid:hover{background:var(--surface);color:var(--text)} .xtree .kid.active{background:var(--brand-soft);color:var(--brand-2)}
  .xtree .kid .tier{font-size:9px;color:var(--muted)}

  .xmain{overflow:auto;padding:26px 32px;max-width:1080px}
  .xhero{display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap}
  .xhero h1{margin:0;font-size:26px;font-weight:740;letter-spacing:-.4px}
  .xhero .crit{font-size:11px;font-weight:700;padding:4px 12px;border-radius:var(--r-pill);white-space:nowrap}
  .crit.t1{background:rgba(239,68,68,.14);color:#fca5a5;border:1px solid rgba(239,68,68,.3)}
  .crit.t2{background:rgba(245,158,11,.14);color:#fcd34d;border:1px solid rgba(245,158,11,.3)}
  .crit.t3{background:var(--surface);color:var(--subdued);border:1px solid var(--border)}
  .xlede{color:var(--subdued);font-size:15px;line-height:1.65;margin:14px 0 4px;max-width:760px}
  .xgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:13px;margin:18px 0}
  .xcard{background:linear-gradient(180deg,var(--raised),var(--surface));border:1px solid var(--border);border-radius:var(--r-lg);padding:15px 17px}
  .xcard .h{font-size:10.5px;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);font-weight:700;margin-bottom:6px}
  .xcard .b{font-size:13.5px;line-height:1.55;color:var(--text)}
  .xcard.warn{border-color:rgba(239,68,68,.25)} .xcard.warn .h{color:#fca5a5}
  .xrel{display:flex;gap:24px;flex-wrap:wrap;margin:8px 0 4px}
  .xrel .col .h{font-size:10.5px;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);font-weight:700;margin-bottom:7px}
  .xpill{display:inline-flex;align-items:center;gap:5px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-pill);padding:4px 12px;font-size:12.5px;color:var(--subdued);cursor:pointer;margin:0 5px 5px 0;transition:.12s}
  .xpill:hover{border-color:var(--brand);color:var(--brand-2)}
  .xpill.b{background:var(--brand-soft);border-color:rgba(139,92,246,.3);color:var(--brand-2)}

  .xflow{display:flex;flex-direction:column;gap:0;margin:6px 0}
  .xstep{display:flex;align-items:center;gap:12px;padding:11px 14px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);position:relative;cursor:default;transition:.12s}
  .xstep:hover{border-color:#352f48}
  .xstep .num{width:22px;height:22px;border-radius:50%;background:var(--brand-soft);color:var(--brand-2);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none}
  .xstep .arrow{height:14px;width:1px;background:var(--border);margin:2px 0 2px 24px}
  .xsection{font-size:11px;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);font-weight:700;margin:26px 0 10px;display:flex;align-items:center;gap:10px}
  .xsection:after{content:'';flex:1;height:1px;background:var(--border-soft)}

  .xreveal{border:1px solid var(--border);border-radius:var(--r-lg);overflow:hidden;margin:8px 0}
  .xreveal .hd{display:flex;align-items:center;gap:10px;padding:13px 16px;cursor:pointer;background:var(--surface);font-weight:600;font-size:13.5px}
  .xreveal .hd:hover{background:#1c1827} .xreveal .hd .caret{margin-left:auto;color:var(--muted);transition:.15s}
  .xreveal.open .hd .caret{transform:rotate(90deg)}
  .xreveal .bd{padding:4px 16px 16px;display:none} .xreveal.open .bd{display:block}
  .xrow{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--border-soft);font-size:13px;align-items:baseline}
  .xrow .k{width:96px;flex:none;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.5px;font-weight:600}
  .xrow .v{flex:1;min-width:0;font-family:var(--mono);font-size:12px;color:var(--subdued);word-break:break-word}

  .xai{background:#0c0a14;border:1px solid var(--border);border-radius:var(--r-lg);overflow:hidden}
  .xai .hd{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid var(--border-soft);font-size:12px;color:var(--subdued)}
  .xai pre{margin:0;padding:15px;font-family:var(--mono);font-size:12px;line-height:1.65;color:#c9c3da;white-space:pre-wrap;max-height:340px;overflow:auto}
  .copybtn{margin-left:auto}
  .xatlas{margin-top:18px}

  /* command palette */
  .cmdk-bg{position:fixed;inset:0;background:rgba(5,4,10,.7);backdrop-filter:blur(3px);z-index:50;display:none;align-items:flex-start;justify-content:center;padding-top:12vh}
  .cmdk-bg.on{display:flex}
  .cmdk{width:min(640px,92vw);background:var(--raised);border:1px solid var(--border);border-radius:var(--r-xl);box-shadow:var(--shadow);overflow:hidden}
  .cmdk input{border:0;border-bottom:1px solid var(--border-soft);border-radius:0;padding:16px 18px;font-size:15px;background:transparent}
  .cmdk input:focus{box-shadow:none;border-color:var(--border-soft)}
  .cmdk .res{max-height:52vh;overflow:auto;padding:8px}
  .cmdk .cat{font-size:10px;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);font-weight:700;padding:10px 12px 5px}
  .cmdk .item{padding:9px 12px;border-radius:var(--r-md);cursor:pointer;display:flex;gap:10px;align-items:center;font-size:13.5px}
  .cmdk .item:hover,.cmdk .item.sel{background:var(--brand-soft);color:var(--brand-2)}
  .cmdk .item .ic{color:var(--brand-2);width:16px;text-align:center}
  .cmdk .item .meta{margin-left:auto;color:var(--muted);font-size:11px;font-family:var(--mono)}
  .cmdk .ask{padding:11px 14px;border-top:1px solid var(--border-soft);font-size:12px;color:var(--subdued)}

  .empty{color:var(--muted);padding:40px;text-align:center;font-size:14px}
  @media (max-width:880px){
    main{grid-template-columns:1fr} .inspector{display:none}
    #explain{grid-template-columns:1fr;height:auto;min-height:calc(100vh - 56px)}
    .xtree{border-right:0;border-bottom:1px solid var(--border-soft);max-height:38vh}
    .xmain{padding:18px 16px}
    .tabs{padding:8px 10px} header{padding:11px 14px;flex-wrap:wrap;gap:10px} .brand .sub{display:none}
    #chips{display:none} .modetoggle{margin-left:0} .kbtn{margin-left:auto}
    .xhero h1{font-size:21px} table{display:block;overflow-x:auto;white-space:nowrap}
    .xgrid{grid-template-columns:1fr} .xrel{gap:14px}
  }
</style>
</head>
<body>
<header>
  <div class="brand"><img class="logo" src="/logo.svg" alt="LetBuyy" /><span class="sub">Operating System</span></div>
  <div class="modetoggle" id="modetoggle">
    <button data-m="explain" class="on">◷ Explain</button>
    <button data-m="technical">⌥ Technical</button>
  </div>
  <div class="envswitch" id="envswitch" title="Environment — repository intelligence renders in all; live data needs a connected env">
    <span class="envdot" id="envdot"></span>
    <select id="envsel"><option value="local">Local</option><option value="staging">Staging</option><option value="production">Production</option></select>
  </div>
  <button class="kbtn" id="cmdkBtn">Search everything <kbd>⌘K</kbd></button>
  <div class="chips" id="chips" style="margin-left:14px"></div>
</header>
<div id="explain"></div>
<div class="tabs" id="tabs" style="display:none"></div>
<main style="display:none">
  <div class="stage" id="stage">
    <canvas id="cv"></canvas>
    <div class="atlasbar" id="atlasbar" style="display:none"></div>
    <div class="dash fade" id="dash" style="display:none"></div>
    <div class="hint" id="hint">Search a symbol — try <b>create_checkout_order</b>, <b>verifySiteOwnership</b>, <b>issueCustomerSession</b> — or open <b>★ Atlas</b> for the full architecture galaxy. Click any node to explore its neighborhood.</div>
  </div>
  <aside class="inspector" id="inspector">
    <div>
      <div class="field"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        <input id="q" type="text" placeholder="Search nodes, files, routes, symbols…" autocomplete="off" /></div>
    </div>
    <div id="inspectorBody"></div>
  </aside>
</main>
<script>
const TABS=['overview','atlas','data','infra','domains','merchant','journey','dpay','dsec','deploy','incidents','secrets','runtime','depstate','execution','memory','impact','mgraph','robs','rmerch','rrev','rsec','rinc','rjourney','readiness','decisions','brain','mhealth','mrisk','mgrowth','custi','revv2','cost','telem','memv2','fixeng','services','apps','packages','payments','identity','database','marketplace','themes','developer','security','tenancy'];
const TLABEL={overview:'Overview',atlas:'★ Atlas',data:'◆ Data Layer',infra:'◇ Infrastructure',domains:'◈ Domains',merchant:'◈ Merchant',journey:'◈ Customer Journey',dpay:'◈ Payments',dsec:'◈ Security',deploy:'◈ Deployment',incidents:'◈ Incidents',secrets:'◈ Secrets',runtime:'◉ Runtime',depstate:'◉ Deployments',execution:'◉ Execution',memory:'◉ Memory',impact:'◉ Impact',mgraph:'◉ Merchant Graph',robs:'◐ Runtime Obs',rmerch:'◐ Merchants',rrev:'◐ Revenue',rsec:'◐ Security',rinc:'◐ Incidents',rjourney:'◐ Journey',readiness:'◐ Readiness',decisions:'◐ Decisions',brain:'⬢ Unified Brain',mhealth:'⬢ Merchant Health',mrisk:'⬢ Merchant Risk',mgrowth:'⬢ Merchant Growth',custi:'⬢ Customer Intel',revv2:'⬢ Revenue V2',cost:'⬢ Cost',telem:'⬢ Telemetry',memv2:'⬢ Memory V2',fixeng:'⬢ Fix Engine',services:'Services',apps:'Apps',packages:'Packages',payments:'Payments',identity:'Identity',database:'Database',marketplace:'Marketplace',themes:'Themes',developer:'Developer',security:'Security',tenancy:'Multi-Tenancy'};
const ATLAS_DOMAINS={atlas:'',services:'services',apps:'apps',packages:'packages',payments:'payments',identity:'identity',database:'database',marketplace:'marketplace',themes:'themes',developer:'developer',security:'security',tenancy:'tenancy'};
const $=s=>document.querySelector(s);
const cv=$('#cv'),ctx=cv.getContext('2d'),dash=$('#dash'),hint=$('#hint'),atlasbar=$('#atlasbar'),ibody=$('#inspectorBody');
let DPR=window.devicePixelRatio||1, raf=null, atlasRedraw=null, atlasCtl=null;
const api=p=>fetch(p).then(r=>r.json());
const esc=s=>(s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const fmt=n=>Number(n).toLocaleString();

function clearCanvas(){cv.onwheel=cv.onmousedown=cv.onmousemove=cv.onmouseup=cv.onclick=cv.onmouseleave=null;atlasRedraw=null;atlasCtl=null;}
function stopSim(){if(raf)cancelAnimationFrame(raf);raf=null;}
function showCanvas(){dash.style.display='none';hint.style.display='none';cv.style.display='block';resize();}
function showDash(){stopSim();clearCanvas();cv.style.display='none';atlasbar.style.display='none';hint.style.display='none';dash.style.display='block';}
function resize(){const r=$('#stage').getBoundingClientRect();cv.width=r.width*DPR;cv.height=r.height*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);}
window.addEventListener('resize',()=>{if(cv.style.display!=='none')resize();});

// ---------- default inspector (search results) ----------
function searchPanel(){
  ibody.innerHTML=`<div class="label">Trace shortest path</div>
    <div class="pathgrid"><input id="pa" type="text" placeholder="from"/><input id="pb" type="text" placeholder="to"/></div>
    <button id="trace" class="primary" style="width:100%;margin-top:6px">Trace path</button>
    <div class="label" style="margin-top:16px">Results</div><ul class="results" id="results"></ul>`;
  $('#trace').onclick=trace;
}
async function doSearch(){
  const q=$('#q').value.trim();
  const ul=$('#results'); if(!ul)return;
  if(!q){ul.innerHTML='';return;}
  const rs=await api('/api/search?q='+encodeURIComponent(q)+'&limit=40');
  ul.innerHTML=rs.length?rs.map(n=>`<li data-id="${encodeURIComponent(n.id)}"><span class="deg">${n.degree}</span><span class="lbl">${esc(n.label)}</span><div class="sf">${esc(n.source_file||'')}${n.source_location?':'+esc(n.source_location):''}</div></li>`).join('')
    :'<li class="sf" style="border:0;background:none;padding:6px">No matches.</li>';
  ul.querySelectorAll('li[data-id]').forEach(li=>li.onclick=()=>loadNode(decodeURIComponent(li.dataset.id)));
}

// ---------- boot ----------
async function boot(){
  const s=await api('/api/stats');
  $('#chips').innerHTML=[['nodes',s.nodes,1],['edges',s.edges,0],['communities',s.communities,0],['routes',s.routes,1],['pages',s.pages,0]]
    .map(([k,v,key])=>`<span class="chip${key?' key':''}">${k} <b>${fmt(v)}</b></span>`).join('')
    +`<span class="chip">graph age <b>${s.freshness_minutes}m</b></span>`;
  $('#tabs').innerHTML=TABS.map(t=>`<div class="tab${t==='atlas'?' star':''}" data-t="${t}">${TLABEL[t]}</div>`).join('');
  $('#tabs').querySelectorAll('.tab').forEach(el=>el.onclick=()=>selectTab(el.dataset.t));
  selectTab('overview');
}
function setActive(t){document.querySelectorAll('.tab').forEach(e=>e.classList.toggle('active',e.dataset.t===t));}

async function selectTab(t){
  setActive(t);
  if(t!=='atlas')searchPanel();
  if(t==='atlas')return renderAtlas('');
  showDash();
  if(t==='overview')return overview();
  if(t==='data')return renderData();
  if(t==='infra')return renderInfra();
  if(t==='domains')return renderDomains();
  if(t==='merchant')return renderMerchant();
  if(t==='journey')return renderJourney();
  if(t==='dpay')return renderDPay();
  if(t==='dsec')return renderDSec();
  if(t==='deploy')return renderDeploy();
  if(t==='incidents')return renderIncidents();
  if(t==='secrets')return renderSecrets();
  if(t==='runtime')return renderRuntime();
  if(t==='depstate')return renderDepState();
  if(t==='execution')return renderExecution();
  if(t==='memory')return renderMemory();
  if(t==='impact')return renderImpact();
  if(t==='mgraph')return renderMgraph();
  if(t==='robs')return renderRobs();
  if(t==='rmerch')return renderRmerch();
  if(t==='rrev')return renderRrev();
  if(t==='rsec')return renderRsec();
  if(t==='rinc')return renderRinc();
  if(t==='rjourney')return renderRjourney();
  if(t==='readiness')return renderReadiness();
  if(t==='decisions')return renderDecisions();
  if(t==='brain')return renderBrain();
  if(t==='mhealth')return renderModelTab('◆ Merchant Health','/api/merchant-health');
  if(t==='mrisk')return renderModelTab('◆ Merchant Risk','/api/merchant-risk');
  if(t==='mgrowth')return renderModelTab('◆ Merchant Growth','/api/merchant-growth');
  if(t==='custi')return renderCusti();
  if(t==='revv2')return renderRevv2();
  if(t==='cost')return renderCost();
  if(t==='telem')return renderTelem();
  if(t==='memv2')return renderMemv2();
  if(t==='fixeng')return renderFixeng();
  const d=await api('/api/graph-domain?key='+t);
  if(!d){dash.innerHTML='<p class="hint">No data.</p>';return;}
  const rc=d.risk>66?'var(--critical)':d.risk>33?'var(--warning)':'var(--success)';
  dash.className='dash fade';
  dash.innerHTML=`<div class="row" style="justify-content:space-between"><h2>${TLABEL[t]}</h2><button id="asGraph" class="primary">★ View as graph</button></div>
   <div class="cards">
     ${card(fmt(d.nodes),'nodes')}${card(fmt(d.files),'files')}${card(fmt(d.relationships),'relationships')}${card(d.avgDegree,'avg degree')}
     <div class="card"><div class="n">${d.risk}</div><div class="k">attention score</div><div class="risk"><i style="width:${d.risk}%;background:linear-gradient(90deg,var(--success),${rc})"></i></div></div>
   </div>
   <div class="sectionTitle">Top workspaces</div><div class="badges">${d.workspaces.map(w=>`<span class="badge">${esc(w.key)} <b>${w.count}</b></span>`).join('')}</div>
   <div class="sectionTitle">Top nodes by degree — click to explore</div>
   <table><thead><tr><th>Symbol</th><th>File</th><th style="text-align:right">deg</th></tr></thead><tbody>
   ${d.top.map(n=>`<tr class="clk" data-id="${encodeURIComponent(n.id)}"><td class="lbl"><a>${esc(n.label)}</a></td><td><span class="mono">${esc(n.source_file||'')}${n.source_location?':'+esc(n.source_location):''}</span></td><td style="text-align:right"><span class="deg">${n.degree}</span></td></tr>`).join('')}
   </tbody></table>`;
  dash.querySelectorAll('tr.clk').forEach(tr=>tr.onclick=()=>loadNode(decodeURIComponent(tr.dataset.id)));
  $('#asGraph').onclick=()=>renderAtlas(ATLAS_DOMAINS[t]||'');
}
const card=(n,k)=>`<div class="card"><div class="n">${n}</div><div class="k">${k}</div></div>`;

async function overview(){
  const s=await api('/api/stats');
  dash.className='dash fade';
  dash.innerHTML=`<h2>Overview</h2>
   <div class="cards">${card(fmt(s.nodes),'nodes')}${card(fmt(s.edges),'edges')}${card(fmt(s.communities),'communities')}${card(s.routes,'API routes')}${card(s.pages,'pages')}</div>
   <div class="sectionTitle">Languages</div><div class="badges">${s.languages.map(l=>`<span class="badge">${esc(l.key)} <b>${fmt(l.count)}</b></span>`).join('')}</div>
   <div class="sectionTitle">Workspaces by node count — click to explore the top symbol</div>
   <table><thead><tr><th>Workspace</th><th style="text-align:right">nodes</th></tr></thead><tbody>
   ${s.workspaces.map(w=>`<tr class="clk" data-q="${encodeURIComponent(w.key)}"><td>${esc(w.key)}</td><td style="text-align:right"><span class="deg">${fmt(w.count)}</span></td></tr>`).join('')}
   </tbody></table>
   <p class="hint" style="padding:16px 0">Built ${s.freshness_minutes} min ago${s.built_at_commit?` @ <code>${esc(s.built_at_commit.slice(0,8))}</code>`:''} · refresh with <code>pnpm graph:update</code>.</p>`;
  dash.querySelectorAll('tr.clk').forEach(tr=>tr.onclick=()=>{$('#q').value=decodeURIComponent(tr.dataset.q).split('/').pop();searchPanel();doSearch();});
}

// ---------- Data Layer (database intelligence) ----------
async function renderData(){
  dash.className='dash fade';
  dash.innerHTML='<div class="row" style="color:var(--subdued)"><span class="spin"></span> Loading database intelligence…</div>';
  const d=await api('/api/db');
  if(d.error){dash.innerHTML=`<h2>Data Layer</h2><p class="hint">${esc(d.error)} — run <code>pnpm graph:db</code>.</p>`;return;}
  const s=d.summary;
  dash.innerHTML=`<h2>◆ Data Layer Intelligence</h2>
   <p class="hint" style="padding:6px 0">The Postgres schema Graphify's tree-sitter cannot index — parsed from ${s.migrationFiles} migrations.</p>
   <div class="cards">
     ${card(fmt(s.tables),'tables')}${card(fmt(s.functions),'functions / RPCs')}${card(fmt(s.securityDefiner),'SECURITY DEFINER')}${card(fmt(s.moneyFunctions),'money RPCs')}
     ${card(fmt(s.policies),'RLS policies')}${card(fmt(s.triggers),'triggers')}${card(fmt(s.indexes),'indexes')}${card(fmt(s.rlsTables),'RLS tables')}
     ${card(fmt(s.tenantTables),'tenant tables')}${card(fmt(s.rpcsCalledByGateway),'RPCs via gateway')}
   </div>
   <div class="sectionTitle">Money RPC → table flow — server-authoritative ledger mutations</div>
   <table><thead><tr><th>RPC</th><th>SD</th><th>idem</th><th>lock</th><th>tables</th><th>called by</th></tr></thead><tbody>
   ${d.moneyRpcs.slice(0,18).map(r=>`<tr><td class="lbl">${esc(r.rpc)}</td><td>${r.securityDefiner?'✓':'<span style="color:var(--critical)">✗</span>'}</td><td>${r.idempotency?'✓':'<span style="color:var(--warning)">·</span>'}</td><td>${r.forUpdate?'✓':'·'}</td><td><span class="mono">${esc(r.tables.join(', ')||'—')}</span></td><td><span class="mono" style="color:var(--muted)">${esc(r.calledBy)}</span></td></tr>`).join('')}
   </tbody></table>
   <div class="sectionTitle">Most-governed tables (policies · triggers · indexes)</div>
   <table><thead><tr><th>Table</th><th>RLS</th><th>tenant</th><th style="text-align:right">pol</th><th style="text-align:right">trg</th><th style="text-align:right">idx</th></tr></thead><tbody>
   ${d.topTables.map(t=>`<tr><td class="lbl">${esc(t.name)}${t.money?' <span class="badge brand" style="padding:1px 7px">money</span>':''}</td><td>${t.force?'FORCE':t.rls?'on':'<span style="color:var(--warning)">—</span>'}</td><td>${t.tenant?'✓':'·'}</td><td style="text-align:right"><span class="deg">${t.policies}</span></td><td style="text-align:right"><span class="deg">${t.triggers}</span></td><td style="text-align:right"><span class="deg">${t.indexes}</span></td></tr>`).join('')}
   </tbody></table>
   <div class="sectionTitle">SECURITY DEFINER RPCs not invoked via gateway db.rpc — review candidates (may be trigger/internal)</div>
   <div class="badges">${d.uncalledRpcs.map(r=>`<span class="badge">${esc(r)}</span>`).join('')||'<span class="hint">none</span>'}</div>`;
}

// ---------- Infrastructure ----------
async function renderInfra(){
  dash.className='dash fade';
  dash.innerHTML='<div class="row" style="color:var(--subdued)"><span class="spin"></span> Loading infrastructure…</div>';
  const s=await api('/api/infra');
  if(s.error){dash.innerHTML=`<h2>Infrastructure</h2><p class="hint">${esc(s.error)} — run <code>pnpm graph:infra</code>.</p>`;return;}
  const chips=(a)=>a&&a.length?a.map(x=>`<span class="badge">${esc(x)}</span>`).join(''):'<span class="hint">—</span>';
  dash.innerHTML=`<h2>◇ Infrastructure Intelligence</h2>
   <p class="hint" style="padding:6px 0">Parsed from wrangler.toml + production-deploy.yml + CODEOWNERS.</p>
   <div class="cards">
     ${card(s.workers,'CF Workers')}${card(s.vercelApps.length,'Vercel apps')}${card(s.queueProducers.length+'/'+s.queueConsumers.length,'queue prod/cons')}${card(s.secretsRequired,'prod secrets')}
     ${card(s.r2.length,'R2 buckets')}${card(s.hyperdrive?'✓':'—','Hyperdrive')}${card(s.crons.length,'cron triggers')}${card(s.ownerRules,'CODEOWNERS rules')}
   </div>
   <div class="sectionTitle">Cloudflare queues</div>
   <div style="margin-bottom:6px"><span class="badge brand">producers</span> ${chips(s.queueProducers)}</div>
   <div><span class="badge brand">consumers</span> ${chips(s.queueConsumers)}</div>
   <div class="sectionTitle">Storage & bindings</div>
   <div>R2: ${chips(s.r2)} · KV: ${chips(s.kv)} · D1: ${chips(s.d1)} · Durable Objects: ${chips(s.durableObjects)}</div>
   <div class="sectionTitle">Vercel deploy targets</div><div class="badges">${chips(s.vercelApps)}</div>
   <div class="sectionTitle">External providers</div><div class="badges">${chips(s.providers)}</div>
   <div class="sectionTitle">Deploy gate</div>
   <div class="badges"><span class="badge">migrate gate ${s.hasMigrateGate?'✓':'✗'}</span><span class="badge">applies migrations ${s.appliesMigrations?'✓':'✗'}</span><span class="badge">${s.secretsRequired} secrets required</span></div>`;
}

// ---------- v3 domain intelligence ----------
const bd=(a,cls)=>(a&&a.length?a.map(x=>`<span class="badge${cls?' '+cls:''}">${esc(String(x))}</span>`).join(''):'<span class="hint">—</span>');
async function v3wrap(title,sub){dash.className='dash fade';dash.innerHTML=`<div class="row" style="color:var(--subdued)"><span class="spin"></span> Loading ${esc(title)}…</div>`;}
function v3err(title,e){dash.innerHTML=`<h2>${esc(title)}</h2><p class="hint">${esc(e)} — run <code>pnpm graph:domain</code>.</p>`;return true;}

async function renderDomains(){
  await v3wrap('domains');const o=await api('/api/domain');if(o.error)return v3err('◈ Domains',o.error);
  const s=o.summary;
  dash.innerHTML=`<h2>◈ Domain Intelligence</h2>
   <p class="hint" style="padding:6px 0">${s.domains} business domains discovered by joining db-intel + infra-intel + the route inventory. Cross-domain edges = an RPC in A touches a table in B.</p>
   <div class="cards">${card(s.domains,'domains')}${card(s.crossDomainEdges,'cross-domain edges')}${card(s.classifiedRoutes+'/'+s.totalRoutes,'routes classified')}${card(s.classifiedTables+'/'+s.totalTables,'tables classified')}${card(s.classifiedRpcs+'/'+s.totalRpcs,'rpcs classified')}</div>
   <div class="sectionTitle">Domains — click a row to see its blast radius</div>
   <table><thead><tr><th>Domain</th><th style="text-align:right">routes</th><th style="text-align:right">rpcs</th><th style="text-align:right">tables</th><th>flags</th><th style="text-align:right">→ depends</th><th style="text-align:right">consumed ←</th></tr></thead><tbody>
   ${o.domains.map(d=>`<tr class="clk" data-k="${d.key}"><td class="lbl"><a>${esc(d.label)}</a></td><td style="text-align:right"><span class="deg">${d.routes}</span></td><td style="text-align:right"><span class="deg">${d.rpcs}</span></td><td style="text-align:right"><span class="deg">${d.tables}</span></td><td>${d.money?'<span class="badge brand" style="padding:1px 7px">money</span>':''}${d.tenant?'<span class="badge" style="padding:1px 7px">tenant</span>':''}</td><td style="text-align:right">${d.dependsOn}</td><td style="text-align:right">${d.consumedBy}</td></tr>`).join('')}
   </tbody></table>`;
  dash.querySelectorAll('tr.clk').forEach(tr=>tr.onclick=()=>domainDetail(tr.dataset.k));
}
async function domainDetail(key){
  const d=await api('/api/cross-domain?key='+key);if(d.error)return;
  const full=await api('/api/domain?key='+key);
  dash.innerHTML=`<div class="row" style="justify-content:space-between"><h2>◈ ${esc(d.label)}</h2><button id="back" class="primary">← all domains</button></div>
   <div class="cards">${card(d.blastRadius.domains,'domains break if changed')}${card(full.counts.routes,'routes')}${card(full.counts.rpcs,'rpcs')}${card(full.counts.tables,'tables')}${card(full.counts.policies,'policies')}</div>
   <div class="sectionTitle">Blast radius (transitive consumers) — layers ${JSON.stringify(d.blastRadius.layers)}</div><div class="badges">${bd(d.blastRadius.affected,'brand')}</div>
   <div class="sectionTitle">Directly depends on</div><div class="badges">${bd(full.dependsOn.map(x=>x.domain+' ('+x.strength+')'))}</div>
   <div class="sectionTitle">Routes</div><div class="badges">${bd(full.routes)}</div>
   <div class="sectionTitle">RPCs</div><div class="badges">${bd(full.rpcs.slice(0,40))}</div>
   <div class="sectionTitle">Tables</div><div class="badges">${bd(full.tables)}</div>
   <div class="sectionTitle">Apps · workers · queues · secrets · owners</div>
   <div>apps: ${bd(full.apps)}</div><div style="margin-top:4px">workers: ${bd(full.workers)}</div><div style="margin-top:4px">queues: ${bd(full.queues)}</div><div style="margin-top:4px">secrets: ${bd(full.secrets)}</div><div style="margin-top:4px">owners: ${bd(full.owners)}</div>`;
  $('#back').onclick=()=>renderDomains();
}
async function renderMerchant(){
  await v3wrap('merchant');const o=await api('/api/merchant');if(o.error)return v3err('◈ Merchant',o.error);
  dash.innerHTML=`<h2>◈ Merchant Intelligence</h2>
   <p class="hint" style="padding:6px 0">Merchant → Store → Products → Orders → Payments → Shipping → GST → Gift Cards → Themes, mapped onto the domain graph.</p>
   <div class="cards">${card(o.summary.stages,'lifecycle stages')}${card(o.summary.totalRoutes,'routes')}${card(o.summary.totalRpcs,'rpcs')}${card(o.summary.totalTables,'tables')}${card(o.merchantFacingApps.length,'merchant apps')}</div>
   <div class="sectionTitle">Merchant-facing apps</div><div class="badges">${bd(o.merchantFacingApps,'brand')}</div>
   <div class="sectionTitle">Lifecycle stages</div>
   <table><thead><tr><th>Stage</th><th>Apps</th><th style="text-align:right">routes</th><th style="text-align:right">rpcs</th><th style="text-align:right">tables</th><th>depends on</th></tr></thead><tbody>
   ${o.stages.map(s=>`<tr><td class="lbl">${esc(s.stage)}${s.money?' <span class="badge brand" style="padding:1px 7px">money</span>':''}</td><td><span class="mono">${esc(s.apps.join(', '))}</span></td><td style="text-align:right"><span class="deg">${s.routes}</span></td><td style="text-align:right"><span class="deg">${s.rpcs}</span></td><td style="text-align:right"><span class="deg">${s.tables}</span></td><td><span class="mono" style="color:var(--muted)">${esc(s.dependsOn.join(', ')||'—')}</span></td></tr>`).join('')}
   </tbody></table>`;
}
async function renderJourney(){
  await v3wrap('journey');const o=await api('/api/customer-journey');if(o.error)return v3err('◈ Customer Journey',o.error);
  dash.innerHTML=`<h2>◈ Customer Journey Intelligence</h2>
   <p class="hint" style="padding:6px 0">${o.funnel.join(' → ')}</p>
   <table><thead><tr><th>Stage</th><th>Runtime</th><th>Domains</th><th style="text-align:right">routes</th><th style="text-align:right">tables</th></tr></thead><tbody>
   ${o.stages.map(s=>`<tr><td class="lbl">${esc(s.stage)}${s.money?' <span class="badge brand" style="padding:1px 7px">money</span>':''}</td><td><span class="mono" style="color:var(--muted)">${esc(s.app)}</span></td><td>${bd(s.domains)}</td><td style="text-align:right"><span class="deg">${s.routes.length}</span></td><td style="text-align:right"><span class="deg">${s.tables.length}</span></td></tr>`).join('')}
   </tbody></table>`;
}
async function renderDPay(){
  await v3wrap('payments');const o=await api('/api/payment');if(o.error)return v3err('◈ Payments',o.error);
  const fl=o.flows,wb=o.whatBreaksIfPaymentChanges;
  dash.innerHTML=`<h2>◈ Payment Intelligence</h2>

// ---------- neighborhood (live force sim) ----------
async function loadNode(id){
  const g=await api('/api/neighbors?id='+encodeURIComponent(id)+'&depth=1&limit=70');
  if(!g.nodes||!g.nodes.length)return;
  const root=g.nodes.find(n=>n.id===id)||g.nodes[0];
  searchPanel();
  ibody.insertAdjacentHTML('afterbegin',`<div class="nodecard fade" id="nc"><div class="t">${esc(root.label)}</div><div class="m">${esc(root.source_file||'')}${root.source_location?':'+esc(root.source_location):''}</div><div class="m" style="font-family:var(--font);color:var(--subdued)">degree ${root.degree} · community ${root.community} · ${g.nodes.length} neighbors</div></div>`);
  atlasbar.style.display='none'; showCanvas(); runSim(g,id);
}
function runSim(g,rootId){
  stopSim();clearCanvas();const W=cv.width/DPR,H=cv.height/DPR;
  const nodes=g.nodes.map((n,i)=>({...n,x:W/2+Math.cos(i)*120+(Math.random()*40-20),y:H/2+Math.sin(i)*120+(Math.random()*40-20),vx:0,vy:0,root:n.id===rootId}));
  const idx=new Map(nodes.map((n,i)=>[n.id,i]));
  const links=g.links.filter(l=>idx.has(l.source)&&idx.has(l.target));
  let hover=null,iter=0;
  cv.onmousemove=e=>{const r=cv.getBoundingClientRect(),mx=e.clientX-r.left,my=e.clientY-r.top;hover=nodes.find(n=>Math.hypot(n.x-mx,n.y-my)<14)||null;cv.style.cursor=hover?'pointer':'default';};
  cv.onclick=e=>{const r=cv.getBoundingClientRect(),mx=e.clientX-r.left,my=e.clientY-r.top;const hit=nodes.find(n=>Math.hypot(n.x-mx,n.y-my)<14);if(hit&&!hit.root)loadNode(hit.id);};
  function step(){iter++;
    for(let i=0;i<nodes.length;i++){const a=nodes[i];for(let j=i+1;j<nodes.length;j++){const b=nodes[j];let dx=a.x-b.x,dy=a.y-b.y,d2=dx*dx+dy*dy||.01,f=2600/d2,d=Math.sqrt(d2);dx/=d;dy/=d;a.vx+=dx*f;a.vy+=dy*f;b.vx-=dx*f;b.vy-=dy*f;}}
    for(const l of links){const a=nodes[idx.get(l.source)],b=nodes[idx.get(l.target)];let dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||.01,f=(d-95)*.02;dx/=d;dy/=d;a.vx+=dx*f;a.vy+=dy*f;b.vx-=dx*f;b.vy-=dy*f;}
    for(const n of nodes){n.vx+=(W/2-n.x)*.002;n.vy+=(H/2-n.y)*.002;n.x+=Math.max(-12,Math.min(12,n.vx));n.y+=Math.max(-12,Math.min(12,n.vy));n.vx*=.82;n.vy*=.82;n.x=Math.max(24,Math.min(W-24,n.x));n.y=Math.max(24,Math.min(H-24,n.y));}
    draw();if(iter<420)raf=requestAnimationFrame(step);}
  function draw(){ctx.clearRect(0,0,W,H);
    ctx.strokeStyle='rgba(139,148,158,.22)';ctx.lineWidth=1;for(const l of links){const a=nodes[idx.get(l.source)],b=nodes[idx.get(l.target)];ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();}
    for(const n of nodes){const r=n.root?12:7;
      if(n.root){ctx.beginPath();ctx.arc(n.x,n.y,r+7,0,7);ctx.fillStyle='rgba(139,92,246,.18)';ctx.fill();}
      ctx.beginPath();ctx.arc(n.x,n.y,r,0,7);ctx.fillStyle=n.root?'#8B5CF6':(hover===n?'#a78bfa':'#221d31');ctx.fill();
      ctx.strokeStyle=n.root?'#c4b5fd':'#2f2a40';ctx.lineWidth=1.5;ctx.stroke();
      if(n.root||hover===n||nodes.length<40){ctx.fillStyle='#ECEAF5';ctx.font=(n.root?'600 12px ':'11px ')+'Inter,sans-serif';ctx.fillText(n.label.slice(0,30),n.x+r+4,n.y+4);}}}
  step();
}

// ---------- Atlas (full graph) ----------
let atlasState={domain:'',limit:1500};
async function renderAtlas(domain){
  stopSim();clearCanvas();showCanvas();
  atlasState.domain=domain; if(!atlasState.limit)atlasState.limit=1500;
  ibody.innerHTML=`<div class="row" style="color:var(--subdued);font-size:13px"><span class="spin"></span> Computing layout…</div>`;
  const a=await api('/api/atlas?limit='+atlasState.limit+(domain?'&domain='+domain:''));
  if(!a.nodes||!a.nodes.length){ibody.innerHTML='<p class="hint">No nodes.</p>';return;}
  const W=cv.width/DPR,H=cv.height/DPR;
  let minX=1e9,minY=1e9,maxX=-1e9,maxY=-1e9;for(const n of a.nodes){if(n.x<minX)minX=n.x;if(n.y<minY)minY=n.y;if(n.x>maxX)maxX=n.x;if(n.y>maxY)maxY=n.y;}
  const fit=()=>{const sc=Math.min((W-90)/((maxX-minX)||1),(H-90)/((maxY-minY)||1));scale=sc;tx=(W-(minX+maxX)*sc)/2;ty=(H-(minY+maxY)*sc)/2;draw();};
  let scale=1,tx=0,ty=0;
  const maxD=Math.max(1,...a.nodes.map(n=>n.d));
  const labelSet=new Set([...a.nodes].sort((x,y)=>y.d-x.d).slice(0,26).map(n=>n.id));
  const adj=new Map(); for(const[s,t]of a.links){(adj.get(s)||adj.set(s,[]).get(s)).push(t);(adj.get(t)||adj.set(t,[]).get(t)).push(s);}
  let hover=null,sel=null,drag=null,q='',commHi=null;
  const S=n=>({x:n.x*scale+tx,y:n.y*scale+ty});
  function draw(){
    ctx.clearRect(0,0,W,H);
    ctx.fillStyle='rgba(139,92,246,.02)';ctx.beginPath();ctx.arc(W/2,H/2,Math.max(W,H)*.5,0,7);ctx.fill();
    const selSet=sel?new Set([sel.id,...(adj.get(a.nodes.indexOf(sel))||[])]):null;
    // edges
    for(const[s,t]of a.links){const A=S(a.nodes[s]),B=S(a.nodes[t]);const hot=sel&&(a.nodes[s]===sel||a.nodes[t]===sel);
      ctx.strokeStyle=hot?'rgba(167,139,250,.55)':'rgba(139,148,158,.08)';ctx.lineWidth=hot?1.3:.6;ctx.beginPath();ctx.moveTo(A.x,A.y);ctx.lineTo(B.x,B.y);ctx.stroke();}
    // nodes
    for(let i=0;i<a.nodes.length;i++){const n=a.nodes[i],P=S(n),r=Math.max(1.6,2+(n.d/maxD)*8*Math.min(1,scale*2));
      const match=q&&n.label.toLowerCase().includes(q);const dim=(q&&!match)||(sel&&!(n===sel||(selSet&&selSet.has(i))))||(commHi&&String(n.c)!==commHi);
      if(n.d>maxD*.35){ctx.globalAlpha=dim?.08:.5;ctx.beginPath();ctx.arc(P.x,P.y,r+5,0,7);ctx.fillStyle=n.color;ctx.globalAlpha=dim?.04:.16;ctx.fill();}
      ctx.globalAlpha=dim?.14:1;ctx.beginPath();ctx.arc(P.x,P.y,r,0,7);ctx.fillStyle=match?'#fff':n.color;ctx.fill();
      if(n===sel){ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.stroke();}ctx.globalAlpha=1;}
    // labels for hubs + hovered + selected
    ctx.font='11px Inter,sans-serif';
    for(let i=0;i<a.nodes.length;i++){const n=a.nodes[i];const show=(labelSet.has(n.id)&&scale>0.35)||n===hover||n===sel;if(!show)continue;
      const P=S(n);const txt=n.label.slice(0,34);const w=ctx.measureText(txt).width;
      ctx.fillStyle='rgba(10,9,18,.72)';ctx.fillRect(P.x+8,P.y-8,w+8,16);
      ctx.fillStyle=(n===hover||n===sel)?'#fff':'#cfc9de';ctx.fillText(txt,P.x+12,P.y+4);}
  }
  function pick(mx,my){let b=null,bd=13;for(const n of a.nodes){const P=S(n),d=Math.hypot(P.x-mx,P.y-my);if(d<bd){bd=d;b=n;}}return b;}
  cv.onwheel=e=>{e.preventDefault();const r=cv.getBoundingClientRect(),mx=e.clientX-r.left,my=e.clientY-r.top,f=e.deltaY<0?1.13:.88,wx=(mx-tx)/scale,wy=(my-ty)/scale;scale=Math.max(.08,Math.min(8,scale*f));tx=mx-wx*scale;ty=my-wy*scale;draw();};
  cv.onmousedown=e=>{drag={x:e.clientX,y:e.clientY,tx,ty,moved:false};};
  cv.onmouseup=()=>{drag=null;};cv.onmouseleave=()=>{drag=null;};
  cv.onmousemove=e=>{const r=cv.getBoundingClientRect(),mx=e.clientX-r.left,my=e.clientY-r.top;
    if(drag){tx=drag.tx+(e.clientX-drag.x);ty=drag.ty+(e.clientY-drag.y);drag.moved=true;cv.style.cursor='grabbing';draw();return;}
    const h=pick(mx,my);if(h!==hover){hover=h;cv.style.cursor=h?'pointer':'grab';draw();}};
  cv.onclick=e=>{if(drag&&drag.moved)return;const r=cv.getBoundingClientRect(),h=pick(e.clientX-r.left,e.clientY-r.top);sel=h;draw();if(h)atlasNodeInfo(h,a);else atlasLegend(a,domain);};
  atlasRedraw=()=>{q=($('#q').value||'').toLowerCase();draw();};
  atlasCtl={fit,zoom:f=>{const wx=(W/2-tx)/scale,wy=(H/2-ty)/scale;scale=Math.max(.08,Math.min(8,scale*f));tx=W/2-wx*scale;ty=H/2-wy*scale;draw();},
    highlight:cid=>{commHi=(commHi===String(cid)?null:String(cid));sel=null;draw();return commHi;}};
  // toolbar
  atlasbar.style.display='flex';
  atlasbar.innerHTML=`<div class="seg" id="dens">${[['1k',1000],['1.5k',1500],['2.5k',2500]].map(([l,v])=>`<button data-v="${v}" class="${atlasState.limit===v?'on':''}">${l}</button>`).join('')}</div>
    <button class="iconbtn" id="zin" title="Zoom in">+</button><button class="iconbtn" id="zout" title="Zoom out">−</button><button class="iconbtn" id="zfit" title="Fit">⊡</button>`;
  atlasbar.querySelectorAll('#dens button').forEach(b=>b.onclick=()=>{atlasState.limit=+b.dataset.v;renderAtlas(domain);});
  $('#zin').onclick=()=>atlasCtl.zoom(1.25);$('#zout').onclick=()=>atlasCtl.zoom(.8);$('#zfit').onclick=()=>{sel=null;fit();atlasLegend(a,domain);};
  atlasLegend(a,domain);fit();
}

  return `<div class="xai"><div class="hd">AI-optimized context <button class="copybtn" onclick="xCopy('${id}',this)">Copy</button></div><pre id="${id}">${esc(text)}</pre></div>`;
}
function xCopy(id,btn){const el=document.getElementById(id);navigator.clipboard.writeText(el.textContent).then(()=>{btn.textContent='Copied ✓';setTimeout(()=>btn.textContent='Copy',1400);});}
function xViewInAtlas(key){setMode('technical');const ad={payments:'payments',identity:'identity',authentication:'identity',authorization:'security',operations:'security',themes:'themes',marketplace:'marketplace',developer:'developer',storefront:'apps'}[key]||'';selectTab('atlas');setTimeout(()=>renderAtlas(ad),60);}
function xEcosystem(eco){
  const e=XDATA.ecosystems[eco];
  $('#xmain').innerHTML=`<div class="xhero"><h1>${esc(e.label)}</h1></div>
    <p class="xlede">The end-to-end ${eco} journey. Each stage links to its domain — click to dive in.</p>
    <div class="xsection">Flow</div>
    <div class="xflow">${e.steps.map((s,i)=>`<div class="xstep"><span class="num">${i+1}</span>${esc(s)}</div>${i<e.steps.length-1?'<div class="arrow"></div>':''}`).join('')}</div>
    <div class="xsection">Domains in this journey</div>
    <div>${e.stages.map(k=>{const n=XDATA.nodes[k];return n?`<span class="xpill b" onclick="xSelect('${k}')">${esc(n.label)} · ${esc(n.criticality.split('—')[0].trim())}</span>`:'';}).join('')}</div>`;
}

  const chips=a=>a&&a.length?a.map(x=>`<span class="xpill">${esc(x)}</span>`).join(''):'<span class="xpill">—</span>';
  $('#xmain').innerHTML=`<div class="xhero"><h1>Infrastructure</h1></div>
    <p class="xlede">Cloudflare Workers + Queues + R2 + Hyperdrive → Supabase Postgres, fronted by Vercel apps. Single deploy pipeline with a migrate gate and rollback.</p>
    <div class="xgrid">
      <div class="xcard"><div class="h">Workers</div><div class="b">${chips(f.workers)}</div></div>
      <div class="xcard"><div class="h">Queues (producers)</div><div class="b">${chips(f.queues)}</div></div>
      <div class="xcard warn"><div class="h">Dead-letter queues</div><div class="b">${chips(f.deadLetters)}</div></div>
      <div class="xcard"><div class="h">Storage</div><div class="b">R2: ${chips(f.storage.r2)} · Hyperdrive: ${f.storage.hyperdrive?'✓':'—'}</div></div>
      <div class="xcard"><div class="h">Vercel apps</div><div class="b">${chips(f.vercelApps)}</div></div>
      <div class="xcard"><div class="h">Secrets · crons</div><div class="b">${f.secrets} production secrets · ${chips(f.crons)}</div></div>
    </div>
    <p class="xlede" style="font-size:13px">Live runtime metrics (latency/errors/queue-depth) are emitted to the Cloudflare Analytics Engine (RUNTIME_TELEMETRY) and are queried live — not stored in the repo.</p>
    <div class="xatlas"><button class="primary" onclick="setMode('technical');selectTab('robs')">◐ Runtime Observability</button></div>`;

function xReadiness(){
  const r=XDATA.readiness; if(!r){$('#xmain').innerHTML='<div class="empty">Readiness data unavailable.</div>';return;}
  const oc=r.overall>85?'var(--success)':r.overall>60?'var(--warning)':'var(--critical)';
  const bar=n=>`<div class="risk" style="width:120px;display:inline-block;vertical-align:middle"><i style="width:${n}%;background:${n>85?'var(--success)':n>60?'var(--warning)':'var(--critical)'}"></i></div>`;
  $('#xmain').innerHTML=`<div class="xhero"><h1>Readiness Center</h1><span class="crit ${r.verdict==='NO-GO'?'t1':'t3'}">${esc(r.verdict)}</span></div>
    <p class="xlede">Executive view. <b style="color:${oc}">${r.overall}% structural</b> readiness across ${r.dimensions.length} dimensions (repository evidence, not a live SLA). NO-GO + high structural = the foundation is intact; the open blockers are launch-scope features.</p>
    <div class="xsection">Per-dimension</div>
    <table><thead><tr><th>Dimension</th><th style="text-align:right">score</th><th></th><th>evidence</th></tr></thead><tbody>
    ${r.dimensions.map(d=>`<tr><td class="lbl">${esc(d.dimension)}</td><td style="text-align:right"><b>${d.score}%</b></td><td>${bar(d.score)}</td><td><span class="mono" style="color:var(--muted)">${esc(d.evidence)}</span></td></tr>`).join('')}
    </tbody></table>
    <div class="xsection">Open blockers</div>
    ${r.openBlockers.length?`<table><thead><tr><th>ID</th><th>Severity</th><th>Title</th></tr></thead><tbody>${r.openBlockers.map(b=>`<tr><td class="lbl">${esc(b.id)}</td><td>${esc(b.severity)}</td><td>${esc(b.title)}</td></tr>`).join('')}</tbody></table>`:'<div class="empty">No open blockers.</div>'}
    <div class="xsection">Recommended next actions</div>
    <div class="xflow">${r.nextActions.map((a,i)=>`<div class="xstep"><span class="num">${i+1}</span>${esc(a.id)} — ${esc(a.title)} <span style="color:var(--muted);margin-left:6px">${esc(a.severity)}</span></div>`).join('')||'<div class="empty">—</div>'}</div>`;
}

/* ---- environment switcher (honest live-binding; NO mock values) ---- */
let ENV='local', ENVDATA=null;
const notconn=label=>`<div class="notconn"><span class="d"></span>${esc(label||'Live Data Source Not Connected')}</div>`;
async function bootEnv(){
  ENVDATA=await api('/api/environment'); if(!ENVDATA||ENVDATA.error)return;
  $('#envdot').style.background=ENVDATA.summary.anyLiveConnected?'var(--success)':'var(--warning)';
  $('#envsel').onchange=()=>{ENV=$('#envsel').value; if(XSEL)xSelect(XSEL);};
}
function envBanner(){
  if(!ENVDATA)return '';
  const e=ENVDATA.environments.find(x=>x.key===ENV); if(!e)return '';
  return `<div class="xcard" style="margin:0 0 14px"><div class="h">Environment · ${esc(e.label)}</div><div class="b">Repository intelligence: <b style="color:var(--success)">${esc(e.repositoryIntelligence.split('(')[0].trim())}</b>. Live data: ${e.liveData==='connected'?'<b style="color:var(--success)">connected</b>':notconn(e.liveData)}</div></div>`;
}
function xDatabase(){
  $('#xmain').innerHTML='<div class="empty"><span class="spin"></span> Loading database control…</div>';
  Promise.all([api('/api/database-control'),api('/api/relationships')]).then(([d,r])=>{
    if(d.error){$('#xmain').innerHTML=`<div class="empty">${esc(d.error)} — run <code>pnpm graph:db</code>.</div>`;return;}
    const s=d.summary;
    $('#xmain').innerHTML=`<div class="xhero"><h1>Database Mission Control</h1></div>
     <p class="xlede">The Supabase Postgres schema — the source of truth. Schema, relationships (foreign keys), policies and functions explorers.</p>
     ${envBanner()}
     <div class="xgrid">
       <div class="xcard"><div class="h">Tables</div><div class="b" style="font-size:22px;font-weight:700">${s.tables}</div></div>
       <div class="xcard"><div class="h">Functions / RPCs</div><div class="b" style="font-size:22px;font-weight:700">${s.functions} <span style="font-size:12px;color:var(--subdued)">(${s.securityDefiner} SD)</span></div></div>
       <div class="xcard"><div class="h">RLS policies</div><div class="b" style="font-size:22px;font-weight:700">${s.policies}</div></div>
       <div class="xcard"><div class="h">Foreign keys</div><div class="b" style="font-size:22px;font-weight:700">${r&&!r.error?r.summary.foreignKeys:'—'}</div></div>
       <div class="xcard"><div class="h">Triggers · indexes</div><div class="b" style="font-size:22px;font-weight:700">${s.triggers} · ${s.indexes}</div></div>
     </div>
     <div class="xsection">Relationship explorer — most-referenced tables (the tenant root + hubs)</div>
     ${r&&!r.error?`<table><thead><tr><th>Table</th><th style="text-align:right">referenced by (fan-in)</th></tr></thead><tbody>
       ${r.summary.mostReferenced.map(t=>`<tr><td class="lbl">${esc(t.table)}</td><td style="text-align:right"><span class="deg">${t.fanIn}</span></td></tr>`).join('')}</tbody></table>
       <p class="xlede" style="font-size:13px">Tenant root: <b>${esc(r.summary.tenantRoot.table)}</b> — referenced by ${r.summary.tenantRoot.fanIn} tables (every tenant row chains to site_id).</p>`:notconn('Relationship graph unavailable — run pnpm graph:relationships')}
     <div class="xsection">Schema explorer — most-governed tables</div>
     <table><thead><tr><th>Table</th><th>RLS</th><th>tenant</th><th style="text-align:right">pol</th><th style="text-align:right">trg</th><th style="text-align:right">idx</th></tr></thead><tbody>
     ${d.topTables.map(t=>`<tr><td class="lbl">${esc(t.name)}${t.money?' <span class="badge brand" style="padding:1px 7px">money</span>':''}</td><td>${t.force?'FORCE':t.rls?'on':'—'}</td><td>${t.tenant?'✓':'·'}</td><td style="text-align:right"><span class="deg">${t.policies}</span></td><td style="text-align:right"><span class="deg">${t.triggers}</span></td><td style="text-align:right"><span class="deg">${t.indexes}</span></td></tr>`).join('')}
     </tbody></table>
     <div class="xsection">Function explorer — SECURITY DEFINER RPCs</div>
     <table><thead><tr><th>Function</th><th>money</th><th>idem</th><th>lock</th><th style="text-align:right">tables</th></tr></thead><tbody>
     ${d.functions.map(f=>`<tr><td class="lbl">${esc(f.name)}</td><td>${f.money?'💰':'·'}</td><td>${f.idempotency?'✓':'·'}</td><td>${f.forUpdate?'✓':'·'}</td><td style="text-align:right"><span class="deg">${f.tables}</span></td></tr>`).join('')}
     </tbody></table>
     <div class="xatlas"><button class="primary" onclick="setMode('technical');selectTab('data')">◆ Open Data Layer (technical)</button></div>`;
  });
}

/* ---- command palette + copilot ---- */
const cmdkbg=document.createElement('div');cmdkbg.className='cmdk-bg';cmdkbg.id='cmdkbg';
cmdkbg.innerHTML=`<div class="cmdk"><input id="cmdkin" type="text" placeholder="Search domains, routes, RPCs, tables, owners… or ask a question" autocomplete="off"/><div class="res" id="cmdkres"></div><div class="ask" id="cmdkask"></div></div>`;
document.body.appendChild(cmdkbg);
function openCmdk(){cmdkbg.classList.add('on');const i=$('#cmdkin');i.value='';$('#cmdkres').innerHTML='';$('#cmdkask').textContent='Type to search, or ask "what breaks if checkout changes?"';i.focus();}
function closeCmdk(){cmdkbg.classList.remove('on');}
cmdkbg.onclick=e=>{if(e.target===cmdkbg)closeCmdk();};
$('#cmdkBtn').onclick=openCmdk;
window.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openCmdk();}if(e.key==='Escape')closeCmdk();});
async function cmdkSearch(q){
  const res=$('#cmdkres'),ask=$('#cmdkask');if(!q){res.innerHTML='';ask.textContent='Type to search, or ask a question';return;}
  let h='';
  // domains (explain)
  const dom=XDATA?Object.keys(XDATA.nodes).filter(k=>XDATA.nodes[k].label.toLowerCase().includes(q.toLowerCase())||k.includes(q.toLowerCase())):[];
  if(dom.length){h+='<div class="cat">Domains</div>'+dom.slice(0,6).map(k=>`<div class="item" data-x="dom:${k}"><span class="ic">◷</span>${esc(XDATA.nodes[k].label)}<span class="meta">${esc(XDATA.nodes[k].criticality.split('—')[0].trim())}</span></div>`).join('');}
  // pages
  const pages=[['getting-started','Getting Started'],['readiness','Readiness Center'],['infrastructure','Infrastructure'],['ai-context','AI Context']].filter(([k,l])=>l.toLowerCase().includes(q.toLowerCase()));
  if(pages.length){h+='<div class="cat">Pages</div>'+pages.map(([k,l])=>`<div class="item" data-x="page:${k}"><span class="ic">◎</span>${esc(l)}</div>`).join('');}
  // code symbols
  try{const rs=await api('/api/search?q='+encodeURIComponent(q)+'&limit=6');if(rs.length){h+='<div class="cat">Code & data</div>'+rs.map(n=>`<div class="item" data-x="node:${encodeURIComponent(n.id)}"><span class="ic">▦</span>${esc(n.label)}<span class="meta">${esc((n.source_file||'').split('/').pop())}</span></div>`).join('');}}catch{}
  res.innerHTML=h||'<div class="cat">No matches</div>';
  res.querySelectorAll('.item').forEach(el=>el.onclick=()=>cmdkRun(el.dataset.x));
  ask.innerHTML=`Ask LCIS → <span style="color:var(--brand-2);cursor:pointer" id="askgo">"${esc(q)}"</span>`;
  const ag=$('#askgo');if(ag)ag.onclick=()=>runCopilot(q);
}
function cmdkRun(x){
  const [t,...rest]=x.split(':');const v=rest.join(':');
  closeCmdk();
  if(t==='dom'){setMode('explain');xSelect(v);}
  else if(t==='page'){setMode('explain');xSelect(v);}
  else if(t==='node'){setMode('technical');loadNode(decodeURIComponent(v));}
}
async function runCopilot(q){
  closeCmdk();
  const r=await api('/api/copilot?q='+encodeURIComponent(q));
  if(r&&r.domain&&isDomain(r.domain)){setMode('explain');xSelect(r.domain);
    const b=document.createElement('div');b.className='xcard';b.style.cssText='margin:14px 0;border-color:var(--brand)';b.innerHTML=`<div class="h">Copilot · ${esc(r.intent)}</div><div class="b">Routed to <code>${esc(r.engine)}</code>${r.flow?' · flow: '+esc(r.flow.join(' → ')):''}</div>`;
    const m=$('#xmain');m.insertBefore(b,m.children[1]);}
  else if(r&&r.intent==='security'){setMode('technical');selectTab('rsec');}
  else if(r){setMode('technical');$('#q').value=q;searchPanel();doSearch();}
}
$('#cmdkin')&&($('#cmdkin').oninput=()=>{clearTimeout(window._ck);window._ck=setTimeout(()=>cmdkSearch($('#cmdkin').value.trim()),160);});
$('#cmdkin')&&($('#cmdkin').onkeydown=e=>{if(e.key==='Enter'){const first=$('#cmdkres .item');if(first)first.click();else runCopilot($('#cmdkin').value.trim());}});

boot();
setMode('explain');
bootExplain();
bootEnv();
</script>
