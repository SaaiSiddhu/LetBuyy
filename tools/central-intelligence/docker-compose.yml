version: "3.9"

# LCIS V2 — Local infrastructure for Autonomous Commerce Intelligence
# Technology primitives hidden as LCIS subsystems per architecture contract.
# Start minimal:  docker compose up -d qdrant
# Start full:     docker compose up -d

services:

  # ---------------------------------------------------------------------------
  # Vector store — backs the LCIS Memory Engine
  # ---------------------------------------------------------------------------
  qdrant:
    image: qdrant/qdrant:latest
    container_name: lcis-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"   # REST API + dashboard
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_storage:/qdrant/storage
    environment:
      QDRANT__SERVICE__API_KEY: "${QDRANT_API_KEY:-}"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:6333/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - letbuyy-intelligence

  # ---------------------------------------------------------------------------
  # ClickHouse — trace/log/metrics storage for the Observability subsystem
  # ---------------------------------------------------------------------------
  signoz-clickhouse:
    image: clickhouse/clickhouse-server:24.1.2-alpine
    container_name: lcis-clickhouse
    restart: unless-stopped
    ports:
      - "9000:9000"   # native protocol
      - "8123:8123"   # HTTP interface
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    environment:
      CLICKHOUSE_DB: signoz_traces
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ""
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - letbuyy-intelligence

  # ---------------------------------------------------------------------------
  # OTel Collector — receives OTLP from services, forwards to ClickHouse
  # ---------------------------------------------------------------------------
  signoz-otel-collector:
    image: signoz/signoz-otel-collector:0.88.11
    container_name: lcis-otel-collector
    restart: unless-stopped
    command: "--config=/etc/otel/config.yaml"
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
    volumes:
      - ./observability/otel-collector-signoz.yml:/etc/otel/config.yaml:ro
    depends_on:
      signoz-clickhouse:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:13133/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - letbuyy-intelligence

  # ---------------------------------------------------------------------------
  # SigNoz query service — serves the SigNoz frontend and /api
  # ---------------------------------------------------------------------------
  signoz-query-service:
    image: signoz/query-service:0.43.0
    container_name: lcis-signoz-query
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      ClickHouseUrl: "tcp://signoz-clickhouse:9000"
      STORAGE: clickhouse
      GODEBUG: netdns=go
      TELEMETRY_ENABLED: "false"
    depends_on:
      signoz-clickhouse:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 45s
    networks:
      - letbuyy-intelligence

  # ---------------------------------------------------------------------------
  # SigNoz frontend — Observability UI at http://localhost:3301
  # ---------------------------------------------------------------------------
  signoz-frontend:
    image: signoz/frontend:0.43.0
    container_name: lcis-signoz-frontend
    restart: unless-stopped
    ports:
      - "3301:3301"
    depends_on:
      signoz-query-service:
        condition: service_healthy
    networks:
      - letbuyy-intelligence

volumes:
  qdrant_storage:
    driver: local
  clickhouse_data:
    driver: local

networks:
  letbuyy-intelligence:
    driver: bridge
