### GraphRAG Settings — LCIS Graph Intelligence Engine
### This file is consumed by `python3 -m graphrag index/query --root <this-dir>`
### Entity extraction uses gpt-4o-mini to keep costs low during development.
### Embeddings use text-embedding-3-small with LanceDB for local vector storage.

input:
  type: file
  file_type: text
  base_dir: input

storage:
  type: file
  base_dir: output

cache:
  type: file
  base_dir: cache

reporting:
  type: file
  base_dir: logs

entity_extraction:
  llm:
    api_key: ${OPENAI_API_KEY}
    type: openai_chat
    model: gpt-4o-mini
    max_tokens: 4000
    temperature: 0
  max_gleanings: 1
  entity_types:
    - MERCHANT
    - STORE
    - THEME
    - APP
    - ORDER
    - PAYMENT
    - CUSTOMER
    - INCIDENT
    - DEPLOYMENT
    - SERVICE
    - QUEUE
    - WORKER
    - DOMAIN_AREA
    - DOCUMENT
    - MIGRATION

claim_extraction:
  enabled: false

community_reports:
  llm:
    api_key: ${OPENAI_API_KEY}
    type: openai_chat
    model: gpt-4o-mini
    max_tokens: 2000
    temperature: 0
  max_input_length: 8000

summarize_descriptions:
  llm:
    api_key: ${OPENAI_API_KEY}
    type: openai_chat
    model: gpt-4o-mini
    max_tokens: 500
    temperature: 0

embeddings:
  llm:
    api_key: ${OPENAI_API_KEY}
    type: openai_embedding
    model: text-embedding-3-small
  vector_store:
    type: lancedb
    db_uri: output/lancedb
    container_name: default
    overwrite: true

chunks:
  size: 1200
  overlap: 100
  group_by_columns:
    - id
