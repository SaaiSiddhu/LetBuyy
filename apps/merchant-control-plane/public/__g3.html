<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Activation vs reference</title>
<link rel="stylesheet" href="/_next/static/css/app/layout.css">
<style>
 body{margin:0;font-family:system-ui;background:var(--lb-color-bg);padding:20px}
 .wrap{max-width:1060px;margin:0 auto;display:grid;gap:16px}
 .two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
 .hd{padding:18px 18px 10px}
 .hd h3{margin:0 0 5px;font-size:var(--lb-font-size-card-title);font-weight:600;color:var(--lb-color-text)}
 .hd p{margin:0;font-size:var(--lb-font-size-secondary);color:var(--lb-color-text-subdued)}
 .ft{padding:18px}
 .btn{background:var(--lb-color-primary);color:var(--lb-color-text-inverse);border:0;border-radius:10px;padding:9px 15px;font-weight:600;font-size:14px}
 .art{margin:0 18px}
 img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
</style></head>
<body><div data-letbuyy-theme="auto" class="wrap">
<div class="two">
  <article class="activation-card activation-card--next">
    <div class="hd"><h3>Add product</h3><p>Create the first sellable item so shoppers can browse and buy.</p></div>
    <div class="activation-art activation-art--featured art">
      <div class="activation-art__side activation-art__side--left"><img src="/activation/add-product-left.png"></div>
      <div class="activation-art__centre"><div class="activation-centre-drop">+</div></div>
      <div class="activation-art__side activation-art__side--right"><img src="/activation/add-product-right.png"></div>
    </div>
    <div class="ft"><button class="btn">Add product</button></div>
  </article>
  <article class="activation-card">
    <div class="hd"><h3>Customize theme</h3><p>Choose a theme and tune storefront branding.</p></div>
    <div class="activation-art art">
      <div class="activation-art__side activation-art__side--left"><img src="/activation/add-product-left.png"></div>
      <div class="activation-art__centre"><div class="activation-centre-type">Aa</div></div>
      <div class="activation-art__side activation-art__side--right"><img src="/activation/add-product-right.png"></div>
    </div>
    <div class="ft"><button class="btn">Review</button></div>
  </article>
</div>
</div></body></html>
