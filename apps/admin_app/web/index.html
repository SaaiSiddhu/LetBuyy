<!DOCTYPE html>
<html>

<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="LetBuyy Admin">
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=overlays-content">
  <link rel="icon" type="image/png" href="icons/Icon-192.png" />
  <meta name="theme-color" content="#F8FAFC">
  <title>LetBuyy Admin</title>
  <link rel="manifest" href="manifest.json">

  <script async defer
    src="https://maps.googleapis.com/maps/api/js?key=AIzaSyAB-NXBRjrubWRDrp2HNgbgeG7fNzxSQlY&libraries=places,geometry&loading=async"></script>

  <!-- Viewport lock + LayoutBuilder approach -->
  <script>
    (function () {
      if ("virtualKeyboard" in navigator) {
        navigator.virtualKeyboard.overlaysContent = true;
      }
      var isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
      if (!isMobile) return;

      var LOCKED_HEIGHT = window.innerHeight;
      var LOCKED_WIDTH = window.innerWidth;

      if (window.visualViewport) {
        var originalVV = window.visualViewport;
        var fakeVV = {
          get width() { return LOCKED_WIDTH; },
          get height() { return LOCKED_HEIGHT; },
          get offsetLeft() { return 0; },
          get offsetTop() { return 0; },
          get pageLeft() { return originalVV.pageLeft; },
          get pageTop() { return originalVV.pageTop; },
          get scale() { return 1; },
          addEventListener: function (type, listener, options) {
            if (type !== 'resize') originalVV.addEventListener(type, listener, options);
          },
          removeEventListener: function (type, listener, options) {
            originalVV.removeEventListener(type, listener, options);
          },
          dispatchEvent: function (event) { return originalVV.dispatchEvent(event); }
        };
        try {
          Object.defineProperty(window, 'visualViewport', { value: fakeVV, writable: false, configurable: false });
        } catch (e) { }
      }

      try {
        Object.defineProperty(window, 'innerHeight', { get: function () { return LOCKED_HEIGHT; }, configurable: true });
      } catch (e) { }

      window.addEventListener('orientationchange', function () {
        setTimeout(function () {
          if (window.orientation !== undefined) {
            if (Math.abs(window.orientation) === 90) {
              LOCKED_WIDTH = Math.max(screen.width, screen.height);
              LOCKED_HEIGHT = Math.min(screen.width, screen.height);
            } else {
              LOCKED_WIDTH = Math.min(screen.width, screen.height);
              LOCKED_HEIGHT = Math.max(screen.width, screen.height);
            }
          }
        }, 100);
      });
    })();
  </script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #F8FAFC;
    }

    #splash {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(180deg, #F0F7F8 0%, #F8FAFC 50%, #F5F9FA 100%);
      z-index: 9999;
      transition: opacity 0.3s;
    }

    #splash.fade-out {
      opacity: 0;
      pointer-events: none;
    }

    #splash-logo {
      width: 80px;
      height: 80px;
      border-radius: 20px;
      background: #14B8A6;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: pulse 1.5s infinite;
      box-shadow: 0 8px 32px rgba(20, 184, 166, 0.2);
    }

    #splash-logo img {
      width: 60px;
      height: 60px;
      border-radius: 12px;
    }

    #splash-text {
      margin-top: 20px;
      color: #0F766E;
      font-size: 18px;
      font-weight: 600;
    }

    #splash-loader {
      margin-top: 24px;
      width: 40px;
      height: 4px;
      background: rgba(20, 184, 166, 0.2);
      border-radius: 2px;
      overflow: hidden;
    }

    #splash-loader::after {
      content: '';
      display: block;
      width: 40%;
      height: 100%;
      background: #14B8A6;
      border-radius: 2px;
      animation: loading 1s infinite;
    }

    @keyframes pulse {

      0%,
      100% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.05);
      }
    }

    @keyframes loading {
      0% {
        transform: translateX(-100%);
      }

      100% {
        transform: translateX(350%);
      }
    }
  </style>
</head>

<body>
  <div id="splash">
    <div id="splash-logo"><img src="icons/Icon-192.png" alt="Admin" onerror="this.style.display='none'"></div>
    <div id="splash-text">LetBuyy Admin</div>
    <div id="splash-loader"></div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var splash = document.getElementById('splash');
      if (splash) { splash.classList.add('fade-out'); setTimeout(function () { splash.remove(); }, 300); }
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>

</html>
