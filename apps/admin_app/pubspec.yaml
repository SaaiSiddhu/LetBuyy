name: letbuyy_admin
description: LetBuyy Admin - Admin panel and management app
version: 1.0.0+1
publish_to: none
resolution: workspace

environment:
  sdk: '^3.10.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  
  # Internal packages
  letbuyy_marketplace_core:
    path: ../../packages/dart/marketplace_core
  letbuyy_marketplace_models:
    path: ../../packages/dart/marketplace_models
  letbuyy_marketplace_services:
    path: ../../packages/dart/marketplace_services
  letbuyy_marketplace_ui_kit:
    path: ../../packages/dart/marketplace_ui_kit

  # State Management
  provider: ^6.1.2
  flutter_hooks: ^0.20.5
  
  # Routing
  go_router: ^14.6.2

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  cloud_functions: ^5.1.3
  firebase_storage: ^12.3.4
  firebase_messaging: ^15.1.3
  firebase_analytics: ^11.3.3
  
  # UI
  cupertino_icons: ^1.0.8
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  fl_chart: ^0.69.2
  lottie: ^3.2.0
  flutter_animate: ^4.5.0
  google_fonts: ^6.2.1
  font_awesome_flutter: ^10.7.0
  fluttertoast: ^8.2.8
  data_table_2: ^2.5.15
  
  # Authentication
  google_sign_in: ^6.2.1
  crypto: ^3.0.5
  
  # Image
  image_picker: ^1.1.2
  image_cropper: ^8.0.2
  
  # Video (Reels)
  video_player: ^2.9.2
  
  # PDF & Printing
  pdf: ^3.11.1
  printing: ^5.13.3
  
  # File picker (for APK upload)
  file_picker: ^8.0.3
  
  # Utilities
  intl: ^0.20.2
  url_launcher: ^6.3.1
  permission_handler: ^12.0.1
  shared_preferences: ^2.5.3
  connectivity_plus: ^6.1.1
  package_info_plus: ^8.1.2
  path_provider: ^2.1.4
  http: ^1.2.2
  gal: ^2.3.0  # Gallery saver for images
  
  # Notifications
  flutter_local_notifications: ^18.0.1
  
  # QR Code
  qr_flutter: ^4.1.0

  uuid: any
  timeline_tile: any
  photo_view: any
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
    - assets/lottie/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/admin_icon.png"
  adaptive_icon_background: "#1E1E2E"
  adaptive_icon_foreground: "assets/icons/admin_icon.png"
