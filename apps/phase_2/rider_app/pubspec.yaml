name: rider_app
description: LetBuyy quick-commerce rider logistics app.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  agrimore_api:
    path: ../../packages/agrimore_api
  agrimore_design_system:
    path: ../../packages/agrimore_design_system
  agrimore_domain:
    path: ../../packages/agrimore_domain
  agrimore_observability:
    path: ../../packages/agrimore_observability
  agrimore_offline:
    path: ../../packages/agrimore_offline
  agrimore_realtime:
    path: ../../packages/agrimore_realtime
  dio: ^5.9.2
  drift: ^2.24.0
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  flutter_secure_storage: ^10.0.0
  go_router: ^14.8.1
  riverpod_annotation: ^2.6.1
  path: ^1.9.1
  path_provider: ^2.1.5
  sentry_flutter: ^9.20.0
  sqlite3_flutter_libs: ^0.5.39
  supabase_flutter: ^2.10.3
  uuid: ^4.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/
