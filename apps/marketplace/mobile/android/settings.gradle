// ========================================
// SETTINGS CONFIGURATION
// LetBuyy - E-commerce Marketplace Platform
// ========================================

pluginManagement {
    // Read Flutter SDK path from local.properties
    def flutterSdkPath = {
        def properties = new java.util.Properties()
        file("local.properties").withInputStream { properties.load(it) }
        def flutterSdkPath = properties.getProperty("flutter.sdk")
        assert flutterSdkPath != null, "flutter.sdk not set in local.properties"
        return flutterSdkPath
    }()

    // Include Flutter Gradle plugin
    includeBuild("${flutterSdkPath}/packages/flutter_tools/gradle")

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

// ========================================
// PLUGINS CONFIGURATION
// ========================================

plugins {
    // Flutter plugin loader
    id "dev.flutter.flutter-plugin-loader" version "1.0.0"
    
    // Android Gradle Plugin
    id "com.android.application" version "8.11.1" apply false

    // Google Services (Firebase) -- removed, Phase 1R final pass: this app requires no Firebase
    // package any more (see app/build.gradle's own dependencies-block comment).

    // Kotlin Android Plugin
    id "org.jetbrains.kotlin.android" version "2.2.20" apply false
}

// ========================================
// PROJECT CONFIGURATION
// ========================================

// Include app module
include ":app"

// Set root project name
rootProject.name = "marketplace"
