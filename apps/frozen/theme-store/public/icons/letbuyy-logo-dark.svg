<svg width="680" height="220" viewBox="0 0 680 220" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">LetBuyy landscape logo for dark headers</title>
  <desc id="desc">Regenerated LetBuyy commerce icon beside a white LetBuyy wordmark.</desc>
  <defs>
    <linearGradient id="wordDark" x1="224" y1="63" x2="520" y2="150" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="0.36" stop-color="#E7EDFF"/>
      <stop offset="0.74" stop-color="#8EA2FF"/>
      <stop offset="1" stop-color="#4462FF"/>
    </linearGradient>
    <filter id="wordGlow" x="196" y="45" width="420" height="120" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#355CFF" flood-opacity="0.34"/>
    </filter>
  </defs>
  <image href="data:image/svg+xml;base64," x="18" y="10" width="194" height="194" preserveAspectRatio="xMidYMid meet"/>
  <g filter="url(#wordGlow)">
    <text x="214" y="137" fill="url(#wordDark)" font-family="Avenir Next, Inter, Segoe UI, Arial, sans-serif" font-size="86" font-weight="900" font-style="italic" letter-spacing="-1">LetBuyy</text>
  </g>
</svg>
