name: letbuyy_store
description: LetBuyy Store Builder - Create and customize your online store
version: 1.0.0+1
publish_to: none
resolution: workspace

environment:
  sdk: '^3.10.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  
  # Internal packages
  letbuyy_core:
    path: ../../../packages/dart/core
  letbuyy_api_client:
    path: ../../../packages/dart/api_client
  letbuyy_models:
    path: ../../../packages/dart/models
  letbuyy_ui_kit:
    path: ../../../packages/dart/ui_kit

  # State Management
  provider: ^6.1.2
  
  # UI
  cupertino_icons: ^1.0.8
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  lottie: ^3.2.0
  flutter_animate: ^4.5.0
  fl_chart: ^0.69.0
  google_fonts: ^6.2.1
  font_awesome_flutter: ^10.7.0
  fluttertoast: ^8.2.8
  flex_color_picker: ^3.5.1
  
  # Image handling
  image_picker: ^1.1.2
  mobile_scanner: ^7.1.3
  image_cropper: ^8.0.2
  flutter_image_compress: ^2.3.0
  
  # Utilities
  go_router: ^17.0.0
  uuid: ^4.3.3
  intl: ^0.20.2
  url_launcher: ^6.3.1
  path_provider: ^2.1.5
  share_plus: ^12.0.1
  http: ^1.2.2
  video_player: ^2.9.2
  webview_flutter: ^4.8.0
  
  # Local Storage
  shared_preferences: ^2.3.4
  flutter_secure_storage: ^9.2.4
  hive: ^2.2.3
  hive_flutter: ^1.1.0


  qr_flutter: ^4.1.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icons/app_icon.png"
  min_sdk_android: 21 # android min sdk min:16, default 21
  adaptive_icon_background: "#0F172A" # Dark blue background matching splash
  adaptive_icon_foreground: "assets/icons/app_icon.png"


flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/images/templates/
    - assets/animations/
    - assets/icons/
