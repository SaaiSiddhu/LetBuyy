  <!-- 🔥 MOBILE KEYBOARD FIX: Override browser viewport API -->
  <script>
    (function () {
      // Enable virtual keyboard overlay
      if ("virtualKeyboard" in navigator) {
        navigator.virtualKeyboard.overlaysContent = true;
      }

      // Capture initial dimensions
      var LOCKED_HEIGHT = window.innerHeight;
      var LOCKED_WIDTH = window.innerWidth;

      console.log('🔥 Marketplace: Locking viewport to:', LOCKED_WIDTH, 'x', LOCKED_HEIGHT);

      // Override visualViewport API
      if (window.visualViewport) {
        var originalVV = window.visualViewport;
        var fakeVV = {
          get width() { return LOCKED_WIDTH; },
          get height() { return LOCKED_HEIGHT; },
          get offsetLeft() { return 0; },
          get offsetTop() { return 0; },
          get pageLeft() { return originalVV.pageLeft; },
          get pageTop() { return originalVV.pageTop; },
          get scale() { return 1; },
          addEventListener: function (type, listener, options) {
            if (type === 'resize') {
              console.log('🔥 Blocked visualViewport resize listener');
              return;
            }
            originalVV.addEventListener(type, listener, options);
          },
          removeEventListener: function (type, listener, options) {
            originalVV.removeEventListener(type, listener, options);
          },
          dispatchEvent: function (event) {
            return originalVV.dispatchEvent(event);
          }
        };

        try {
          Object.defineProperty(window, 'visualViewport', {
            value: fakeVV,
            writable: false,
            configurable: false
          });
          console.log('🔥 Successfully overrode visualViewport');
        } catch (e) {
          console.log('🔥 Could not override visualViewport:', e);
        }
      }

      // Also override innerHeight getter
      try {
        Object.defineProperty(window, 'innerHeight', {
          get: function () { return LOCKED_HEIGHT; },
          configurable: true
        });
        console.log('🔥 Successfully overrode innerHeight');
      } catch (e) {
        console.log('🔥 Could not override innerHeight:', e);
      }

      // Handle orientation changes
      window.addEventListener('orientationchange', function () {
        setTimeout(function () {
          if (window.orientation !== undefined) {
            if (Math.abs(window.orientation) === 90) {
              LOCKED_WIDTH = Math.max(screen.width, screen.height);
              LOCKED_HEIGHT = Math.min(screen.width, screen.height);
            } else {
              LOCKED_WIDTH = Math.min(screen.width, screen.height);
              LOCKED_HEIGHT = Math.max(screen.width, screen.height);
            }
            console.log('🔥 Orientation changed:', LOCKED_WIDTH, 'x', LOCKED_HEIGHT);
          }
        }, 100);
      });
    })();
  </script>

  <!-- 🔥 KEYBOARD CONFIGURATION & VISUAL VIEWPORT FIX -->
  <script>
    // Enable virtual keyboard overlay mode
    if ("virtualKeyboard" in navigator) {
      navigator.virtualKeyboard.overlaysContent = true;
    }

    // 🔥 FIX: Visual Viewport reset on keyboard dismiss
    (function () {
      if (typeof window.visualViewport === 'undefined') return;

      var lastHeight = window.visualViewport.height;

      window.visualViewport.addEventListener('resize', function () {
        var currentHeight = window.visualViewport.height;

        // Keyboard dismissed: height increased significantly
        if (currentHeight > lastHeight + 50) {
          var scrollPos = window.scrollY;
          window.scrollTo(0, scrollPos + 1);
          setTimeout(function () { window.scrollTo(0, scrollPos); }, 50);
          setTimeout(function () { window.dispatchEvent(new Event('resize')); }, 100);
        }

        lastHeight = currentHeight;
      });
    })();
  </script>

  <!-- ✅ Smart App Redirect for Mobile Users -->
  <script>
    (function () {
      // Only run on mobile devices
      var userAgent = navigator.userAgent || navigator.vendor || window.opera;
      var isAndroid = /android/i.test(userAgent);
      var isIOS = /iPad|iPhone|iPod/.test(userAgent) && !window.MSStream;

      if (isAndroid || isIOS) {
        var currentPath = window.location.pathname;
        var currentSearch = window.location.search;
        var fullPath = currentPath + currentSearch;

        // Check if this is a deep linkable path (reels, product, seller-profile)
        if (currentPath.startsWith('/reels/') ||
          currentPath.startsWith('/product/') ||
          currentPath.startsWith('/seller-profile/')) {

          // Try to open the app using custom scheme
          var appUrl = 'letbuyy://open' + fullPath;
          var webUrl = window.location.href;
          var startTime = Date.now();

          // Create a hidden iframe to attempt app open
          var iframe = document.createElement('iframe');
          iframe.style.display = 'none';
          iframe.src = appUrl;
          document.body.appendChild(iframe);

          // Also try direct window.location (works better on some devices)
          setTimeout(function () {
            window.location.href = appUrl;
          }, 25);

          // If still on page after timeout, app is not installed - continue to web
          setTimeout(function () {
            document.body.removeChild(iframe);
          }, 2000);
        }
      }
    })();
  </script>
