<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Example LetBuyy App</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      body {
        margin: 0;
        background: #f8fafc;
        color: #0f172a;
      }

      .example-app {
        min-height: 420px;
        padding: 32px;
      }

      .example-app__panel {
        max-width: 880px;
        border: 1px solid #dbe3ef;
        border-radius: 8px;
        background: #ffffff;
        padding: 24px;
      }

      .example-app__eyebrow {
        margin: 0 0 8px;
        color: #64748b;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: .08em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: 24px;
        line-height: 1.2;
      }

      p {
        color: #475569;
        line-height: 1.6;
      }

      code {
        border-radius: 6px;
        background: #eef2f7;
        padding: 2px 6px;
      }

      .example-app__result {
        margin-top: 20px;
        border-radius: 8px;
        background: #0f172a;
        color: #e2e8f0;
        padding: 16px;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <main class="example-app">
      <section class="example-app__panel">
        <p class="example-app__eyebrow">LetBuyy App Bridge</p>
        <h1>Example embedded app</h1>
        <p>This app is running in an iframe and requesting store data through the parent admin bridge.</p>
        <div id="result" class="example-app__result" data-letbuyy-bridge-result="loading">Connecting...</div>
      </section>
    </main>

    <script src="/letbuyy-app-bridge.js"></script>
    <script>
      (function () {
        var result = document.getElementById('result');

        function write(value, status) {
          result.textContent = value;
          result.setAttribute('data-letbuyy-bridge-result', status);
        }

        window.LetBuyyAppBridge.ready()
          .then(function (context) {
            write('Connected to ' + context.store + '. Loading products...', 'connected');
            return window.LetBuyyAppBridge.request({
              method: 'GET',
              path: 'products?limit=1',
            });
          })
          .then(function (response) {
            write(JSON.stringify({
              status: response.status,
              count: response.data && response.data.data ? response.data.data.length : 0,
              firstProduct: response.data && response.data.data && response.data.data[0]
                ? response.data.data[0].name
                : null,
            }, null, 2), 'success');
            window.LetBuyyAppBridge.toast('Example app loaded store data', 'success');
            window.LetBuyyAppBridge.resize();
          })
          .catch(function (error) {
            write(error.message || 'Bridge request failed', 'error');
            window.LetBuyyAppBridge.toast('Example app bridge request failed', 'error');
            window.LetBuyyAppBridge.resize();
          });
      })();
    </script>
  </body>
</html>
