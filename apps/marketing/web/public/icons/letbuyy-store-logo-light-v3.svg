<svg xmlns="http://www.w3.org/2000/svg" width="636" height="180" viewBox="0 0 636 180" fill="none" role="img" aria-labelledby="lb-title lb-description">
<title id="lb-title">LetBuyy</title>
<desc id="lb-description">LetBuyy: a blue and violet shopping bag with a storefront, a forward sweep and an outlined wordmark. Transparent vector artwork for light backgrounds.</desc>
<defs>
<linearGradient id="lb-bag" x1="30" y1="48" x2="146" y2="161" gradientUnits="userSpaceOnUse"><stop stop-color="#2378FF"/><stop offset=".5" stop-color="#3456EE"/><stop offset="1" stop-color="#7C3AED"/></linearGradient>
<linearGradient id="lb-side" x1="7" y1="64" x2="42" y2="153" gradientUnits="userSpaceOnUse"><stop stop-color="#143DAA"/><stop offset="1" stop-color="#11256B"/></linearGradient>
<linearGradient id="lb-handle" x1="49" y1="40" x2="121" y2="40" gradientUnits="userSpaceOnUse"><stop stop-color="#2C91FF"/><stop offset=".5" stop-color="#435FF0"/><stop offset="1" stop-color="#9951F4"/></linearGradient>
<linearGradient id="lb-roof" x1="39" y1="66" x2="128" y2="91" gradientUnits="userSpaceOnUse"><stop stop-color="#FFFFFF"/><stop offset="1" stop-color="#DCD5FF"/></linearGradient>
<linearGradient id="lb-sweep" x1="8" y1="136" x2="163" y2="136" gradientUnits="userSpaceOnUse"><stop stop-color="#70D9FA"/><stop offset=".4" stop-color="#3B96F5"/><stop offset="1" stop-color="#8B5CF6"/></linearGradient>
<linearGradient id="lb-word" x1="354" y1="63" x2="632" y2="134" gradientUnits="userSpaceOnUse"><stop stop-color="#246BEE"/><stop offset="1" stop-color="#783BEC"/></linearGradient>
</defs>
