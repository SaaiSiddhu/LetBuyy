<rect x="43" y="87" width="87" height="53" rx="7" fill="#122B79" fill-opacity=".83"/>
<path d="M46 99V133H78V99Z" fill="#EDF4FF"/>
<path d="M51 104H72V128H51Z" fill="#A9CBFF"/>
<path d="M88 140V105C88 101 91 98 95 98H113C117 98 120 101 120 105V140Z" fill="#F5F4FF"/>
