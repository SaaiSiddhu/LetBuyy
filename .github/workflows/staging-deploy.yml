name: Staging deploy

on:
  # push trigger disabled: 'develop' branch is fully merged and stale (deleted 2026-06-12
  # per EXECUTION_LEDGER.md LAUNCH-READINESS-P2-5). Active staging deploy lane is
  # deploy-staging.yml (push → stepup/main, governance-gated per FOUNDATION_CLOSURE_2026_06_12).
  # Re-enable only after 'develop' is recreated with governance gate in place.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: staging-deploy
  cancel-in-progress: false

env:
  NODE_VERSION: "20"
  PNPM_VERSION: "10.6.2"
  HAS_SUPABASE_CREDS: ${{ secrets.SUPABASE_ACCESS_TOKEN != '' && secrets.STAGING_DB_CONNECTION_STRING != '' }}
  HAS_CLOUDFLARE_CREDS: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
  HAS_VERCEL_CREDS: ${{ secrets.VERCEL_TOKEN != '' }}

jobs:
  migrate-staging:
    name: Migrate staging DB
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run migrations on staging DB
        if: ${{ env.HAS_SUPABASE_CREDS == 'true' }}
        run: pnpm dlx supabase@latest db push --db-url "${{ secrets.STAGING_DB_CONNECTION_STRING }}" --include-all
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Skip staging migrations
        if: ${{ env.HAS_SUPABASE_CREDS != 'true' }}
        run: echo "SKIP - staging migrations require SUPABASE_ACCESS_TOKEN and STAGING_DB_CONNECTION_STRING."

  deploy-workers-staging:
    name: Deploy workers to staging
    needs: migrate-staging
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workers
        run: pnpm turbo build --filter="@letbuyy/api-gateway" --filter="@letbuyy/webhook-service" --filter="@letbuyy/queue-workers" --filter="@letbuyy/mobile-bff"

      - name: Set api-gateway staging secrets
        if: ${{ env.HAS_CLOUDFLARE_CREDS == 'true' }}
        run: |
          echo "${{ secrets.STAGING_SUPABASE_URL }}" | pnpm exec wrangler secret put SUPABASE_URL --env staging
          echo "${{ secrets.STAGING_SUPABASE_ANON_KEY }}" | pnpm exec wrangler secret put SUPABASE_ANON_KEY --env staging
          echo "${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}" | pnpm exec wrangler secret put SUPABASE_SERVICE_ROLE_KEY --env staging
          echo "${{ secrets.STAGING_AUTH_SECRET }}" | pnpm exec wrangler secret put AUTH_SECRET --env staging
          echo "${{ secrets.STAGING_CUSTOMER_SESSION_SECRET }}" | pnpm exec wrangler secret put CUSTOMER_SESSION_SECRET --env staging
          echo "${{ secrets.STAGING_STEP_UP_SIGNING_SECRET }}" | pnpm exec wrangler secret put STEP_UP_SIGNING_SECRET --env staging
          echo "${{ secrets.STAGING_CSRF_SECRET }}" | pnpm exec wrangler secret put CSRF_SECRET --env staging
          echo "${{ secrets.STAGING_IDENTITY_PUBLIC_JWKS }}" | pnpm exec wrangler secret put LETBUYY_IDENTITY_PUBLIC_JWKS --env staging
          echo "${{ secrets.STAGING_TURNSTILE_SECRET_KEY }}" | pnpm exec wrangler secret put TURNSTILE_SECRET_KEY --env staging
          echo "${{ secrets.STAGING_INTERNAL_API_SECRET }}" | pnpm exec wrangler secret put INTERNAL_API_SECRET --env staging
          echo "${{ secrets.STAGING_INTERNAL_API_SECRET }}" | pnpm exec wrangler secret put LETBUYY_INTERNAL_API_SECRET --env staging
          echo "${{ secrets.STAGING_QUEUE_TENANT_ENVELOPE_SECRET }}" | pnpm exec wrangler secret put QUEUE_TENANT_ENVELOPE_SECRET --env staging
          echo "${{ secrets.STAGING_PLATFORM_CONSOLE_API_TOKEN }}" | pnpm exec wrangler secret put PLATFORM_CONSOLE_API_TOKEN --env staging
          echo "${{ secrets.STAGING_UPSTASH_REDIS_REST_URL }}" | pnpm exec wrangler secret put UPSTASH_REDIS_REST_URL --env staging
          echo "${{ secrets.STAGING_UPSTASH_REDIS_REST_TOKEN }}" | pnpm exec wrangler secret put UPSTASH_REDIS_REST_TOKEN --env staging
          echo "${{ secrets.STAGING_RAZORPAY_KEY_ID }}" | pnpm exec wrangler secret put RAZORPAY_KEY_ID --env staging
          echo "${{ secrets.STAGING_RAZORPAY_KEY_SECRET }}" | pnpm exec wrangler secret put RAZORPAY_KEY_SECRET --env staging
          echo "${{ secrets.STAGING_RAZORPAY_WEBHOOK_SECRET }}" | pnpm exec wrangler secret put RAZORPAY_WEBHOOK_SECRET --env staging
          echo "${{ secrets.STAGING_RESEND_API_KEY }}" | pnpm exec wrangler secret put RESEND_API_KEY --env staging
          echo "${{ secrets.STAGING_PAYMENT_CONFIG_ENCRYPTION_KEY }}" | pnpm exec wrangler secret put PAYMENT_CONFIG_ENCRYPTION_KEY --env staging
        working-directory: services/api-gateway
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy api-gateway to staging
        if: ${{ env.HAS_CLOUDFLARE_CREDS == 'true' }}
        run: pnpm exec wrangler deploy --env staging
        working-directory: services/api-gateway
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Set webhook-service staging secrets
        if: ${{ env.HAS_CLOUDFLARE_CREDS == 'true' }}
        run: |
          echo "${{ secrets.STAGING_INTERNAL_API_SECRET }}" | pnpm exec wrangler secret put INTERNAL_API_SECRET --env staging
          echo "${{ secrets.STAGING_RAZORPAY_WEBHOOK_SECRET }}" | pnpm exec wrangler secret put RAZORPAY_WEBHOOK_SECRET --env staging
          echo "${{ secrets.STAGING_STRIPE_WEBHOOK_SECRET }}" | pnpm exec wrangler secret put STRIPE_WEBHOOK_SECRET --env staging
        working-directory: services/webhook-service
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy webhook-service to staging
        if: ${{ env.HAS_CLOUDFLARE_CREDS == 'true' }}
        run: pnpm exec wrangler deploy --env staging
        working-directory: services/webhook-service
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Set queue-workers staging secrets
        if: ${{ env.HAS_CLOUDFLARE_CREDS == 'true' }}
        run: |
          echo "${{ secrets.STAGING_INTERNAL_API_SECRET }}" | pnpm exec wrangler secret put INTERNAL_API_SECRET --env staging
          echo "${{ secrets.STAGING_QUEUE_TENANT_ENVELOPE_SECRET }}" | pnpm exec wrangler secret put QUEUE_TENANT_ENVELOPE_SECRET --env staging
        working-directory: services/queue-workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy queue-workers to staging
        if: ${{ env.HAS_CLOUDFLARE_CREDS == 'true' }}
        run: pnpm exec wrangler deploy --env staging
        working-directory: services/queue-workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Set mobile-bff staging secrets
        if: ${{ env.HAS_CLOUDFLARE_CREDS == 'true' }}
        run: |
          echo "${{ secrets.STAGING_INTERNAL_API_SECRET }}" | pnpm exec wrangler secret put INTERNAL_API_SECRET --env staging
        working-directory: services/mobile-bff
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy mobile-bff to staging
        if: ${{ env.HAS_CLOUDFLARE_CREDS == 'true' }}
        run: pnpm exec wrangler deploy --env staging
        working-directory: services/mobile-bff
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Skip worker deployment
        if: ${{ env.HAS_CLOUDFLARE_CREDS != 'true' }}
        run: echo "SKIP - staging worker deployment requires Cloudflare credentials."

  deploy-apps-staging:
    name: Deploy Next apps to staging
    needs: deploy-workers-staging
    runs-on: ubuntu-latest
    environment: staging
    strategy:
      matrix:
        include:
          - app: marketing-site
            project_id: STAGING_MARKETING_PROJECT_ID
            app_url: https://www-staging.letbuyy.com
          - app: identity-platform
            project_id: STAGING_IDENTITY_PROJECT_ID
            app_url: https://accounts-staging.letbuyy.com
          - app: merchant-control-plane
            project_id: STAGING_MERCHANT_PROJECT_ID
            app_url: https://admin-staging.letbuyy.com
          - app: storefront-runtime
            project_id: STAGING_STOREFRONT_PROJECT_ID
            app_url: https://store-staging.letbuyy.com
          - app: platform-console
            project_id: STAGING_PLATFORM_CONSOLE_PROJECT_ID
            app_url: https://console-staging.letbuyy.com
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Deploy ${{ matrix.app }} to staging
        if: ${{ env.HAS_VERCEL_CREDS == 'true' }}
        run: pnpm dlx vercel@latest deploy --prod --token "${{ secrets.VERCEL_TOKEN }}" --scope "${{ secrets.VERCEL_ORG_ID }}"
        working-directory: apps/${{ matrix.app }}
        env:
          VERCEL_PROJECT_ID: ${{ secrets[matrix.project_id] }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ secrets.STAGING_TURNSTILE_SITE_KEY }}
          NEXT_PUBLIC_APP_URL: ${{ matrix.app_url }}
          NEXT_PUBLIC_ACCOUNTS_URL: https://accounts-staging.letbuyy.com
          NEXT_PUBLIC_ADMIN_URL: https://admin-staging.letbuyy.com
          NEXT_PUBLIC_API_URL: https://api-staging.letbuyy.com/v1
          NEXT_PUBLIC_API_BASE_URL: https://api-staging.letbuyy.com/v1
          LETBUYY_API_URL: https://api-staging.letbuyy.com/v1
          LETBUYY_API_BASE_URL: https://api-staging.letbuyy.com/v1
          API_URL: https://api-staging.letbuyy.com/v1
          API_BASE_URL: https://api-staging.letbuyy.com/v1
          WORKER_API_BASE_URL: https://api-staging.letbuyy.com/v1
          AUTH_SECRET: ${{ secrets.STAGING_AUTH_SECRET }}
          CUSTOMER_SESSION_SECRET: ${{ secrets.STAGING_CUSTOMER_SESSION_SECRET }}
          LETBUYY_IDENTITY_ISSUER: https://accounts-staging.letbuyy.com
          LETBUYY_IDENTITY_PRIVATE_JWK: ${{ matrix.app == 'identity-platform' && secrets.STAGING_IDENTITY_PRIVATE_JWK || '' }}
          CSRF_SECRET: ${{ secrets.STAGING_CSRF_SECRET }}
          INTERNAL_API_SECRET: ${{ secrets.STAGING_INTERNAL_API_SECRET }}
          RESEND_API_KEY: ${{ secrets.STAGING_RESEND_API_KEY }}
          COOKIE_DOMAIN: .staging.letbuyy.com
          NEXT_PUBLIC_RAZORPAY_KEY_ID: ${{ secrets.STAGING_RAZORPAY_KEY_ID }}
          NODE_ENV: production

      - name: Skip app deployment
        if: ${{ env.HAS_VERCEL_CREDS != 'true' }}
        run: echo "SKIP - staging app deployment requires Vercel credentials."

  smoke-test-staging:
    name: Smoke test staging
    needs: deploy-apps-staging
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install chromium --with-deps

      - name: Run smoke tests against staging
        run: pnpm exec playwright test --project=chromium tests/e2e/smoke/
        env:
          BASE_URL: https://store-staging.letbuyy.com
          ACCOUNTS_URL: https://accounts-staging.letbuyy.com
          ADMIN_URL: https://admin-staging.letbuyy.com
          API_URL: https://api-staging.letbuyy.com/v1
          LETBUYY_E2E_REQUIRE_REAL_STACK: "1"
          LETBUYY_E2E_MARKETING_URL: https://store-staging.letbuyy.com
          LETBUYY_E2E_IDENTITY_URL: https://accounts-staging.letbuyy.com
          LETBUYY_E2E_MERCHANT_URL: https://admin-staging.letbuyy.com
          LETBUYY_E2E_STOREFRONT_URL: https://store-staging.letbuyy.com
          LETBUYY_E2E_API_URL: https://api-staging.letbuyy.com
          LETBUYY_E2E_WEBHOOK_URL: https://webhooks-staging.letbuyy.com
          LETBUYY_E2E_STORE_SUBDOMAIN: ${{ vars.STAGING_E2E_STORE_SUBDOMAIN }}
          LETBUYY_E2E_IDENTITY_EMAIL: ${{ secrets.STAGING_E2E_IDENTITY_EMAIL }}
          LETBUYY_E2E_IDENTITY_PASSWORD: ${{ secrets.STAGING_E2E_IDENTITY_PASSWORD }}
          LETBUYY_E2E_TURNSTILE_TOKEN: ${{ secrets.STAGING_E2E_TURNSTILE_TOKEN }}
          CI: "true"

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: staging-smoke-test-results
          path: playwright-report/
          retention-days: 7
