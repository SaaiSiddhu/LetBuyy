        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pc_cleanup.outputs.artifact_name }}
          path: ${{ steps.pc_cleanup.outputs.payload }}
          retention-days: 90
          if-no-files-found: error
          overwrite: false
      - name: Confirm build evidence preservation
        if: ${{ always() && steps.pc_cleanup_archive.outputs.artifact-id != '' }}
        continue-on-error: true
        uses: ./.project-cleanup/ci
        with:
          phase: archive
        env:
          PROJECT_CLEANUP_ARTIFACT_ID: ${{ steps.pc_cleanup_archive.outputs.artifact-id }}
          PROJECT_CLEANUP_ARTIFACT_DIGEST: ${{ steps.pc_cleanup_archive.outputs.artifact-digest }}
  unit-tests:
    name: Unit tests
    runs-on: ${{ fromJSON(vars.LETBUYY_CI_GENERAL_RUNNER || '"ubuntu-latest"') }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Track protected project cleanup
        id: pc_cleanup
        continue-on-error: true
        uses: ./.project-cleanup/ci
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Use version-bound installed Flutter on the free runner
        if: runner.environment == 'self-hosted' && vars.LETBUYY_CI_FLUTTER_ROOT != ''
        env:
          LETBUYY_CI_FLUTTER_ROOT: ${{ vars.LETBUYY_CI_FLUTTER_ROOT }}
        run: python3 scripts/github/activate-flutter.py --version "$FLUTTER_VERSION"

      - uses: subosito/flutter-action@v2
        if: runner.environment != 'self-hosted' || vars.LETBUYY_CI_FLUTTER_ROOT == ''
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install owned browser prerequisites
        run: pnpm exec playwright install --with-deps chromium

      - name: Install owned marketplace Flutter dependencies
        working-directory: apps/marketplace/mobile
        run: flutter pub get

      - name: Install owned buyer API Dart dependencies
        working-directory: packages/dart/api_client
        run: dart pub get

      - name: Run behavioral gate
        run: pnpm run test:behavioral
        env:
          CI: "true"
          LETBUYY_EXECUTABLE_REPORT_DIR: ${{ runner.temp }}/letbuyy-owned

      - name: Private R2 native runtime proof
        run: node --test tests/runtime/reel-private-r2.workerd.test.mjs

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate LCIS source artifacts for workspace tests
        run: |
          python -m pip install graphifyy==0.8.39
          pnpm run test:prepare:lcis

      - name: Run unit tests
        run: pnpm turbo test --concurrency=2
        env:
          CI: "true"
          LETBUYY_EXECUTABLE_REPORT_DIR: ${{ runner.temp }}/letbuyy-owned

      - name: Preserve owned acceptance diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-tests-owned-diagnostics
          path: ${{ runner.temp }}/letbuyy-owned
          if-no-files-found: ignore
          retention-days: 7

      - name: Snapshot protected build evidence
        id: pc_cleanup_snapshot
        if: ${{ always() && steps.pc_cleanup.outputs.enabled == 'true' }}
        continue-on-error: true
        uses: ./.project-cleanup/ci
        with:
          phase: snapshot
        env:
          PROJECT_CLEANUP_JOB_STATUS: ${{ job.status }}
          PROJECT_CLEANUP_RELEASE: ${{ github.ref_type == 'tag' }}
      - name: Preserve protected build evidence
        id: pc_cleanup_archive
        if: ${{ always() && steps.pc_cleanup_snapshot.outputs.ready == 'true' }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pc_cleanup.outputs.artifact_name }}
          path: ${{ steps.pc_cleanup.outputs.payload }}
          retention-days: 90
          if-no-files-found: error
          overwrite: false
      - name: Confirm build evidence preservation
        if: ${{ always() && steps.pc_cleanup_archive.outputs.artifact-id != '' }}
        continue-on-error: true
        uses: ./.project-cleanup/ci
        with:
          phase: archive
        env:
          PROJECT_CLEANUP_ARTIFACT_ID: ${{ steps.pc_cleanup_archive.outputs.artifact-id }}
          PROJECT_CLEANUP_ARTIFACT_DIGEST: ${{ steps.pc_cleanup_archive.outputs.artifact-digest }}
