        continue-on-error: true
        uses: ./.project-cleanup/ci
        with:
          phase: snapshot
        env:
          PROJECT_CLEANUP_JOB_STATUS: ${{ job.status }}
          PROJECT_CLEANUP_RELEASE: ${{ github.ref_type == 'tag' }}
      - name: Preserve protected build evidence
        id: pc_cleanup_archive
        if: ${{ always() && steps.pc_cleanup_snapshot.outputs.ready == 'true' }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pc_cleanup.outputs.artifact_name }}
          path: ${{ steps.pc_cleanup.outputs.payload }}
          retention-days: 90
