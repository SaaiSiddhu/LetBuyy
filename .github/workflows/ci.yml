      - name: Install Flutter dependencies
        working-directory: apps/merchant/mobile
        run: flutter pub get

      - name: Analyze Flutter app
        working-directory: apps/merchant/mobile
        run: flutter analyze

      - name: Run Flutter tests
        working-directory: apps/merchant/mobile
        run: flutter test

      - name: Build Android debug APK
        working-directory: apps/merchant/mobile
        run: flutter build apk --debug --dart-define-from-file=dart-defines/staging.json

      - name: Build iOS debug app without signing
        working-directory: apps/merchant/mobile
        run: flutter build ios --debug --no-codesign --dart-define-from-file=dart-defines/staging.json

