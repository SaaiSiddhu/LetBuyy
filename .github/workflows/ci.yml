name: CI

# Branch coverage is asserted by scripts/validators/workflow-trigger-coverage-validator.mjs.
# `develop` is retired (see .github/BRANCH_STRATEGY.md) but is deliberately KEPT here as a
# fail-safe: if the branch is ever recreated it stays gated by default. Removing it would
# weaken an existing gate, which ART-02/R-18 forbid.
on:
  pull_request:
    branches:
      - develop
      - main
      - stepup/main
      - codex/web-v1-integration
  push:
    branches:
      - develop
      - main
      - stepup/main
      - codex/web-v1-integration

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"
  PNPM_VERSION: "10.6.2"
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ secrets.TURBO_TEAM }}

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run typecheck
        run: pnpm turbo typecheck --filter="...[HEAD^1]"

  secret-hygiene:
    name: Secret hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Fail on committed credential placeholders
        run: node scripts/validators/committed-secret-placeholder-validator.mjs

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run lint
        run: pnpm turbo lint --filter="...[HEAD^1]"

      - name: Validate design system (theme unification + drift ratchet)
        run: pnpm run validate:design-system

      - name: Lint CSS
        run: pnpm run lint:css

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run behavioral gate
        run: pnpm run test:behavioral
        env:
          CI: "true"

      - name: Run unit tests
        run: pnpm turbo test --filter="...[HEAD^1]"
        env:
          CI: "true"

  merge-safety-gate:
    name: Merge safety gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Full-repo typecheck
        run: pnpm turbo typecheck

      - name: Gateway unit tests
        run: pnpm run test:unit:gateway
        env:
          CI: "true"

      - name: Behavioral tests
        run: pnpm run test:behavioral
        env:
          CI: "true"

      - name: Contract tests
        run: pnpm run test:contracts
        env:
          CI: "true"

      - name: Install merchant mobile Flutter dependencies
        working-directory: apps/merchant_app
        run: flutter pub get

      - name: Merchant mobile analyze
        working-directory: apps/merchant_app
        run: flutter analyze

      - name: Merchant mobile tests
        working-directory: apps/merchant_app
        run: flutter test

  governance:
    name: Governance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate governance
        run: pnpm run validate:governance

  mobile-merchant:
    name: Mobile merchant Flutter
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        working-directory: apps/merchant_app
        run: flutter pub get

      - name: Analyze Flutter app
        working-directory: apps/merchant_app
        run: flutter analyze

      - name: Run Flutter tests
        working-directory: apps/merchant_app
        run: flutter test

      - name: Build Android debug APK
        working-directory: apps/merchant_app
        run: flutter build apk --debug --dart-define-from-file=dart-defines/staging.json

      - name: Build iOS debug app without signing
        working-directory: apps/merchant_app
        run: flutter build ios --debug --no-codesign --dart-define-from-file=dart-defines/staging.json

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all apps and packages
        run: pnpm turbo build --filter="...[HEAD^1]"
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder_anon_key
          NEXT_PUBLIC_APP_URL: https://letbuyy.com
          NEXT_PUBLIC_ACCOUNTS_URL: https://accounts.letbuyy.com
          NEXT_PUBLIC_ADMIN_URL: https://admin.letbuyy.com
          NEXT_PUBLIC_API_URL: https://api.letbuyy.com
          LETBUYY_PLATFORM_DOMAIN: letbuyy.com
          NEXT_PUBLIC_PLATFORM_DOMAIN: letbuyy.com
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: placeholder
          NODE_ENV: production
