  mobile-merchant:
    name: Mobile merchant Flutter
    runs-on: ${{ fromJSON(vars.LETBUYY_CI_MACOS_RUNNER || '"macos-latest"') }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Track protected project cleanup
        id: pc_cleanup
        continue-on-error: true
        uses: ./.project-cleanup/ci
      - name: Use version-bound installed Flutter on the free runner
        if: runner.environment == 'self-hosted' && vars.LETBUYY_CI_FLUTTER_ROOT != ''
        env:
          LETBUYY_CI_FLUTTER_ROOT: ${{ vars.LETBUYY_CI_FLUTTER_ROOT }}
        run: python3 scripts/github/activate-flutter.py --version "$FLUTTER_VERSION"

      - uses: subosito/flutter-action@v2
        if: runner.environment != 'self-hosted' || vars.LETBUYY_CI_FLUTTER_ROOT == ''
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
