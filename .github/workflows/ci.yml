name: CI

# Branch coverage is asserted by scripts/validators/workflow-trigger-coverage-validator.mjs.
# Integration merges are followed by ledger commits. Validate the full workspace
# so a bookkeeping-only final commit cannot hide changes from the tested push.
on:
  pull_request:
    branches:
      - develop
      - staging
      - main
      - stepup/main
      - codex/web-v1-integration
  push:
    branches:
      - develop
      - staging
      - main
      - stepup/main
      - codex/web-v1-integration

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "10.6.2"
  FLUTTER_VERSION: "3.44.8"
  # Keep one browser/catalog suite at a time on the small hosted Linux runner.
  # Each suite still exercises its real internal races and prepared transactions.
  LETBUYY_EXECUTABLE_PG_JOBS: "1"
  # Official Supabase mirror, same v16.2 multi-architecture image. Avoid the
  # anonymous ECR download limit shared by GitHub-hosted runners.
  LETBUYY_EXECUTABLE_REST_IMAGE: ghcr.io/supabase/postgrest:v16.2@sha256:85258123312dc496ad4c2ed832154a65e9746f84df0d6d09b44229ff9230c08e
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ secrets.TURBO_TEAM }}

jobs:
  typecheck:
    name: Typecheck
    runs-on: ${{ fromJSON(vars.LETBUYY_CI_GENERAL_RUNNER || '"ubuntu-latest"') }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Track protected project cleanup
        id: pc_cleanup
        continue-on-error: true
        uses: ./.project-cleanup/ci
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run typecheck
        run: pnpm turbo typecheck

      - name: Snapshot protected build evidence
        id: pc_cleanup_snapshot
        if: ${{ always() && steps.pc_cleanup.outputs.enabled == 'true' }}
        continue-on-error: true
        uses: ./.project-cleanup/ci
        with:
          phase: snapshot
        env:
          PROJECT_CLEANUP_JOB_STATUS: ${{ job.status }}
          PROJECT_CLEANUP_RELEASE: ${{ github.ref_type == 'tag' }}
      - name: Preserve protected build evidence
        id: pc_cleanup_archive
        if: ${{ always() && steps.pc_cleanup_snapshot.outputs.ready == 'true' }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pc_cleanup.outputs.artifact_name }}
          path: ${{ steps.pc_cleanup.outputs.payload }}
          retention-days: 90
          if-no-files-found: error
          overwrite: false
      - name: Confirm build evidence preservation
        if: ${{ always() && steps.pc_cleanup_archive.outputs.artifact-id != '' }}
        continue-on-error: true
        uses: ./.project-cleanup/ci
        with:
          phase: archive
        env:
          PROJECT_CLEANUP_ARTIFACT_ID: ${{ steps.pc_cleanup_archive.outputs.artifact-id }}
          PROJECT_CLEANUP_ARTIFACT_DIGEST: ${{ steps.pc_cleanup_archive.outputs.artifact-digest }}
  secret-hygiene:
    name: Secret hygiene
    runs-on: ${{ fromJSON(vars.LETBUYY_CI_GENERAL_RUNNER || '"ubuntu-latest"') }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Track protected project cleanup
        id: pc_cleanup
        continue-on-error: true
        uses: ./.project-cleanup/ci
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Fail on committed credential placeholders
        run: node scripts/validators/committed-secret-placeholder-validator.mjs

      - name: Snapshot protected build evidence
        id: pc_cleanup_snapshot
        if: ${{ always() && steps.pc_cleanup.outputs.enabled == 'true' }}
        continue-on-error: true
        uses: ./.project-cleanup/ci
        with:
