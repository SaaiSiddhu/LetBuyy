      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run lint
        run: pnpm turbo lint

      - name: Validate design system (theme unification + drift ratchet)
        run: pnpm run validate:design-system

      - name: Lint CSS
        run: pnpm run lint:css

      - name: Snapshot protected build evidence
        id: pc_cleanup_snapshot
        if: ${{ always() && steps.pc_cleanup.outputs.enabled == 'true' }}
        continue-on-error: true
        uses: ./.project-cleanup/ci
        with:
