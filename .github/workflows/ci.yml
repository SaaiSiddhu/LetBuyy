      - name: Preserve owned acceptance diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: merge-safety-gate-owned-diagnostics
          path: ${{ runner.temp }}/letbuyy-owned
          if-no-files-found: ignore
