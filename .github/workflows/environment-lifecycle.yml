name: Environment Lifecycle

on:
  pull_request:
    paths:
      - "config/runtime/environment-lifecycle.json"
      - "config/runtime/rollout-lifecycle.json"
      - "config/runtime/operational-certification-policy.json"
      - "scripts/staging/**"
      - "infrastructure/scripts/load/**"
      - "scripts/validators/operational-lifecycle-validator.mjs"
      - "package.json"
      - ".github/workflows/environment-lifecycle.yml"
  workflow_dispatch:
    inputs:
      deploy_staging:
        description: Deploy staging before running staging proof gates
        required: true
        default: false
        type: boolean

jobs:
  lifecycle-contracts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        run: corepack enable

      - name: Validate lifecycle contracts
        run: node scripts/validators/operational-lifecycle-validator.mjs

      - name: Typecheck
        run: pnpm run typecheck

      - name: Governance gates
        run: pnpm run validate:governance

  staging-proof:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Optional staging deploy
        if: ${{ inputs.deploy_staging }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TF_VAR_cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          LETBUYY_RUNTIME_CACHE_STAGING_NAMESPACE_ID: ${{ secrets.LETBUYY_RUNTIME_CACHE_STAGING_NAMESPACE_ID }}
          LETBUYY_RUNTIME_D1_STAGING_DATABASE_ID: ${{ secrets.LETBUYY_RUNTIME_D1_STAGING_DATABASE_ID }}
          LETBUYY_PROVIDER_MUTATION_APPROVED: ${{ secrets.LETBUYY_PROVIDER_MUTATION_APPROVED }}
          LETBUYY_OPERATIONS_TOKEN: ${{ secrets.LETBUYY_OPERATIONS_TOKEN }}
        run: node infrastructure/scripts/cloudflare/bootstrap-staging.mjs --execute

      - name: Seed staging data
        env:
          STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        run: node scripts/staging/seed.mjs

      - name: Run staging E2E
        env:
          LETBUYY_E2E_BASE_URL: https://merchant.staging.letbuyy.store
          LETBUYY_API_BASE_URL: https://api.staging.letbuyy.store/v1
        run: pnpm exec playwright test tests/e2e/federation --project=chromium
