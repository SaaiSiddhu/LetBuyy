name: Production deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  NODE_VERSION: "20"
  PNPM_VERSION: "10.6.2"
  HAS_SUPABASE_CREDS: ${{ secrets.SUPABASE_ACCESS_TOKEN != '' && secrets.SUPABASE_DB_URL != '' }}
  HAS_CLOUDFLARE_CREDS: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
  HAS_VERCEL_CREDS: ${{ secrets.VERCEL_TOKEN != '' }}

jobs:
  staging-e2e:
    name: E2E tests on staging (production gate)
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install chromium --with-deps

      - name: Run full E2E suite against staging
        run: pnpm exec playwright test --project=chromium tests/e2e/
        env:
          BASE_URL: https://staging.letbuyy.store
          ACCOUNTS_URL: https://accounts.staging.letbuyy.store
          ADMIN_URL: https://admin.staging.letbuyy.store
          API_URL: https://api.staging.letbuyy.store
          CI: "true"

      - name: Upload E2E results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-gate-e2e-results
          path: playwright-report/
          retention-days: 14

  migrate-production:
    name: Migrate production DB
    needs: staging-e2e
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run migrations on production DB
        if: ${{ env.HAS_SUPABASE_CREDS == 'true' }}
        run: pnpm dlx supabase@latest db push --db-url "${{ secrets.SUPABASE_DB_URL }}" --include-all
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Skip production migrations
        if: ${{ env.HAS_SUPABASE_CREDS != 'true' }}
        run: echo "SKIP - production migrations require Supabase credentials."

  deploy-workers-production:
    name: Deploy workers to production
    needs: migrate-production
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workers
        run: pnpm turbo build --filter="@letbuyy/api-gateway" --filter="@letbuyy/webhook-service" --filter="@letbuyy/queue-workers"

      - name: Deploy api-gateway to production
        if: ${{ env.HAS_CLOUDFLARE_CREDS == 'true' }}
        run: pnpm exec wrangler deploy --env production
        working-directory: services/api-gateway
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Set api-gateway production secrets
        if: ${{ env.HAS_CLOUDFLARE_CREDS == 'true' }}
        run: |
          echo "${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" | pnpm exec wrangler secret put SUPABASE_SERVICE_ROLE_KEY --env production
          echo "${{ secrets.UPSTASH_REDIS_REST_URL }}" | pnpm exec wrangler secret put UPSTASH_REDIS_REST_URL --env production
          echo "${{ secrets.UPSTASH_REDIS_REST_TOKEN }}" | pnpm exec wrangler secret put UPSTASH_REDIS_REST_TOKEN --env production
          echo "${{ secrets.RAZORPAY_KEY_SECRET }}" | pnpm exec wrangler secret put RAZORPAY_KEY_SECRET --env production
          echo "${{ secrets.RAZORPAY_WEBHOOK_SECRET }}" | pnpm exec wrangler secret put RAZORPAY_WEBHOOK_SECRET --env production
          echo "${{ secrets.INTERNAL_API_SECRET }}" | pnpm exec wrangler secret put INTERNAL_API_SECRET --env production
          echo "${{ secrets.SESSION_SECRET }}" | pnpm exec wrangler secret put SESSION_SECRET --env production
        working-directory: services/api-gateway
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy webhook-service to production
        if: ${{ env.HAS_CLOUDFLARE_CREDS == 'true' }}
        run: pnpm exec wrangler deploy --env production
        working-directory: services/webhook-service
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Set webhook-service production secrets
        if: ${{ env.HAS_CLOUDFLARE_CREDS == 'true' }}
        run: |
          echo "${{ secrets.RAZORPAY_WEBHOOK_SECRET }}" | pnpm exec wrangler secret put RAZORPAY_WEBHOOK_SECRET --env production
          echo "${{ secrets.STRIPE_WEBHOOK_SECRET }}" | pnpm exec wrangler secret put STRIPE_WEBHOOK_SECRET --env production
        working-directory: services/webhook-service
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy queue-workers to production
        if: ${{ env.HAS_CLOUDFLARE_CREDS == 'true' }}
        run: pnpm exec wrangler deploy --env production
        working-directory: services/queue-workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Skip worker deployment
        if: ${{ env.HAS_CLOUDFLARE_CREDS != 'true' }}
        run: echo "SKIP - production worker deployment requires Cloudflare credentials."

  deploy-apps-production:
    name: Deploy Next apps to production
    needs: deploy-workers-production
    runs-on: ubuntu-latest
    environment: production
    strategy:
      matrix:
        include:
          - app: marketing-site
            project_id: VERCEL_MARKETING_PROJECT_ID
          - app: identity-platform
            project_id: VERCEL_IDENTITY_PROJECT_ID
          - app: merchant-control-plane
            project_id: VERCEL_MERCHANT_PROJECT_ID
          - app: storefront-runtime
            project_id: VERCEL_STOREFRONT_PROJECT_ID
          - app: theme-marketplace
            project_id: VERCEL_THEMES_PROJECT_ID
          - app: app-marketplace
            project_id: VERCEL_APPS_PROJECT_ID
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Deploy ${{ matrix.app }} to production
        if: ${{ env.HAS_VERCEL_CREDS == 'true' }}
        run: pnpm dlx vercel@latest deploy --prod --token "${{ secrets.VERCEL_TOKEN }}" --scope "${{ secrets.VERCEL_ORG_ID }}"
        working-directory: apps/${{ matrix.app }}
        env:
          VERCEL_PROJECT_ID: ${{ secrets[matrix.project_id] }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ secrets.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
          NEXT_PUBLIC_APP_URL: https://letbuyy.store
          NEXT_PUBLIC_ACCOUNTS_URL: https://accounts.letbuyy.store
          NEXT_PUBLIC_ADMIN_URL: https://admin.letbuyy.store
          NEXT_PUBLIC_API_URL: https://api.letbuyy.store
          WORKER_API_BASE_URL: https://api.letbuyy.store
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          INTERNAL_API_SECRET: ${{ secrets.INTERNAL_API_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          COOKIE_DOMAIN: .letbuyy.store
          NEXT_PUBLIC_RAZORPAY_KEY_ID: ${{ secrets.RAZORPAY_KEY_ID }}
          NODE_ENV: production

      - name: Skip app deployment
        if: ${{ env.HAS_VERCEL_CREDS != 'true' }}
        run: echo "SKIP - production app deployment requires Vercel credentials."

  smoke-test-production:
    name: Smoke test production
    needs: deploy-apps-production
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install chromium --with-deps

      - name: Run smoke tests against production
        run: pnpm exec playwright test --project=chromium tests/e2e/smoke/
        env:
          BASE_URL: https://letbuyy.store
          ACCOUNTS_URL: https://accounts.letbuyy.store
          ADMIN_URL: https://admin.letbuyy.store
          API_URL: https://api.letbuyy.store
          CI: "true"

      - name: Upload smoke test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-smoke-test-results
          path: playwright-report/
          retention-days: 30
