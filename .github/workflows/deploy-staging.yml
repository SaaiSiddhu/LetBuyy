name: Deploy Staging

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    environment: staging
    env:
      HAS_CLOUDFLARE_STAGING_CREDS: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' && secrets.LETBUYY_RUNTIME_CACHE_STAGING_NAMESPACE_ID != '' && secrets.LETBUYY_RUNTIME_D1_STAGING_DATABASE_ID != '' }}
      HAS_VERCEL_STAGING_CREDS: ${{ secrets.VERCEL_TOKEN != '' && secrets.VERCEL_ORG_ID != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10.6.2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Deploy staging Cloudflare Workers
        if: ${{ env.HAS_CLOUDFLARE_STAGING_CREDS == 'true' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TF_VAR_cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          LETBUYY_RUNTIME_CACHE_STAGING_NAMESPACE_ID: ${{ secrets.LETBUYY_RUNTIME_CACHE_STAGING_NAMESPACE_ID }}
          LETBUYY_RUNTIME_D1_STAGING_DATABASE_ID: ${{ secrets.LETBUYY_RUNTIME_D1_STAGING_DATABASE_ID }}
          LETBUYY_PROVIDER_MUTATION_APPROVED: ${{ secrets.LETBUYY_PROVIDER_MUTATION_APPROVED }}
          LETBUYY_OPERATIONS_TOKEN: ${{ secrets.LETBUYY_OPERATIONS_TOKEN }}
        run: node infrastructure/scripts/deploy/production-deploy.mjs --environment=staging --target=workers --execute --skip-validation

      - name: Skip staging Cloudflare Workers
        if: ${{ env.HAS_CLOUDFLARE_STAGING_CREDS != 'true' }}
        run: |
          echo "SKIP: staging Cloudflare Worker deployment requires CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, and staging binding ids."

      - name: Deploy staging Vercel apps
        if: ${{ env.HAS_VERCEL_STAGING_CREDS == 'true' }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
        run: node infrastructure/scripts/deploy/production-deploy.mjs --environment=staging --target=apps --execute --skip-validation

      - name: Skip staging Vercel apps
        if: ${{ env.HAS_VERCEL_STAGING_CREDS != 'true' }}
        run: |
          echo "SKIP: staging Vercel deployment requires VERCEL_TOKEN and VERCEL_ORG_ID."
