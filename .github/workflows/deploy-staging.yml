name: Deploy Staging

on:
  push:
    branches: [stepup/main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-staging
  cancel-in-progress: false

env:
  HAS_CLOUDFLARE_CREDS: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
  HAS_VERCEL_CREDS: ${{ secrets.VERCEL_TOKEN != '' && secrets.VERCEL_ORG_ID != '' }}

jobs:
  governance-gate:
    name: Governance Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run governance gate
        run: node scripts/validate-governance.mjs --lane=gate

      - name: Reject untracked Supabase migrations
        run: |
          UNTRACKED=$(git ls-files --others --exclude-standard database/supabase/migrations/)
          if [ -n "$UNTRACKED" ]; then
            echo "Untracked Supabase migrations are forbidden before staging deploy:"
            echo "$UNTRACKED"
            exit 1
          fi

  deploy-workers:
    name: Deploy Cloudflare Workers (Staging)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: governance-gate

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build active workers
        run: |
          pnpm turbo build --filter=@letbuyy/api-gateway
          pnpm turbo build --filter=@letbuyy/mobile-bff
          pnpm turbo build --filter=@letbuyy/webhook-service
          pnpm turbo build --filter=@letbuyy/queue-workers

      - name: Deploy api-gateway staging
        if: ${{ env.HAS_CLOUDFLARE_CREDS == 'true' }}
        run: pnpm exec wrangler deploy --env staging
        working-directory: services/api-gateway
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy webhook-service staging
        if: ${{ env.HAS_CLOUDFLARE_CREDS == 'true' }}
        run: pnpm exec wrangler deploy --env staging
        working-directory: services/webhook-service
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy mobile-bff staging
        if: ${{ env.HAS_CLOUDFLARE_CREDS == 'true' }}
        run: pnpm exec wrangler deploy --env staging
        working-directory: services/mobile-bff
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy queue-workers staging
        if: ${{ env.HAS_CLOUDFLARE_CREDS == 'true' }}
        run: pnpm exec wrangler deploy --env staging
        working-directory: services/queue-workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Skip worker deployment
        if: ${{ env.HAS_CLOUDFLARE_CREDS != 'true' }}
        run: 'echo "SKIP: staging Cloudflare Worker deployment requires CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID."'

  deploy-apps:
    name: Deploy Vercel Apps (Staging)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [governance-gate, deploy-workers]

    strategy:
      matrix:
        app:
          - { name: identity-platform, project_secret: STAGING_IDENTITY_PROJECT_ID }
          - { name: merchant_web, project_secret: STAGING_MERCHANT_PROJECT_ID }
          - { name: customer_web, project_secret: STAGING_STOREFRONT_PROJECT_ID }
          - { name: marketing-site, project_secret: STAGING_MARKETING_PROJECT_ID }
          - { name: admin_web, project_secret: STAGING_PLATFORM_CONSOLE_PROJECT_ID }

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Deploy ${{ matrix.app.name }} to staging
        if: ${{ env.HAS_VERCEL_CREDS == 'true' }}
        run: |
          if [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "SKIP: missing Vercel project id for ${{ matrix.app.name }} staging."
            exit 0
          fi
          pnpm dlx vercel@latest pull --yes --environment=preview --token="$VERCEL_TOKEN"
          pnpm dlx vercel@latest build --token="$VERCEL_TOKEN"
          pnpm dlx vercel@latest deploy --prebuilt --token="$VERCEL_TOKEN"
        working-directory: apps/${{ matrix.app.name }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets[matrix.app.project_secret] }}

      - name: Skip app deployment
        if: ${{ env.HAS_VERCEL_CREDS != 'true' }}
        run: 'echo "SKIP: staging Vercel deployment requires VERCEL_TOKEN and VERCEL_ORG_ID."'

  smoke-test-staging:
    name: Smoke Test Staging
    runs-on: ubuntu-latest
    needs: [deploy-workers, deploy-apps]

    steps:
      - name: Skip smoke tests without deploy credentials
        if: ${{ env.HAS_CLOUDFLARE_CREDS != 'true' || env.HAS_VERCEL_CREDS != 'true' }}
        run: 'echo "SKIP: staging smoke tests require successful worker and app deployment credentials."'

      - name: API health check
        if: ${{ env.HAS_CLOUDFLARE_CREDS == 'true' && env.HAS_VERCEL_CREDS == 'true' }}
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://api-staging.letbuyy.com/v1/health)
          if [ "$STATUS" != "200" ]; then echo "API health check failed: $STATUS"; exit 1; fi
          echo "API staging healthy"

      - name: Accounts health check
        if: ${{ env.HAS_CLOUDFLARE_CREDS == 'true' && env.HAS_VERCEL_CREDS == 'true' }}
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://accounts-staging.letbuyy.com)
          if [ "$STATUS" != "200" ]; then echo "Accounts health check failed: $STATUS"; exit 1; fi
          echo "Accounts staging healthy"

      - name: Admin health check
        if: ${{ env.HAS_CLOUDFLARE_CREDS == 'true' && env.HAS_VERCEL_CREDS == 'true' }}
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://admin-staging.letbuyy.com)
          if [ "$STATUS" != "200" ] && [ "$STATUS" != "302" ]; then
            echo "Admin health check failed: $STATUS"
            exit 1
          fi
          echo "Admin staging healthy"

      - name: Platform console health check
        if: ${{ env.HAS_CLOUDFLARE_CREDS == 'true' && env.HAS_VERCEL_CREDS == 'true' }}
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://console-staging.letbuyy.com)
          if [ "$STATUS" != "200" ] && [ "$STATUS" != "302" ]; then
            echo "Console staging health check failed: $STATUS"
            exit 1
          fi
          echo "Console staging healthy"
