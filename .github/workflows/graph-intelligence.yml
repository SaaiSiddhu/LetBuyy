name: Graph Intelligence (DB layer)

# Regenerates the database intelligence on every push/PR and uploads it as an artifact.
# Pure Node — parses database/supabase/migrations + the gateway's db.rpc call sites.
# Does NOT need the Graphify binary or the (gitignored) code graph, so it always runs in CI.
# Advisory only; the authoritative blocking gate remains scripts/validate-governance.mjs.

on:
  push:
    paths:
      - 'database/supabase/migrations/**'
      - 'services/api-gateway/src/**'
      - 'tools/graph-server/**'
  pull_request:
    paths:
      - 'database/supabase/migrations/**'
      - 'services/api-gateway/src/**'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  db-intelligence:
    name: Extract + sanity-check the database graph
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Extract database intelligence
        run: node tools/graph-server/db-intel.mjs
      - name: Extract infrastructure intelligence
        run: node tools/graph-server/infra-intel.mjs
      - name: Extract domain intelligence (v3)
        run: node tools/graph-server/domain-intel.mjs
      - name: Regenerate data-driven reports
        run: node tools/graph-server/gen-reports.mjs
      - name: Regenerate v3 domain reports
        run: node tools/graph-server/gen-v3-reports.mjs
      - name: Extract v4 memory/runtime/deployment/execution intelligence
        run: |
          node tools/graph-server/memory-intel.mjs
          node tools/graph-server/runtime-intel.mjs
          node tools/graph-server/deployment-state.mjs
          node tools/graph-server/execution-intel.mjs
      - name: Regenerate v4 reports
        run: node tools/graph-server/gen-v4-reports.mjs
      - name: Extract v5 live operating intelligence
        run: |
          node tools/graph-server/runtime-observability-intel.mjs
          node tools/graph-server/merchant-intelligence.mjs
          node tools/graph-server/revenue-intelligence.mjs
          node tools/graph-server/deployment-intelligence-v5.mjs
          node tools/graph-server/security-intelligence-v5.mjs
          node tools/graph-server/incident-intelligence-v5.mjs
          node tools/graph-server/customer-journey-intelligence.mjs
          node tools/graph-server/production-readiness-intel.mjs
          node tools/graph-server/decision-engine-v5.mjs
          node tools/graph-server/autonomous-discovery-v5.mjs
      - name: Regenerate v5 reports
        run: node tools/graph-server/gen-v5-reports.mjs
      - name: Extract Omega intelligence (merchant/customer/revenue/cost/telemetry/memory/fix/unified)
        run: |
          node tools/graph-server/merchant-health-intel.mjs
          node tools/graph-server/merchant-growth-intel.mjs
          node tools/graph-server/merchant-adoption-intel.mjs
          node tools/graph-server/merchant-risk-intel.mjs
          node tools/graph-server/merchant-churn-intel.mjs
          node tools/graph-server/customer-intelligence-v2.mjs
          node tools/graph-server/revenue-intelligence-v2.mjs
          node tools/graph-server/cost-intelligence.mjs
          node tools/graph-server/telemetry-intelligence.mjs
          node tools/graph-server/memory-v2.mjs
          node tools/graph-server/fix-engine.mjs
          node tools/graph-server/discovery-v2.mjs
          node tools/graph-server/production-readiness-v2.mjs
          node tools/graph-server/decision-engine-v2.mjs
          node tools/graph-server/unified-intelligence-engine.mjs
      - name: Regenerate Omega reports
        run: node tools/graph-server/gen-omega-reports.mjs
      - name: Extract Mission Control intelligence (relationships/environment/graphs/operations)
        run: |
          node tools/graph-server/relationship-intel.mjs
          node tools/graph-server/environment-intel.mjs
          node tools/graph-server/knowledge-graphs.mjs
          node tools/graph-server/operations-center.mjs
      - name: Extract V7 live-OS intelligence (connections/health/audit/dashboard)
        run: |
          node tools/graph-server/connections-intel.mjs
          node tools/graph-server/production-health.mjs
          node tools/graph-server/audit-engine-v2.mjs
          node tools/graph-server/mission-control-dashboard.mjs
      - name: Extract OS ecosystem intelligence (theme/apps/developer)
        run: node tools/graph-server/ecosystem-intel.mjs
      - name: Extract Omega live layer (environment registry + runbooks; adapters stay NOT CONNECTED in CI)
        run: |
          node tools/graph-server/environment-registry.mjs
          node tools/graph-server/runbook-engine.mjs
      - name: Extract Genesis control centers (composition; live values stay NOT CONNECTED in CI)
        run: |
          node tools/graph-server/database-control-intel.mjs
          node tools/graph-server/environment-control-intel.mjs
          node tools/graph-server/infrastructure-control-intel.mjs
          node tools/graph-server/commerce-control-intel.mjs
          node tools/graph-server/launch-command-center.mjs
      - name: Regenerate v6 explain/onboarding docs (dual-mode operating system)
        run: node tools/graph-server/gen-explain-docs.mjs
      - name: Sanity gate — schema must parse to non-trivial counts
        run: |
          node -e "const s=require('./graphify-out/db-intel.json').summary; if(s.tables<100||s.functions<50){console.error('DB intel parse looks degraded',s);process.exit(1)} console.log('DB intel OK:',s.tables,'tables,',s.functions,'functions,',s.policies,'policies')"
      - name: Upload database intelligence artifact
        uses: actions/upload-artifact@v4
        with:
          name: db-intelligence
          path: |
            graphify-out/db-intel.json
            graphify-out/infra-intel.json
            graphify-out/domain-intel.json
            docs/central-intelligence/DATABASE_INTELLIGENCE_REPORT.generated.md
            docs/central-intelligence/DOMAIN_INTELLIGENCE_REPORT.generated.md
          retention-days: 14
