name: Production Rollout

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        default: staging
        type: choice
        options:
          - dev
          - staging
          - production
      target:
        description: Deployment target
        required: true
        default: all
        type: choice
        options:
          - all
          - cloudflare
          - workers
          - apps
      execute:
        description: Execute changes instead of plan-only validation
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write
  attestations: write

concurrency:
  group: production-rollout-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  rollout:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.5

      - name: Install dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Governance gates
        run: pnpm run validate:governance

      - name: Operational lifecycle gates
        run: pnpm run validate:lifecycle

      - name: Runtime safety gates
        run: pnpm run validate:runtime

      - name: Runtime reconciliation gates
        run: pnpm run validate:reconciliation

      - name: Survivability intelligence gates
        run: pnpm run validate:survivability-intelligence

      - name: Distributed execution gates
        run: pnpm run validate:distributed-execution

      - name: Durable execution recovery gates
        run: pnpm run validate:durable-execution

      - name: Distributed survivability finalization gates
        run: pnpm run validate:distributed-survivability

      - name: Operational certification evidence gates
        run: pnpm run validate:operational-certification

      - name: Replay safety gates
        run: pnpm run validate:replay

      - name: Deployment safety gates
        run: pnpm run validate:deployment

      - name: Rollback integrity gates
        run: pnpm run validate:rollback

      - name: Queue lifecycle gates
        run: pnpm run validate:queues

      - name: Runtime topology gates
        run: pnpm run validate:topology

      - name: Dependency governance gates
        run: pnpm run validate:dependencies

      - name: Migration safety gates
        run: pnpm run validate:migrations

      - name: Cloudflare isolation gates
        run: pnpm run validate:cloudflare

      - name: Security governance gates
        run: pnpm run validate:security

      - name: Survivability governance gates
        run: pnpm run validate:survivability

      - name: Governance tests
        run: pnpm run test

      - name: Typecheck
        run: pnpm run typecheck

      - name: Security gates
        run: node infrastructure/scripts/security/verify-security-gates.mjs

      - name: Dependency vulnerability scan
        run: pnpm audit --audit-level high --prod

      - name: Phase 4 ultimate validation plan
        if: ${{ !inputs.execute }}
        run: node infrastructure/scripts/operations/phase4-ultimate-validate.mjs --environment=${{ inputs.environment }}

      - name: Survivability suite plan
        if: ${{ !inputs.execute }}
        run: node infrastructure/scripts/operations/run-survivability-suite.mjs --environment=${{ inputs.environment }} --mode=plan

      - name: Phase 4 ultimate validation execute
        if: ${{ inputs.execute }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TF_VAR_cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          PROMETHEUS_URL: ${{ secrets.PROMETHEUS_URL }}
          GRAFANA_URL: ${{ secrets.GRAFANA_URL }}
          GRAFANA_TOKEN: ${{ secrets.GRAFANA_TOKEN }}
          OTEL_COLLECTOR_HEALTH_URL: ${{ secrets.OTEL_COLLECTOR_HEALTH_URL }}
          LETBUYY_OPERATIONS_TOKEN: ${{ secrets.LETBUYY_OPERATIONS_TOKEN }}
        run: node infrastructure/scripts/operations/phase4-ultimate-validate.mjs --environment=${{ inputs.environment }} --execute

      - name: Survivability suite execute
        if: ${{ inputs.execute }}
        env:
          LETBUYY_SURVIVABILITY_EXECUTION_APPROVED: ${{ secrets.LETBUYY_SURVIVABILITY_EXECUTION_APPROVED }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TF_VAR_cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          PROMETHEUS_URL: ${{ secrets.PROMETHEUS_URL }}
          GRAFANA_URL: ${{ secrets.GRAFANA_URL }}
          GRAFANA_TOKEN: ${{ secrets.GRAFANA_TOKEN }}
          OTEL_COLLECTOR_HEALTH_URL: ${{ secrets.OTEL_COLLECTOR_HEALTH_URL }}
          LETBUYY_OPERATIONS_TOKEN: ${{ secrets.LETBUYY_OPERATIONS_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: node infrastructure/scripts/operations/run-survivability-suite.mjs --environment=${{ inputs.environment }} --mode=execute

      - name: Production rollout plan
        if: ${{ !inputs.execute }}
        run: node infrastructure/scripts/deploy/production-deploy.mjs --environment=${{ inputs.environment }} --target=${{ inputs.target }}

      - name: Production rollout execute
        if: ${{ inputs.execute }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TF_VAR_cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          PROMETHEUS_URL: ${{ secrets.PROMETHEUS_URL }}
          GRAFANA_URL: ${{ secrets.GRAFANA_URL }}
          GRAFANA_TOKEN: ${{ secrets.GRAFANA_TOKEN }}
          OTEL_COLLECTOR_HEALTH_URL: ${{ secrets.OTEL_COLLECTOR_HEALTH_URL }}
          LETBUYY_RUNTIME_CACHE_DEV_NAMESPACE_ID: ${{ secrets.LETBUYY_RUNTIME_CACHE_DEV_NAMESPACE_ID }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          LETBUYY_OPERATIONS_TOKEN: ${{ secrets.LETBUYY_OPERATIONS_TOKEN }}
        run: node infrastructure/scripts/deploy/production-deploy.mjs --environment=${{ inputs.environment }} --target=${{ inputs.target }} --execute

      - name: Generate SBOM
        run: pnpm dlx @cyclonedx/cyclonedx-npm --output-file sbom.cdx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ inputs.environment }}
          path: sbom.cdx.json
