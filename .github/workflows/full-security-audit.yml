name: Full Security Audit (weekly)

# Weekly whole-repository AI security audit + the deterministic governance security
# validators. Produces an artifact and (optionally) opens an issue on new findings.
# Requires repository secret ANTHROPIC_API_KEY.

on:
  schedule:
    # Mondays 04:30 UTC (10:00 IST) — low-traffic window.
    - cron: '30 4 * * 1'
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write
  security-events: write

jobs:
  governance-security-validators:
    name: Deterministic security validators
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run security-relevant governance validators
        run: |
          node scripts/validators/canonical-ledger-only-validator.mjs
          node scripts/validators/no-public-using-true-validator.mjs
          node scripts/validators/rls-force-coverage-validator.mjs
          node scripts/validators/no-blanket-service-role-validator.mjs
          node scripts/validators/identity-sole-issuer-validator.mjs

  claude-full-audit:
    name: AI full-repository security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run Claude security review (whole repo)
        uses: anthropics/claude-code-security-review@main
        with:
          comment-pr: false
          claude-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
