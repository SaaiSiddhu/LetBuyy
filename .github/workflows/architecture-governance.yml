name: Architecture Governance

on:
  pull_request:
    paths:
      - "apps/**"
      - "services/**"
      - "packages/**"
      - "database/**"
      - "config/env/**"
      - "config/runtime/**"
      - "infrastructure/**"
      - "docs/governance/**"
      - "scripts/validators/**"
      - "scripts/governance/**"
      - "scripts/generators/**"
      - "scripts/migration/**"
      - "scripts/utilities/**"
      - "scripts/validate-governance.mjs"
      - "scripts/validate-architecture.mjs"
      - "AGENTS.md"
      - "**/AGENTS.md"
      - "**/runtime.manifest.json"
      - "package.json"
      - "pnpm-workspace.yaml"
      - ".github/CODEOWNERS"
      - ".github/workflows/architecture-governance.yml"
  push:
    branches:
      - main
      - master
      - "codex/**"

jobs:
  validate-architecture:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate governance
        run: node scripts/validate-governance.mjs
