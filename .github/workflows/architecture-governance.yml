name: Architecture Governance

on:
  pull_request:
    paths:
      - "apps/**"
      - "services/**"
      - "packages/**"
      - "database/**"
      - "config/env/**"
      - "config/runtime/**"
      - "infrastructure/**"
      - "docs/governance/**"
      - "scripts/validators/**"
      - "scripts/governance/**"
      - "scripts/generators/**"
      - "scripts/migration/**"
      - "scripts/utilities/**"
      - "scripts/validate-governance.mjs"
      - "scripts/validate-architecture.mjs"
      - "AGENTS.md"
      - "**/AGENTS.md"
      - "**/runtime.manifest.json"
      - "package.json"
      - "pnpm-workspace.yaml"
      - ".github/CODEOWNERS"
      - ".github/workflows/architecture-governance.yml"
      - ".github/workflows/environment-lifecycle.yml"
      - ".github/workflows/dev-runtime-deployment.yml"
      - ".github/workflows/live-production-certification.yml"
      - ".github/workflows/production-rollout.yml"
  push:
    branches:
      - main
      - master
      - "codex/**"

jobs:
  validate-architecture:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Validate governance
        run: pnpm run validate:governance

      - name: Validate runtime safety
        run: pnpm run validate:runtime

      - name: Validate runtime reconciliation
        run: pnpm run validate:reconciliation

      - name: Validate survivability intelligence
        run: pnpm run validate:survivability-intelligence

      - name: Validate distributed execution
        run: pnpm run validate:distributed-execution

      - name: Validate durable execution recovery
        run: pnpm run validate:durable-execution

      - name: Validate replay safety
        run: pnpm run validate:replay

      - name: Validate deployment safety
        run: pnpm run validate:deployment

      - name: Validate rollback integrity
        run: pnpm run validate:rollback

      - name: Validate queue lifecycle
        run: pnpm run validate:queues

      - name: Validate runtime topology
        run: pnpm run validate:topology

      - name: Validate operational runtime topology
        run: node scripts/validators/distributed-runtime-validator.mjs

      - name: Validate production readiness topology
        run: node scripts/validators/production-readiness-validator.mjs

      - name: Validate dependency governance
        run: pnpm run validate:dependencies

      - name: Validate TypeScript governance
        run: pnpm run validate:typescript

      - name: Validate survivability governance
        run: pnpm run validate:survivability

      - name: Run governance tests
        run: pnpm run test

      - name: Typecheck workspace
        run: pnpm run typecheck

      - name: Generate SBOM
        run: pnpm dlx @cyclonedx/cyclonedx-npm --output-file sbom.cdx.json

      - name: Dependency audit
        run: pnpm audit --audit-level high --prod
