name: Architecture Governance

on:
  pull_request:
    paths:
      - "apps/**"
      - "services/**"
      - "packages/**"
      - "database/**"
      - "config/env/**"
      - "config/runtime/**"
      - "infrastructure/**"
      - "docs/governance/**"
      - "scripts/validators/**"
      - "scripts/governance/**"
      - "scripts/generators/**"
      - "scripts/migration/**"
      - "scripts/utilities/**"
      - "scripts/validate-governance.mjs"
      - "scripts/validate-architecture.mjs"
      - "AGENTS.md"
      - "**/AGENTS.md"
      - "**/runtime.manifest.json"
      - "package.json"
      - "pnpm-workspace.yaml"
      - ".github/CODEOWNERS"
      - ".github/workflows/architecture-governance.yml"
      - ".github/workflows/environment-lifecycle.yml"
      - ".github/workflows/live-production-certification.yml"
      - ".github/workflows/production-rollout.yml"
  # "codex/**" covers the Web V1 integration branch (codex/web-v1-integration).
  # The pull_request trigger above is path-scoped and base-branch agnostic, so PRs
  # into any branch are covered; unscoped coverage comes from ci.yml.
  push:
    branches:
      - main
      - master
      - "codex/**"

jobs:
  # Every gate step below runs with continue-on-error so that a failure in an early
  # step (historically "Validate governance") can no longer hide the results of
  # typecheck and the test suite. The job's pass/fail is re-imposed, unweakened, by
  # the final `gate-aggregate` step: if ANY step above did not succeed, the job fails.
  # Setup steps (checkout/node/install) intentionally keep hard fail-fast, because
  # nothing downstream can produce a meaningful result without them.
  validate-architecture:
    runs-on: ${{ fromJSON(vars.LETBUYY_CI_GENERAL_RUNNER || '"ubuntu-latest"') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Track protected project cleanup
        id: pc_cleanup
        continue-on-error: true
        uses: ./.project-cleanup/ci
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Validate governance
        id: validate-governance
        continue-on-error: true
        run: pnpm run validate:governance

      - name: Validate workflow trigger coverage
        id: validate-workflow-triggers
        continue-on-error: true
        run: pnpm run validate:workflow-triggers

      - name: Validate design system
        id: validate-design-system
        continue-on-error: true
        run: pnpm run validate:design-system

      - name: Lint CSS
        id: lint-css
        continue-on-error: true
        run: pnpm run lint:css

      - name: Validate design-token interchange (tokens.json ↔ tokens.ts)
        id: validate-design-tokens
        continue-on-error: true
        run: pnpm run validate:design-tokens

      - name: Validate mobile token parity
        id: validate-mobile-tokens
        continue-on-error: true
        run: pnpm run validate:mobile-tokens

      - name: Validate runtime safety
        id: validate-runtime
        continue-on-error: true
        run: pnpm run validate:runtime

      - name: Validate operational execution gates
        id: validate-operational-gates
        continue-on-error: true
        run: |
          pnpm run validate:reconciliation
          pnpm run validate:rollback
          pnpm run validate:queues

      - name: Validate deployment safety
        id: validate-deployment
        continue-on-error: true
        run: pnpm run validate:deployment

      - name: Validate runtime topology
        id: validate-topology
        continue-on-error: true
        run: pnpm run validate:topology

      - name: Validate production readiness
        id: validate-production-readiness
        continue-on-error: true
        run: node scripts/validators/production-readiness-validator.mjs

      - name: Validate dependency governance
        id: validate-dependencies
        continue-on-error: true
        run: pnpm run validate:dependencies

      - name: Validate TypeScript governance
        id: validate-typescript
        continue-on-error: true
        run: pnpm run validate:typescript

      - name: Run governance tests
        id: governance-tests
        continue-on-error: true
        run: pnpm run test

      - name: Typecheck workspace
        id: typecheck
        continue-on-error: true
        run: pnpm run typecheck

      - name: Generate SBOM
        id: sbom
        continue-on-error: true
        # Read-only tool version; installation/builds retain pnpm10.6.2.
        # Native lockfile inventory includes every resolved workspace dependency.
        run: pnpm dlx pnpm@11.28.11 --config.pm-on-fail=ignore sbom --sbom-format cyclonedx --lockfile-only --out sbom.cdx.json

      - name: Dependency audit
        id: dependency-audit
        continue-on-error: true
        run: pnpm audit --audit-level high --prod

      - name: Snapshot protected build evidence
        id: pc_cleanup_snapshot
        if: ${{ always() && steps.pc_cleanup.outputs.enabled == 'true' }}
        continue-on-error: true
        uses: ./.project-cleanup/ci
        with:
          phase: snapshot
        env:
          PROJECT_CLEANUP_JOB_STATUS: ${{ contains(steps.*.outcome, 'failure') && 'failure' || contains(steps.*.outcome, 'cancelled') && 'cancelled' || job.status }}
          PROJECT_CLEANUP_RELEASE: ${{ github.ref_type == 'tag' }}
      - name: Preserve protected build evidence
        id: pc_cleanup_archive
        if: ${{ always() && steps.pc_cleanup_snapshot.outputs.ready == 'true' }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pc_cleanup.outputs.artifact_name }}
          path: ${{ steps.pc_cleanup.outputs.payload }}
          retention-days: 90
          if-no-files-found: error
          overwrite: false
      - name: Confirm build evidence preservation
        id: pc_cleanup_confirm
        if: ${{ always() && steps.pc_cleanup_archive.outputs.artifact-id != '' }}
        continue-on-error: true
        uses: ./.project-cleanup/ci
        with:
          phase: archive
        env:
          PROJECT_CLEANUP_ARTIFACT_ID: ${{ steps.pc_cleanup_archive.outputs.artifact-id }}
          PROJECT_CLEANUP_ARTIFACT_DIGEST: ${{ steps.pc_cleanup_archive.outputs.artifact-digest }}
      - name: Architecture governance gate result
        id: gate-aggregate
        if: always()
        env:
          OUTCOME_CLEANUP_SETUP: ${{ steps.pc_cleanup.outcome }}
          OUTCOME_CLEANUP_SNAPSHOT: ${{ steps.pc_cleanup_snapshot.outcome }}
          OUTCOME_CLEANUP_ARCHIVE: ${{ steps.pc_cleanup_archive.outcome }}
          OUTCOME_CLEANUP_CONFIRM: ${{ steps.pc_cleanup_confirm.outcome }}
          OUTCOME_VALIDATE_GOVERNANCE: ${{ steps.validate-governance.outcome }}
          OUTCOME_VALIDATE_WORKFLOW_TRIGGERS: ${{ steps.validate-workflow-triggers.outcome }}
          OUTCOME_VALIDATE_DESIGN_SYSTEM: ${{ steps.validate-design-system.outcome }}
          OUTCOME_LINT_CSS: ${{ steps.lint-css.outcome }}
          OUTCOME_VALIDATE_DESIGN_TOKENS: ${{ steps.validate-design-tokens.outcome }}
          OUTCOME_VALIDATE_MOBILE_TOKENS: ${{ steps.validate-mobile-tokens.outcome }}
          OUTCOME_VALIDATE_RUNTIME: ${{ steps.validate-runtime.outcome }}
          OUTCOME_VALIDATE_OPERATIONAL_GATES: ${{ steps.validate-operational-gates.outcome }}
          OUTCOME_VALIDATE_DEPLOYMENT: ${{ steps.validate-deployment.outcome }}
          OUTCOME_VALIDATE_TOPOLOGY: ${{ steps.validate-topology.outcome }}
          OUTCOME_VALIDATE_PRODUCTION_READINESS: ${{ steps.validate-production-readiness.outcome }}
          OUTCOME_VALIDATE_DEPENDENCIES: ${{ steps.validate-dependencies.outcome }}
          OUTCOME_VALIDATE_TYPESCRIPT: ${{ steps.validate-typescript.outcome }}
          OUTCOME_GOVERNANCE_TESTS: ${{ steps.governance-tests.outcome }}
          OUTCOME_TYPECHECK: ${{ steps.typecheck.outcome }}
          OUTCOME_SBOM: ${{ steps.sbom.outcome }}
          OUTCOME_DEPENDENCY_AUDIT: ${{ steps.dependency-audit.outcome }}
        run: |
          set -u
          failed=0
          echo "Architecture governance step results"
          echo "===================================="
          for pair in $(env | { grep -E '^OUTCOME_[A-Z_]+=' || true; } | sort); do
            name="${pair%%=*}"
            value="${pair#*=}"
            printf '%-40s %s\n' "${name#OUTCOME_}" "${value:-missing}"
            if [ "${value:-missing}" = "skipped" ]; then
              case "$name" in
                OUTCOME_CLEANUP_SNAPSHOT|OUTCOME_CLEANUP_ARCHIVE|OUTCOME_CLEANUP_CONFIRM) continue ;;
              esac
            fi
            if [ "${value:-missing}" != "success" ]; then
              failed=1
            fi
          done
          if [ "$failed" -ne 0 ]; then
            echo "::error::Architecture governance gate FAILED. Every non-success step above must be fixed; no step result is masked by fail-fast ordering."
            exit 1
          fi
          echo "All architecture governance steps succeeded."
