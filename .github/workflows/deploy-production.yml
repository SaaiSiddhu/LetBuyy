name: Deploy Production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  HAS_CLOUDFLARE_CREDS: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
  HAS_VERCEL_CREDS: ${{ secrets.VERCEL_TOKEN != '' && secrets.VERCEL_ORG_ID != '' }}

jobs:
  deploy-workers:
    name: Deploy Cloudflare Workers (Production)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build active workers
        run: |
          pnpm turbo build --filter=@letbuyy/api-gateway
          pnpm turbo build --filter=@letbuyy/webhook-service
          pnpm turbo build --filter=@letbuyy/queue-workers

      - name: Deploy api-gateway production
        if: ${{ env.HAS_CLOUDFLARE_CREDS == 'true' }}
        run: pnpm exec wrangler deploy --env production
        working-directory: services/api-gateway
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy webhook-service production
        if: ${{ env.HAS_CLOUDFLARE_CREDS == 'true' }}
        run: pnpm exec wrangler deploy --env production
        working-directory: services/webhook-service
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy queue-workers production
        if: ${{ env.HAS_CLOUDFLARE_CREDS == 'true' }}
        run: pnpm exec wrangler deploy --env production
        working-directory: services/queue-workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Skip worker deployment
        if: ${{ env.HAS_CLOUDFLARE_CREDS != 'true' }}
        run: 'echo "SKIP: production Cloudflare Worker deployment requires CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID."'

  deploy-apps:
    name: Deploy Vercel Apps (Production)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: deploy-workers

    strategy:
      matrix:
        app:
          - { name: identity-platform, project_secret: PRODUCTION_IDENTITY_PROJECT_ID }
          - { name: merchant-control-plane, project_secret: PRODUCTION_MERCHANT_PROJECT_ID }
          - { name: storefront-runtime, project_secret: PRODUCTION_STOREFRONT_PROJECT_ID }
          - { name: marketing-site, project_secret: PRODUCTION_MARKETING_PROJECT_ID }
          - { name: app-marketplace, project_secret: PRODUCTION_APP_MARKETPLACE_PROJECT_ID }
          - { name: theme-marketplace, project_secret: PRODUCTION_THEME_MARKETPLACE_PROJECT_ID }
          - { name: platform-console, project_secret: PRODUCTION_PLATFORM_CONSOLE_PROJECT_ID }
          - { name: platform-operations-portal, project_secret: PRODUCTION_PLATFORM_OPERATIONS_PORTAL_PROJECT_ID }

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Deploy ${{ matrix.app.name }} to production
        if: ${{ env.HAS_VERCEL_CREDS == 'true' }}
        run: |
          if [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "SKIP: missing Vercel project id for ${{ matrix.app.name }} production."
            exit 0
          fi
          pnpm dlx vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN"
          pnpm dlx vercel@latest build --prod --token="$VERCEL_TOKEN"
          pnpm dlx vercel@latest deploy --prebuilt --prod --token="$VERCEL_TOKEN"
        working-directory: apps/${{ matrix.app.name }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets[matrix.app.project_secret] }}

      - name: Skip app deployment
        if: ${{ env.HAS_VERCEL_CREDS != 'true' }}
        run: 'echo "SKIP: production Vercel deployment requires VERCEL_TOKEN and VERCEL_ORG_ID."'

  smoke-test-production:
    name: Smoke Test Production
    runs-on: ubuntu-latest
    needs: [deploy-workers, deploy-apps]

    steps:
      - name: Skip smoke tests without deploy credentials
        if: ${{ env.HAS_CLOUDFLARE_CREDS != 'true' || env.HAS_VERCEL_CREDS != 'true' }}
        run: 'echo "SKIP: production smoke tests require successful worker and app deployment credentials."'

      - name: API health check
        if: ${{ env.HAS_CLOUDFLARE_CREDS == 'true' && env.HAS_VERCEL_CREDS == 'true' }}
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://api.letbuyy.store/v1/health)
          if [ "$STATUS" != "200" ]; then echo "API production failed: $STATUS"; exit 1; fi
          echo "API production healthy"

      - name: Platform health checks
        if: ${{ env.HAS_CLOUDFLARE_CREDS == 'true' && env.HAS_VERCEL_CREDS == 'true' }}
        run: |
          for URL in \
            "https://accounts.letbuyy.store" \
            "https://admin.letbuyy.store" \
            "https://www.letbuyy.store" \
            "https://apps.letbuyy.store" \
            "https://themes.letbuyy.store" \
            "https://console.letbuyy.store" \
            "https://ops.letbuyy.store"; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$URL")
            if [ "$STATUS" != "200" ] && [ "$STATUS" != "302" ]; then
              echo "$URL failed: $STATUS"
              exit 1
            fi
            echo "$URL healthy"
          done
